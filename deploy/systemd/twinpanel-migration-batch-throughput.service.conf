# Install to /etc/systemd/system/twinpanel-migration-batch.service.d/30-safe-load.conf
# Validated on 16-core production: 192 node/protocol pairs in 2 cycles;
# retain independent API-readiness/load guards and WireGuard mutual exclusion.
[Service]
ExecCondition=/bin/sh -c "! systemctl is-active --quiet twinpanel-migration-wireguard-batch.service"
Environment=MIGRATION_SINGBOX_BATCH_SIZE=24
Environment=MIGRATION_STAGE_SUBS=6
Environment=MIGRATION_RUN_CYCLES=2
CPUQuota=150%
CPUWeight=40
IOWeight=30
Nice=10
