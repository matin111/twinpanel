# France-only TwinTunnel OpenVPN TCP hairpin client.
# Travels France -> Iran TCP:37951 -> Rakhsh 4 carriers -> France OpenVPN.
# No redirect-gateway, no DNS, no production IPs.
remote 94.183.231.158 37982
proto udp
dev tunTTudpc
dev-type tun
ifconfig 10.254.202.2 10.254.202.1
tls-client
nobind
resolv-retry infinite
connect-retry 2 5
ca /etc/twintunnel-ovpn-test/ca.crt
cert /etc/twintunnel-ovpn-test/hairpin-client.crt
key /etc/twintunnel-ovpn-test/hairpin-client.key
remote-cert-tls server
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM
auth SHA256
disable-dco
keepalive 3 15
reneg-sec 0
persist-key
verb 4
status /run/twintunnel-ovpn-udp-client.status 2