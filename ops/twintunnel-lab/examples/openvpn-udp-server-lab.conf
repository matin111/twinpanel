# Isolated TwinTunnel OpenVPN TCP trial. Not a production config.
local 127.0.0.1
port 37984
proto udp
dev tunTTudps
dev-type tun
ifconfig 10.254.202.1 10.254.202.2
tls-server
ca /etc/twintunnel-ovpn-test/ca.crt
cert /etc/twintunnel-ovpn-test/server.crt
key /etc/twintunnel-ovpn-test/server.key
dh none
remote-cert-tls client
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM
auth SHA256
disable-dco
keepalive 3 15
reneg-sec 0
persist-key
verb 3
status /run/twintunnel-ovpn-udp-server.status 2