name: TwinPanel Exit Bootstrap V71 Retirement Guard

on:
  pull_request:
    paths:
      - 'backend/app/node_bootstrap_control_v71.py'
      - 'backend/app/node_bootstrap_control_v72.py'
      - 'backend/app/routers/__init__.py'
      - '.github/workflows/exit-bootstrap-exec-relay-v71-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Compile historical v71 and active v72 modules
        run: |
          python3 -m py_compile backend/app/node_bootstrap_control_v71.py
          python3 -m py_compile backend/app/node_bootstrap_control_v72.py

      - name: Verify v71 cannot become an active fallback again
        run: |
          python3 - <<'PY'
          from pathlib import Path

          routers = Path('backend/app/routers/__init__.py').read_text(encoding='utf-8')
          v72 = Path('backend/app/node_bootstrap_control_v72.py').read_text(encoding='utf-8')

          if 'node_bootstrap_control_v71' in routers:
              raise SystemExit('V71 exec relay must remain retired from runtime imports')
          if 'node_bootstrap_control_v72' not in routers:
              raise SystemExit('V72 runtime import missing')
          if 'proxy_command=' in v72:
              raise SystemExit('V72 must not reintroduce AsyncSSH proxy_command')
          if 'tunnel=' in v72:
              raise SystemExit('V72 must not reintroduce AsyncSSH direct-tcpip')
          if 'node_bootstrap_control_v66' not in routers:
              raise SystemExit('V66/V70 compatibility base missing')
          if routers.index('node_bootstrap_control_v66') > routers.index('node_bootstrap_control_v72'):
              raise SystemExit('V72 must load after V66/V70')
          if routers.index('node_bootstrap_control_v72') > routers.index('destructive_safety'):
              raise SystemExit('V72 must load before destructive routes')

          print('EXIT_BOOTSTRAP_V71_RETIRED=PASS')
          PY
