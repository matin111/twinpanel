name: TwinPanel Exit Bootstrap Exec Relay V71 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/node_bootstrap_control_v71.py'
      - 'backend/app/routers/__init__.py'
      - '.github/workflows/exit-bootstrap-exec-relay-v71-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Compile V71 bootstrap module
        run: python3 -m py_compile backend/app/node_bootstrap_control_v71.py

      - name: Verify exec-stream fallback contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('backend/app/node_bootstrap_control_v71.py').read_text(encoding='utf-8')
          routers = Path('backend/app/routers/__init__.py').read_text(encoding='utf-8')

          required = [
              'TWINPANEL NODE BOOTSTRAP CONTROL PLANE V71',
              'python3',
              'socket.create_connection',
              'proxy_command=proxy',
              'via_iran_exec_bootstrap_',
              'via_iran_exec_management_',
              'password=str(payload.password)',
              'client_keys=[str(node_key)]',
              'provision.ssh_connect = ssh_connect_bootstrap_v71',
              'provision.ssh_connect_saved = ssh_connect_saved_v71',
          ]

          missing = [item for item in required if item not in module]
          if missing:
              raise SystemExit('missing V71 contracts: ' + ', '.join(missing))

          forbidden = [
              'tunnel=iran_conn',
              'ip route add',
              'iptables -A',
              'wg set',
              'kernel_gre',
          ]
          present = [item for item in forbidden if item in module]
          if present:
              raise SystemExit('V71 must not depend on direct-tcpip/data-plane: ' + ', '.join(present))

          if 'node_bootstrap_control_v71' not in routers:
              raise SystemExit('V71 runtime import missing')
          if routers.index('node_bootstrap_control_v66') > routers.index('node_bootstrap_control_v71'):
              raise SystemExit('V71 must load after V66/V70')
          if routers.index('node_bootstrap_control_v71') > routers.index('destructive_safety'):
              raise SystemExit('V71 must load before destructive routes')

          print('EXIT_BOOTSTRAP_EXEC_RELAY_V71=PASS')
          PY
