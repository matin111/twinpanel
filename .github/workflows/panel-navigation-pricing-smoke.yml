name: TwinPanel Panel Navigation and Reseller Pricing Smoke

on:
  pull_request:
    paths:
      - 'components/ui.tsx'
      - 'components/portal-shells.tsx'
      - 'components/reseller-plans-traffic-v3.tsx'
      - 'lib/reseller-runtime-api.ts'
      - '.github/workflows/panel-navigation-pricing-smoke.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify navigation and pricing contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin=Path('components/ui.tsx').read_text(encoding='utf-8')
          portal=Path('components/portal-shells.tsx').read_text(encoding='utf-8')
          pricing=Path('components/reseller-plans-traffic-v3.tsx').read_text(encoding='utf-8')
          api=Path('lib/reseller-runtime-api.ts').read_text(encoding='utf-8')

          assert 'return <a key={h} href={h}' in admin
          assert 'return <a href={href}' in portal
          assert 'import Link from "next/link"' not in portal
          assert 'value<0' in pricing
          assert 'value<=0' not in pricing
          assert 'min={1} value={drafts[id]' not in pricing
          assert 'Number(row.id||row.reseller_plan_id||0)' in pricing
          assert 'Number(row.plan_id||row.id||0)' not in pricing
          assert 'resellerApi.updatePlan(planId,{sell_price_toman:value})' in pricing
          assert 'updatePlan:' in api
          assert 'method:"PATCH"' in api

          print('PANEL_NAVIGATION_PRICING_CONTRACT_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --include=optional --no-audit --no-fund
          fi

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE: ''
        run: npm run build
