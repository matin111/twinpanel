name: Subscription Create Fast V1 Smoke

on:
  pull_request:
    paths:
      - 'components/admin-manual-subscription-create.tsx'
      - 'lib/subscription-create-fast-api.ts'
      - 'backend/app/routers/subscription_create_fast_v1.py'
      - 'backend/app/routers/modern_account_delivery_v1.py'
      - 'backend/app/services/hard_async_timeout.py'
      - 'backend/tests/test_subscription_create_stuck_spinner_v1.py'
      - 'backend/tests/test_subscription_provision_timeout_v1.py'
      - 'backend/app/routers/__init__.py'
      - '.github/workflows/subscription-create-fast-v1-smoke.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immediate create and backend provisioning contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('components/admin-manual-subscription-create.tsx').read_text(encoding='utf-8')
          client = Path('lib/subscription-create-fast-api.ts').read_text(encoding='utf-8')
          endpoint = Path('backend/app/routers/subscription_create_fast_v1.py').read_text(encoding='utf-8')
          delivery = Path('backend/app/routers/modern_account_delivery_v1.py').read_text(encoding='utf-8')
          init = Path('backend/app/routers/__init__.py').read_text(encoding='utf-8')

          assert 'createSubscriptionFastV1' in ui
          assert 'adminApi.provisionSubscription' not in ui
          assert '/v1/subscriptions/admin-create-fast-v1' in client
          assert 'SUBSCRIPTION_CREATE_REQUEST_TIMEOUT_MS=135_000' not in client
          assert 'new AbortController()' not in client
          assert 'signal:controller.signal' not in client
          assert 'from fastapi import APIRouter, BackgroundTasks, Depends, HTTPException' in endpoint
          assert 'def _persist_subscription(' in endpoint
          assert 'async def _provision_subscription_background(' in endpoint
          assert '@router.post("/admin-create-fast-v1", status_code=202)' in endpoint
          assert 'background_tasks.add_task(' in endpoint
          assert '"queued": True' in endpoint
          assert '"provisioning_complete": False' in endpoint
          assert 'dependencies=[Depends(require_admin)]' in endpoint
          assert 'from ..services.hard_async_timeout import await_hard_timeout' in delivery
          assert delivery.count('await await_hard_timeout(') >= 2
          assert '_runtime_endpoints.router.include_router(_subscription_create_fast_v1_router)' in init

          print('SUBSCRIPTION_CREATE_FAST_V1_BACKGROUND_CONTRACT_OK')
          PY

      - name: Compile endpoint, delivery and hard timeout helper
        run: |
          python -m py_compile backend/app/routers/subscription_create_fast_v1.py
          python -m py_compile backend/app/routers/modern_account_delivery_v1.py
          python -m py_compile backend/app/services/hard_async_timeout.py

      - name: Install focused backend regression dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run create and provisioning regressions
        run: |
          pytest -q \
            backend/tests/test_subscription_create_stuck_spinner_v1.py \
            backend/tests/test_subscription_provision_timeout_v1.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend
        run: npm run build
