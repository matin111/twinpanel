name: Subscription Create Fast V1 Smoke

on:
  pull_request:
    paths:
      - 'components/admin-manual-subscription-create.tsx'
      - 'lib/subscription-create-fast-api.ts'
      - 'backend/app/routers/subscription_create_fast_v1.py'
      - 'backend/app/services/asyncssh_close_guard.py'
      - 'backend/tests/test_subscription_create_stuck_spinner_v1.py'
      - 'backend/tests/test_subscription_provision_timeout_v1.py'
      - 'backend/app/routers/__init__.py'
      - '.github/workflows/subscription-create-fast-v1-smoke.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify isolated fast create contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('components/admin-manual-subscription-create.tsx').read_text(encoding='utf-8')
          client = Path('lib/subscription-create-fast-api.ts').read_text(encoding='utf-8')
          endpoint = Path('backend/app/routers/subscription_create_fast_v1.py').read_text(encoding='utf-8')
          init = Path('backend/app/routers/__init__.py').read_text(encoding='utf-8')

          assert 'createSubscriptionFastV1' in ui
          assert 'adminApi.provisionSubscription' not in ui
          assert '/v1/subscriptions/admin-create-fast-v1' in client
          assert 'SUBSCRIPTION_CREATE_REQUEST_TIMEOUT_MS=135_000' in client
          assert 'new AbortController()' in client
          assert 'signal:controller.signal' in client
          assert 'asyncio.create_task' not in endpoint
          assert '_TASKS' not in endpoint
          assert 'from .subscription_admin_v2 import AdminSubscriptionCreateV2, admin_create_v2' in endpoint
          assert endpoint.index('from .subscription_admin_v2 import AdminSubscriptionCreateV2, admin_create_v2') > endpoint.index('async def _run_create')
          assert 'install_asyncssh_close_guard()' in endpoint
          assert 'await admin_create_v2' in endpoint
          assert '@router.post("/admin-create-fast-v1")' in endpoint
          assert 'status_code=202' not in endpoint
          assert 'result["queued"] = False' in endpoint
          assert 'result["provisioning_complete"] = True' in endpoint
          assert 'dependencies=[Depends(require_admin)]' in endpoint
          assert '_runtime_endpoints.router.include_router(_subscription_create_fast_v1_router)' in init

          print('SUBSCRIPTION_CREATE_FAST_V1_FAIL_CLOSED_CONTRACT_OK')
          PY

      - name: Compile endpoint and SSH close guard
        run: |
          python -m py_compile backend/app/routers/subscription_create_fast_v1.py
          python -m py_compile backend/app/services/asyncssh_close_guard.py

      - name: Install focused backend regression dependencies
        run: python -m pip install --disable-pip-version-check pytest asyncssh

      - name: Run stuck-spinner timeout regressions
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_subscription_create_stuck_spinner_v1.py \
            backend/tests/test_subscription_provision_timeout_v1.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend
        run: npm run build
