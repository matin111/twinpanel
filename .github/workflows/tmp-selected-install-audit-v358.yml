name: TMP Selected Install Audit V358

on:
  push:
    branches:
      - feature/selected-initial-transport-v358

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print selected install and carrier setup context
        shell: bash
        run: |
          set -euo pipefail
          echo '===== INSTALL MODERN TRANSPORT 900-1060 ====='
          sed -n '900,1060p' backend/app/routers/modern_transports.py
          echo '===== MANUAL SELECT 750-930 ====='
          sed -n '750,930p' backend/app/routers/modern_transports.py
          echo '===== TP27 INSTALL ANCHORS ====='
          grep -nE '^async def install|managed_preflight|agent|fabric|candidate_health' backend/app/transport_candidates/tp27_fast.py || true
          LINE="$(grep -n '^async def install' backend/app/transport_candidates/tp27_fast.py | head -n1 | cut -d: -f1 || true)"
          if [ -n "$LINE" ]; then START=$((LINE>80?LINE-80:1)); END=$((LINE+220)); sed -n "${START},${END}p" backend/app/transport_candidates/tp27_fast.py; fi
          echo '===== SPOOF INSTALL ANCHORS ====='
          grep -nE '^async def install|managed_preflight|agent|fabric|configuration_from_text|candidate_health' backend/app/transport_candidates/spoof_wg.py || true
          LINE="$(grep -n '^async def install' backend/app/transport_candidates/spoof_wg.py | head -n1 | cut -d: -f1 || true)"
          if [ -n "$LINE" ]; then START=$((LINE>80?LINE-80:1)); END=$((LINE+240)); sed -n "${START},${END}p" backend/app/transport_candidates/spoof_wg.py; fi
