name: TwinPanel Release Gate

on:
  pull_request:
    branches:
      - release/stable-v1
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twinpanel
          POSTGRES_PASSWORD: twinpanel_test
          POSTGRES_DB: twinpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twinpanel -d twinpanel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: postgresql+psycopg2://twinpanel:twinpanel_test@127.0.0.1:5432/twinpanel
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095
      TWINPANEL_ADMIN_EMAIL: admin-ci@example.com
      TWINPANEL_ADMIN_PASSWORD: TwinPanel-CI-Admin-2027!
      TWINPANEL_ADMIN_NAME: TwinPanel CI Admin
      TWINPANEL_LICENSE_ENFORCE: "0"
      TWINPANEL_RELEASE_MANIFEST_URL: https://raw.githubusercontent.com/matin111/tp27-core/main/twinpanel/releases/stable.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell files
        run: bash -n installer/install.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare runtime directories
        run: |
          sudo install -d -m 700 /etc/twinpanel
          sudo install -d -m 700 /var/lib/twinpanel-backups
          sudo install -d -m 700 /var/lib/twinpanel-license
          sudo chown -R "$(id -u):$(id -g)" /etc/twinpanel /var/lib/twinpanel-backups /var/lib/twinpanel-license

      - name: Compile backend and updater
        run: |
          python -m compileall -q backend/app backend/scripts
          python -m py_compile backend/app/system_release.py
          python -m py_compile backend/app/license_guard.py
          python -m py_compile backend/app/routers/system_release.py
          python -m py_compile backend/scripts/twinpanel_updater.py

      - name: Import API and verify release routes
        working-directory: backend
        run: |
          python - <<'PY'
          from app.main import app

          routes = {getattr(route, "path", "") for route in app.routes}
          required = {
              "/v1/admin/system/release/status",
              "/v1/admin/system/release/check",
              "/v1/admin/system/update",
              "/v1/admin/system/license",
              "/v1/admin/system/license/validate",
              "/v1/admin/system/license/trial",
              "/v1/admin/system/license/activate",
          }
          missing = sorted(required - routes)
          assert not missing, missing
          print("RELEASE_ROUTES_OK", len(required))
          PY

      - name: Bootstrap admin
        working-directory: backend
        run: python scripts/bootstrap_admin.py

      - name: Start API
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8095 > /tmp/twinpanel-release-api.log 2>&1 &
          echo $! > /tmp/twinpanel-release-api.pid

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8095/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/twinpanel-release-api.log
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend
        run: npm run build

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/twinpanel-release-api.log 2>/dev/null || true
