name: TMP Managed Bootstrap Audit V358

on:
  push:
    branches:
      - feature/selected-initial-transport-v358

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print managed bootstrap authority
        shell: bash
        run: |
          set -euo pipefail
          echo '===== MANAGED SYMBOLS ====='
          grep -nE '_create_managed_tunnel_locked|_run_direct_transport_phase|_tp_managed_preflight_pair|_prepare_tunnel_node|_install_tunnel_fabric_base|_install_or_upgrade_agent|register_tunnel_pair' backend/app/routers/tunnel_managed.py backend/app/routers/tunnels.py || true
          echo '===== MANAGED CREATE CONTEXT ====='
          LINE="$(grep -n 'async def _create_managed_tunnel_locked' backend/app/routers/tunnel_managed.py | head -n1 | cut -d: -f1 || true)"
          if [ -n "$LINE" ]; then START=$((LINE>140?LINE-140:1)); END=$((LINE+420)); sed -n "${START},${END}p" backend/app/routers/tunnel_managed.py; fi
          echo '===== PREPARE NODE CONTEXT ====='
          LINE="$(grep -n 'async def _prepare_tunnel_node' backend/app/routers/tunnels.py | head -n1 | cut -d: -f1 || true)"
          if [ -n "$LINE" ]; then START=$((LINE>30?LINE-30:1)); END=$((LINE+120)); sed -n "${START},${END}p" backend/app/routers/tunnels.py; fi
          echo '===== MANAGED PREFLIGHT PAIR CALLERS ====='
          grep -RIn '_tp_managed_preflight_pair' backend/app | head -n 30 || true
