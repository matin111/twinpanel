name: license-center-v1-smoke

on:
  pull_request:
    paths:
      - "components/license-center.tsx"
      - "components/routed-page-client-v2.tsx"
      - "components/ui.tsx"
      - ".github/workflows/license-center-v1-smoke.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify minimal license popup contract
        run: |
          grep -Fq 'routeKey==="admin/license"' components/routed-page-client-v2.tsx
          grep -Fq '"/admin/license"' components/ui.tsx
          grep -Fq '/v1/admin/system/license/activate' components/license-center.tsx
          grep -Fq 'expires_at' components/license-center.tsx
          grep -Fq 'import {Shell} from "./ui";' components/license-center.tsx
          grep -Fq '<Shell active="/admin/license">' components/license-center.tsx
          grep -Fq 'className="runtime-modal"' components/license-center.tsx
          grep -Fq 'className="runtime-modal-bg"' components/license-center.tsx
          grep -Fq 'className="runtime-modal-card"' components/license-center.tsx
          grep -Fq 'زمان باقی‌مانده' components/license-center.tsx
          grep -Fq 'تاریخ انقضا' components/license-center.tsx
