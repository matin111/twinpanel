name: Simple Add Node Smoke

on:
  pull_request:
    paths:
      - 'components/provision-runtime-xray-domain.tsx'
      - 'components/ui.tsx'
      - 'lib/legacy-admin-api.ts'
      - '.github/workflows/simple-add-node-smoke.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify base-only add-node with canonical Exit Xray convergence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('components/provision-runtime-xray-domain.tsx').read_text()
          nav = Path('components/ui.tsx').read_text()

          # Initial registration stays base-only. Protocol Studio remains the
          # single installer/repair owner instead of reintroducing a second
          # protocol installer in the Add Server request.
          for marker in (
              'install_cisco:false',
              'install_openvpn:false',
              'install_wireguard:false',
              'install_l2tp:false',
              'install_v2ray:false',
              'parityApi.provisionInstall',
              '/admin/modern-protocols?node=${createdNodeId}',
              'ثبت و آماده‌سازی سرور',
              'تست SSH',
          ):
              assert marker in ui, marker

          assert 'install_v2ray:true' not in ui

          # Every newly registered Exit converges the required Xray baseline
          # through the exact same canonical API used by Protocol Studio.
          for marker in (
              'legacyAdminApi.ensureClassicProtocol',
              'requestedNodeType==="exit"',
              'protocol:"v2ray"',
              'port:NO_PROTOCOLS.xray_port',
              'setBaselineV2ray("ready")',
              'setBaselineV2ray("failed")',
              'v2ray_baseline',
          ):
              assert marker in ui, marker

          assert ui.index('parityApi.provisionInstall') < ui.index('legacyAdminApi.ensureClassicProtocol')

          for removed in (
              'Protocols & ports',
              'پروتکل‌ها و پورت‌ها',
              'function Toggle(',
              'xray_domain:string',
              'saveXrayDomain(',
              'prepareXrayDomain(',
          ):
              assert removed not in ui, removed

          assert '["افزودن سرور","Add Server","/admin/provision","⚡"]' in nav
          assert '["پروتکل‌ها","Protocols","/admin/modern-protocols","◫"]' in nav

          print('SIMPLE_ADD_NODE_XRAY_CONVERGENCE_OK')
          PY
