name: Node Auto Backfill Durable V1

on:
  pull_request:
    paths:
      - "backend/app/node_auto_backfill_v1.py"
      - "backend/app/main.py"
      - "backend/app/routers/__init__.py"
      - "backend/app/routers/publish_node_all_users_v2.py"
      - "backend/scripts/twinpanel_existing_node_backfill_v1.py"
      - "backend/scripts/twinpanel_migration_singbox_batch.py"
      - "backend/scripts/twinpanel_migration_classic_sequential_v3.py"
      - "backend/tests/test_node_auto_backfill_v1.py"
      - "components/node-auto-backfill-panel.tsx"
      - "components/legacy-nodes-exact.tsx"
      - "components/legacy-nodes-runtime-v2.tsx"
      - "components/node-add-modal-bridge.tsx"
      - ".github/workflows/node-auto-backfill-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      APP_SECRET_KEY: node-auto-backfill-test-only
      DATABASE_URL: sqlite:///./node-auto-backfill-ci.sqlite3
      NODE_AGENT_SHARED_SECRET: node-auto-agent-test-only
      PYTHONPATH: backend
      TWINPANEL_AUTO_NODE_BACKFILL_V1: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Compile node queue and existing workers
        run: |
          python -m py_compile backend/app/node_auto_backfill_v1.py backend/app/main.py
          python -m py_compile backend/app/routers/publish_node_all_users_v2.py
          python -m py_compile backend/scripts/twinpanel_existing_node_backfill_v1.py
          python -m py_compile backend/scripts/twinpanel_migration_singbox_batch.py
          python -m py_compile backend/scripts/twinpanel_migration_classic_sequential_v3.py
      - name: New durable node queue and existing node safety contracts
        run: |
          python -m pytest -q backend/tests/test_node_auto_backfill_v1.py
          python -m pytest -q backend/tests/test_existing_node_backfill_v1.py
          python -m pytest -q backend/tests/test_fast_node_publishing_v1.py
      - name: Existing node retirement safety smoke
        run: python backend/tests/strict_node_delete_owned_state_v600_smoke.py
