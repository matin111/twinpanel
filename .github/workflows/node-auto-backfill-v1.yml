name: Automatic Existing Node Backfill Queue V1

on:
  pull_request:
    paths:
      - "backend/app/node_auto_backfill_job_models_v1.py"
      - "backend/app/services/node_auto_backfill_queue_v1.py"
      - "backend/app/services/central_node_entitlements_v1.py"
      - "backend/scripts/twinpanel_existing_node_xray_backfill_v1.py"
      - "backend/scripts/twinpanel_existing_node_backfill_v1.py"
      - "backend/app/xray_profile_reconcile_v36.py"
      - "backend/app/services/node_auto_backfill_worker_v1.py"
      - "backend/app/routers/publish_node_all_users_v2.py"
      - "backend/app/main.py"
      - "components/node-add-modal-bridge.tsx"
      - "backend/tests/test_fast_node_publishing_v1.py"
      - "backend/tests/test_node_auto_backfill_queue_v1.py"
      - "backend/tests/test_node_central_v2ray_backfill_v1.py"
      - "backend/tests/test_existing_node_backfill_v1.py"
      - ".github/workflows/node-auto-backfill-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: backend
      APP_SECRET_KEY: ci-only-node-backfill
      DATABASE_URL: sqlite:///./node-backfill-ci.sqlite3
      NODE_AGENT_SHARED_SECRET: ci-only-node-backfill-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test tools
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            backend/app/node_auto_backfill_job_models_v1.py \
            backend/app/services/node_auto_backfill_queue_v1.py \
            backend/app/services/central_node_entitlements_v1.py \
            backend/app/xray_profile_reconcile_v36.py \
            backend/scripts/twinpanel_existing_node_backfill_v1.py \
            backend/scripts/twinpanel_existing_node_xray_backfill_v1.py \
            backend/app/services/node_auto_backfill_worker_v1.py \
            backend/app/routers/publish_node_all_users_v2.py \
            backend/app/main.py
      - name: Node queue / publish / pause / crash recovery tests
        run: |
          python -m pytest -q \
            backend/tests/test_node_auto_backfill_queue_v1.py \
            backend/tests/test_node_central_v2ray_backfill_v1.py \
            backend/tests/test_fast_node_publishing_v1.py \
            backend/tests/test_existing_node_backfill_v1.py
      - name: Legacy node publish safety contracts
        run: |
          python backend/tests/nonblocking_node_publish_v601_smoke.py
          python backend/tests/strict_node_delete_owned_state_v600_smoke.py
