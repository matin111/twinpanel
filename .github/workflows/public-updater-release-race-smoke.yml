name: TwinPanel Public Updater Release Race Smoke

on:
  pull_request:
    paths:
      - 'backend/scripts/twinpanel_public_updater.py'
      - 'VERSION'
      - '.github/workflows/public-updater-release-race-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify updater release selection
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('backend/scripts/twinpanel_public_updater.py')
          spec = importlib.util.spec_from_file_location('tp_updater', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          def manifest(version):
              return {
                  'version': version,
                  'installable': True,
                  'published': True,
              }

          assert module.resolve_requested_release('1.1.0-rc.10', '1.1.0-rc.10') == ('1.1.0-rc.10', False)
          assert module.resolve_requested_release('1.1.0-rc.9', '1.1.0-rc.10') == ('1.1.0-rc.10', True)
          assert module.resolve_requested_release('', '1.1.0-rc.10') == ('1.1.0-rc.10', False)

          best = module._best_manifest([
              manifest('1.1.0-rc.9'),
              manifest('1.1.0-rc.10'),
          ])
          assert best['version'] == '1.1.0-rc.10'

          calls = []
          sequence = [manifest('1.1.0-rc.9'), manifest('1.1.0-rc.10')]

          def transient_fetcher(_url):
              calls.append(1)
              return sequence.pop(0)

          recovered = module.release_manifest_for_request(
              'https://example.invalid/stable.json',
              '1.1.0-rc.10',
              attempts=2,
              retry_delay=0,
              fetcher=transient_fetcher,
          )
          assert recovered['version'] == '1.1.0-rc.10'
          assert len(calls) == 2

          stale_calls = []

          def stale_fetcher(_url):
              stale_calls.append(1)
              return manifest('1.1.0-rc.9')

          still_stale = module.release_manifest_for_request(
              'https://example.invalid/stable.json',
              '1.1.0-rc.10',
              attempts=3,
              retry_delay=0,
              fetcher=stale_fetcher,
          )
          assert still_stale['version'] == '1.1.0-rc.9'
          assert len(stale_calls) == 3

          try:
              module.resolve_requested_release(
                  '1.1.0-rc.10',
                  still_stale['version'],
              )
          except RuntimeError as exc:
              assert str(exc) == 'REQUESTED_RELEASE_CHANGED'
          else:
              raise AssertionError('persistent older manifest must remain blocked')

          print('UPDATER_RELEASE_RACE_SMOKE_OK')
          PY

      - name: Compile updater
        run: python3 -m py_compile backend/scripts/twinpanel_public_updater.py
