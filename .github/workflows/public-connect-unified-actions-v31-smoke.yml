name: Public Connect Presentation Reset V33 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_canonical_mobile_v26.py'
      - 'backend/app/routers/public_connection_device_actions_v11.py'
      - 'backend/app/routers/public_connection_hub_live_v5.py'
      - 'backend/app/routers/public_connection_protocol_subscriptions_mount_v30.py'
      - 'backend/app/routers/public_connection_protocol_subscriptions_v30.py'
      - 'backend/tests/smoke_public_connection_mobile_ui_v27.py'
      - 'backend/tests/smoke_public_connection_presentation_reset_v33.py'
      - '.github/workflows/public-connect-unified-actions-v31-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile reset composition
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_canonical_mobile_v26.py \
            backend/app/routers/public_connection_device_actions_v11.py \
            backend/app/routers/public_connection_protocol_subscriptions_mount_v30.py \
            backend/app/routers/public_connection_protocol_subscriptions_v30.py \
            backend/tests/smoke_public_connection_mobile_ui_v27.py \
            backend/tests/smoke_public_connection_presentation_reset_v33.py

      - name: Run retired-stack composition contract
        run: python backend/tests/smoke_public_connection_mobile_ui_v27.py

      - name: Run V33 reset contract
        run: python backend/tests/smoke_public_connection_presentation_reset_v33.py
