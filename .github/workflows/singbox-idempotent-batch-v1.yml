name: Sing-box Idempotent Batch V1

on:
  pull_request:
    paths:
      - "backend/app/singbox_subscription_accounts.py"
      - "backend/tests/singbox_idempotent_batch_v1_smoke.py"
      - ".github/workflows/singbox-idempotent-batch-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noop-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed modules
        run: |
          python -m py_compile backend/app/singbox_subscription_accounts.py backend/tests/singbox_idempotent_batch_v1_smoke.py
      - name: Exercise batch idempotency and rollback boundaries
        run: python backend/tests/singbox_idempotent_batch_v1_smoke.py
