name: Connection Live Telemetry V101 Regression

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/routers/public_connection_live_v4.py'
      - 'backend/app/routers/public_connection_hub_live_v5.py'
      - 'backend/app/routers/public_connection_unified_surface_dates_v80.py'
      - 'backend/app/services/quota_node_sync.py'
      - 'backend/app/services/quota_runtime_reconcile.py'
      - 'backend/app/services/l2tp_quota_runtime_v113.py'
      - 'backend/tests/test_connection_live_telemetry_v101.py'
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_live_v4.py'
      - 'backend/app/routers/public_connection_hub_live_v5.py'
      - 'backend/app/routers/public_connection_unified_surface_dates_v80.py'
      - 'backend/app/services/quota_node_sync.py'
      - 'backend/app/services/quota_runtime_reconcile.py'
      - 'backend/app/services/l2tp_quota_runtime_v113.py'
      - 'backend/tests/test_connection_live_telemetry_v101.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-js-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Connection telemetry and English-number UI
        run: python -m unittest discover -s backend/tests -p 'test_connection_live_telemetry_v101.py' -v
