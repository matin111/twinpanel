name: Subscription Delivery Policy V1 Smoke

on:
  pull_request:
    paths:
      - "backend/app/subscription_delivery_policy_v1.py"
      - "backend/app/routers/subscription_delivery_policy_v1.py"
      - "backend/app/routers/account_delivery.py"
      - "backend/app/subscription_enforcement.py"
      - "backend/app/main.py"
      - "scripts/subscription_delivery_policy_v1_smoke.py"
      - "scripts/subscription_delivery_policy_v1_smoke_runner.py"
      - "scripts/subscription_delivery_policy_hooks_v1_smoke.py"
      - "backend/tests/test_direct_exit_without_healthy_tunnel_v1.py"
      - ".github/workflows/subscription-delivery-policy-v1-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/subscription_delivery_policy_v1.py"
      - "backend/app/routers/subscription_delivery_policy_v1.py"
      - "backend/app/routers/account_delivery.py"
      - "backend/app/subscription_enforcement.py"
      - "backend/app/main.py"
      - "scripts/subscription_delivery_policy_v1_smoke.py"
      - "scripts/subscription_delivery_policy_v1_smoke_runner.py"
      - "scripts/subscription_delivery_policy_hooks_v1_smoke.py"
      - "backend/tests/test_direct_exit_without_healthy_tunnel_v1.py"
      - ".github/workflows/subscription-delivery-policy-v1-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile delivery policy modules
        run: |
          python -m py_compile \
            backend/app/subscription_delivery_policy_v1.py \
            backend/app/routers/subscription_delivery_policy_v1.py \
            scripts/subscription_delivery_policy_v1_smoke.py \
            scripts/subscription_delivery_policy_v1_smoke_runner.py \
            scripts/subscription_delivery_policy_hooks_v1_smoke.py
      - name: Run delivery policy smoke
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/subscription_delivery_policy_v1_smoke_runner.py
      - name: Run delivery hook smoke
        working-directory: backend
        run: PYTHONPATH=. python ../scripts/subscription_delivery_policy_hooks_v1_smoke.py
      - name: Test healthy tunnel first, direct Exit otherwise
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_direct_exit_without_healthy_tunnel_v1.py' -v
