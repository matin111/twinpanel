name: Apply New Node Tunnel Readiness V357

on:
  push:
    branches:
      - fix/new-node-tunnel-readiness-v357
    paths:
      - .github/workflows/apply-new-node-tunnel-readiness-v357.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-node-tunnel-readiness-v357
          fetch-depth: 0

      - name: Apply readiness guard and regression smoke
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/tunnel-protocol-runtime-v307.tsx')
          text = path.read_text()

          iran_line = '  const iranNodes=useMemo(()=>nodes.filter(node=>normalize(node.node_type)==="iran"),[nodes]);'
          exit_line = '  const exitNodes=useMemo(()=>nodes.filter(node=>normalize(node.node_type)==="exit"),[nodes]);'
          assert iran_line in text, 'Iran node role selector anchor missing'
          assert exit_line in text, 'Exit node role selector anchor missing'
          ready_lines = '\n'.join([
              exit_line,
              '  // TWINPANEL_NEW_NODE_TUNNEL_READINESS_V357',
              '  // Online is the UI eligibility gate; backend SSH/Agent/Fabric preflight remains authoritative.',
              '  const readyIranNodes=useMemo(()=>iranNodes.filter(node=>normalize(node.status)==="online"),[iranNodes]);',
              '  const readyExitNodes=useMemo(()=>exitNodes.filter(node=>normalize(node.status)==="online"),[exitNodes]);',
          ])
          text = text.replace(exit_line, ready_lines, 1)

          create_anchor = '    event.preventDefault();if(busy||!draft.iran_node_id||!draft.exit_node_id)return;'
          assert create_anchor in text, 'create tunnel submit anchor missing'
          create_guard = '\n'.join([
              create_anchor,
              '    if(!readyIranNodes.some(node=>node.id===draft.iran_node_id)||!readyExitNodes.some(node=>node.id===draft.exit_node_id)){',
              '      setError(pick("برای ساخت Tunnel هر دو نود ایران و خارج باید Online و آماده باشند.","Both Iran and Exit nodes must be online and ready before creating a tunnel."));',
              '      return;',
              '    }',
          ])
          text = text.replace(create_anchor, create_guard, 1)

          open_old = '\n'.join([
              '  const openCreate=()=>{',
              '    const iran=iranNodes.find(node=>normalize(node.status)==="online")||iranNodes[0];',
              '    const exit=exitNodes.find(node=>normalize(node.status)==="online")||exitNodes[0];',
              '    setDraft({iran_node_id:iran?.id||0,exit_node_id:exit?.id||0,priority:100});setCreateOpen(true);',
              '  };',
          ])
          open_new = '\n'.join([
              '  const openCreate=()=>{',
              '    const iran=readyIranNodes[0];',
              '    const exit=readyExitNodes[0];',
              '    if(!iran||!exit){',
              '      setError(pick("برای ساخت Tunnel حداقل یک نود ایران و یک نود خارج Online لازم است.","At least one online Iran node and one online Exit node are required to create a tunnel."));',
              '      return;',
              '    }',
              '    setDraft({iran_node_id:iran.id,exit_node_id:exit.id,priority:100});setCreateOpen(true);',
              '  };',
          ])
          assert open_old in text, 'openCreate anchor missing'
          text = text.replace(open_old, open_new, 1)

          button_old = '          <button type="button" className="primary" onClick={openCreate}>＋ {pick("Tunnel جدید","New tunnel")}</button>'
          button_new = '          <button type="button" className="primary" disabled={loading||Boolean(busy)||readyIranNodes.length===0||readyExitNodes.length===0} title={readyIranNodes.length===0||readyExitNodes.length===0?pick("ابتدا یک نود ایران و یک نود خارج را Online کنید.","Bring one Iran node and one Exit node online first."):undefined} onClick={openCreate}>＋ {pick("Tunnel جدید","New tunnel")}</button>'
          assert button_old in text, 'New Tunnel button anchor missing'
          text = text.replace(button_old, button_new, 1)

          assert '>{iranNodes.map(node=><option' in text, 'Iran modal options anchor missing'
          assert '>{exitNodes.map(node=><option' in text, 'Exit modal options anchor missing'
          text = text.replace('>{iranNodes.map(node=><option', '>{readyIranNodes.map(node=><option', 1)
          text = text.replace('>{exitNodes.map(node=><option', '>{readyExitNodes.map(node=><option', 1)

          path.write_text(text)

          smoke = Path('scripts/new-node-tunnel-readiness-v357-smoke.py')
          smoke.write_text('''from pathlib import Path\n\nSOURCE = Path("components/tunnel-protocol-runtime-v307.tsx").read_text()\n\nassert "TWINPANEL_NEW_NODE_TUNNEL_READINESS_V357" in SOURCE\nassert 'const readyIranNodes=useMemo(()=>iranNodes.filter(node=>normalize(node.status)==="online")' in SOURCE\nassert 'const readyExitNodes=useMemo(()=>exitNodes.filter(node=>normalize(node.status)==="online")' in SOURCE\nassert "!readyIranNodes.some(node=>node.id===draft.iran_node_id)" in SOURCE\nassert "!readyExitNodes.some(node=>node.id===draft.exit_node_id)" in SOURCE\nassert "const iran=readyIranNodes[0]" in SOURCE\nassert "const exit=readyExitNodes[0]" in SOURCE\nassert "readyIranNodes.length===0||readyExitNodes.length===0" in SOURCE\nassert ">{readyIranNodes.map(node=><option" in SOURCE\nassert ">{readyExitNodes.map(node=><option" in SOURCE\nassert ">{iranNodes.map(node=><option" not in SOURCE\nassert ">{exitNodes.map(node=><option" not in SOURCE\nassert '||iranNodes[0]' not in SOURCE\nassert '||exitNodes[0]' not in SOURCE\nprint("NEW_NODE_TUNNEL_READINESS_V357_SMOKE_OK")\n''')

          workflow = Path('.github/workflows/new-node-tunnel-readiness-v357-smoke.yml')
          workflow.write_text('''name: New Node Tunnel Readiness V357 Smoke\n\non:\n  pull_request:\n    paths:\n      - components/tunnel-protocol-runtime-v307.tsx\n      - scripts/new-node-tunnel-readiness-v357-smoke.py\n      - .github/workflows/new-node-tunnel-readiness-v357-smoke.yml\n  push:\n    branches: [main]\n    paths:\n      - components/tunnel-protocol-runtime-v307.tsx\n      - scripts/new-node-tunnel-readiness-v357-smoke.py\n      - .github/workflows/new-node-tunnel-readiness-v357-smoke.yml\n\njobs:\n  smoke:\n    runs-on: ubuntu-24.04\n    steps:\n      - uses: actions/checkout@v4\n      - name: Verify fail-closed tunnel selector\n        run: python3 scripts/new-node-tunnel-readiness-v357-smoke.py\n''')

          Path('.github/workflows/apply-new-node-tunnel-readiness-v357.yml').unlink()
          PY

          python3 scripts/new-node-tunnel-readiness-v357-smoke.py

      - name: Commit generated source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+matin111@users.noreply.github.com"
          git add -A
          git commit -m "Guard new tunnel creation on online nodes"
          git push origin HEAD:fix/new-node-tunnel-readiness-v357
