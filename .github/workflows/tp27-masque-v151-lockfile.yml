name: TP27 MASQUE V151 Dependency Lock

on:
  pull_request:
    paths:
      - "tools/tp27-masque/**"
      - ".github/workflows/tp27-masque-v151-lockfile.yml"
  push:
    branches: [main]
    paths:
      - "tools/tp27-masque/**"
      - ".github/workflows/tp27-masque-v151-lockfile.yml"

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: tools/tp27-masque/go.sum

      - name: Verify committed module graph is canonical and read-only
        shell: bash
        working-directory: tools/tp27-masque
        run: |
          set -Eeuo pipefail
          test -s go.sum
          grep -Fq 'github.com/quic-go/connect-ip-go v0.4.0 h1:m9xcVslaw9OzLQV79shdXHhKJZZhUmYQhWe6J342W3w=' go.sum
          grep -Fq 'github.com/quic-go/quic-go v0.63.0 h1:LIFGHI4PFUhhw2dDD1ARHdCff143ffMHwZtbnbuJ78A=' go.sum
          GOWORK=off go mod tidy
          git diff --exit-code -- go.mod go.sum
          GOWORK=off go vet -mod=readonly ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOWORK=off \
            go build -mod=readonly -trimpath -o /tmp/tp27-masque .
          test -s /tmp/tp27-masque
