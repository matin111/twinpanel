name: TwinPanel Admin Operation Feedback Smoke

on:
  pull_request:
    paths:
      - 'components/admin-operation-feedback.tsx'
      - 'components/routed-page-client.tsx'
      - 'components/admin-infra-runtime.tsx'
      - 'components/provision-runtime-xray-domain.tsx'
      - 'components/legacy-nodes-exact.tsx'
      - 'components/tunnels-simple-runtime.tsx'
      - 'components/tunnels-unified-runtime-v39.tsx'
      - 'components/legacy-subscriptions-exact.tsx'
      - 'components/admin-subscription-live-table.tsx'
      - 'lib/admin-parity-api.ts'
      - 'lib/legacy-control-api.ts'
      - 'lib/admin-api.ts'
      - '.github/workflows/admin-operation-feedback-smoke.yml'
  workflow_dispatch:

jobs:
  feedback-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify active runtime pages and operation feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          routed=Path('components/routed-page-client.tsx').read_text(encoding='utf-8')
          feedback=Path('components/admin-operation-feedback.tsx').read_text(encoding='utf-8')
          provision=Path('components/provision-runtime-xray-domain.tsx').read_text(encoding='utf-8')
          nodes=Path('components/legacy-nodes-exact.tsx').read_text(encoding='utf-8')
          tunnel_entry=Path('components/tunnels-simple-runtime.tsx').read_text(encoding='utf-8')
          tunnels=Path('components/tunnels-unified-runtime-v39.tsx').read_text(encoding='utf-8')
          subscriptions=Path('components/legacy-subscriptions-exact.tsx').read_text(encoding='utf-8')

          assert 'AdminOperationFeedback' in routed
          assert '<AdminAuthGuard><AdminOperationFeedback/>{node}</AdminAuthGuard>' in routed
          assert 'if(key==="admin/provision") return admin(<ProvisionRuntimeXrayDomainPage/>);' in routed
          assert 'if(key==="admin/nodes") return admin(<LegacyNodesRuntimePage/>);' in routed
          assert 'if(key==="admin/network") return admin(<LegacyNodesRuntimePage/>);' in routed
          assert 'NodeXrayDomainRuntimeV33' not in routed
          assert 'if(key==="admin/tunnels") return admin(<TunnelsSimpleRuntimePage/>);' in routed
          assert 'if(key==="admin/subscriptions") return admin(' in routed
          assert 'LegacySubscriptionsRuntimePage' in routed
          assert 'AdminSubscriptionLiveTable' in routed
          assert 'AdminManualSubscriptionCreate' in routed

          assert 'parityApi.provisionInstall(installPayload)' in provision
          assert 'saveXrayDomain(nodeId,domain)' in provision
          assert 'prepareXrayDomain(nodeId)' in provision
          assert 'adminApi.xrayDomain(selected.id)' in nodes
          assert 'adminApi.saveXrayDomain(selected.id,xrayDomainDraft.trim())' in nodes
          assert 'adminApi.prepareXrayDomain(selected.id,true)' in nodes
          assert 'TunnelsUnifiedRuntimeV39' in tunnel_entry
          assert 'legacyControlApi.createManagedTunnel' in tunnels
          assert 'adminApi.createSubscriptionV2' in subscriptions

          for marker in (
              '/v1/provision/install',
              '/v1/tunnels/create-managed',
              '/v1/subscriptions/admin-create-v2',
              'role="status"',
              'aria-live="polite"',
              'زمان سپری‌شده',
              'response.ok?"success":"error"',
              'Keep this page open',
          ):
              assert marker in feedback, marker

          print('ADMIN_OPERATION_FEEDBACK_CONTRACT_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE: ''
        run: npm run build