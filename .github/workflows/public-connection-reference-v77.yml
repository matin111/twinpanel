name: Public Connection Approved Reference V77

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_*.py'
      - 'backend/tests/test_public_connection_*v7*.py'
      - '.github/workflows/public-connection-reference-v77.yml'

jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python/JS compilation
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_canonical_mobile_v26.py \
            backend/app/routers/public_connection_reference_active_v77.py \
            backend/app/routers/public_connection_approved_phone_v74.py \
            backend/app/routers/public_connection_footer_layout_v75.py
      - name: Regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            backend/tests/test_public_connection_approved_phone_v74.py \
            backend/tests/test_public_connection_footer_layout_v75.py \
            backend/tests/test_public_connection_unified_node_identity_v76.py \
            backend/tests/test_public_connection_reference_active_v77.py
