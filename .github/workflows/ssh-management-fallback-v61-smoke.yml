name: TwinPanel Exit SSH Management Fallback V61 Smoke

on:
  pull_request:
    paths:
      - "backend/app/ssh_management_fallback_v61.py"
      - "backend/app/routers/__init__.py"
      - "backend/scripts/ssh_management_fallback_v61_smoke.py"
      - ".github/workflows/ssh-management-fallback-v61-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      DATABASE_URL: sqlite:////tmp/twinpanel-v61-smoke.db
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile management fallback
        run: |
          python -m py_compile \
            backend/app/ssh_management_fallback_v61.py \
            backend/scripts/ssh_management_fallback_v61_smoke.py

      - name: Run V61 management path contract smoke
        working-directory: backend
        run: PYTHONPATH=. python scripts/ssh_management_fallback_v61_smoke.py
