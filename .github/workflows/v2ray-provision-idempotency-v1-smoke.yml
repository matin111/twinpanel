name: V2Ray Provision Idempotency V1 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/__init__.py'
      - 'backend/app/v2ray_provision_idempotency_v1.py'
      - 'backend/app/routers/modern_account_delivery_v1.py'
      - 'backend/app/xray_modern_runtime.py'
      - 'backend/tests/test_v2ray_provision_idempotency_v1.py'
      - '.github/workflows/v2ray-provision-idempotency-v1-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python3 -m pip install -r backend/requirements.txt
      - name: Compile V2Ray provisioning retry refinement
        run: |
          python3 -m py_compile \
            backend/app/v2ray_provision_idempotency_v1.py \
            backend/tests/test_v2ray_provision_idempotency_v1.py
      - name: Verify stable V2Ray identity across retries
        working-directory: backend
        run: PYTHONPATH=. python3 tests/test_v2ray_provision_idempotency_v1.py
