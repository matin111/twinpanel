name: Smart Transport Auto V21 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/smart_transport_auto_v21.py'
      - 'backend/app/smart_auto_bootstrap_v24.py'
      - 'backend/app/tp2027_transport.py'
      - 'backend/app/tunnel_transport_manager_v12.py'
      - 'backend/app/candidate_lifecycle_v21.py'
      - 'backend/app/runtime_reconciler_v3.py'
      - 'backend/app/runtime_reconciler_v4.py'
      - 'backend/app/tp27_reference_runtime_v91.py'
      - 'backend/app/self_hosted_runtime.py'
      - 'backend/app/routers/modern_transports.py'
      - 'backend/app/transport_candidates/__init__.py'
      - 'backend/app/transport_candidates/common.py'
      - 'backend/app/transport_candidates/tp27_fast.py'
      - 'backend/app/transport_candidates/gost.py'
      - 'backend/app/unified_l3_core_v49.py'
      - 'backend/app/unified_l3_agent_rollout_v49.py'
      - 'backend/app/unified_l3_candidate_registry_v79.py'
      - 'backend/tests/integration/test_tunnel_core_candidate_registry_v79.py'
      - 'backend/tests/integration/test_gost_profile_canary_v81.py'
      - 'backend/tests/integration/test_gost_upstream_udp_fix_v82.py'
      - 'backend/tests/integration/test_gost_relay_registration_v85.py'
      - 'backend/tests/integration/test_tp27_fast_preserve_port_v91.py'
      - 'backend/deploy/systemd/twinpanel-transport-manager.service'
      - '.github/workflows/smart-transport-auto-v21-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/smart_transport_auto_v21.py'
      - 'backend/app/smart_auto_bootstrap_v24.py'
      - 'backend/app/tunnel_transport_manager_v12.py'
      - 'backend/app/runtime_reconciler_v4.py'
      - 'backend/app/tp27_reference_runtime_v91.py'
      - 'backend/app/routers/modern_transports.py'
      - 'backend/app/transport_candidates/__init__.py'
      - 'backend/app/transport_candidates/common.py'
      - 'backend/app/transport_candidates/tp27_fast.py'
      - 'backend/app/unified_l3_candidate_registry_v79.py'
      - 'backend/tests/integration/test_tunnel_core_candidate_registry_v79.py'
      - 'backend/tests/integration/test_tp27_fast_preserve_port_v91.py'
      - 'backend/deploy/systemd/twinpanel-transport-manager.service'
      - '.github/workflows/smart-transport-auto-v21-smoke.yml'

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax compile
        run: |
          python -W error::SyntaxWarning -m py_compile \
            backend/app/smart_transport_auto_v21.py \
            backend/app/smart_auto_bootstrap_v24.py \
            backend/app/tunnel_transport_manager_v12.py \
            backend/app/candidate_lifecycle_v21.py \
            backend/app/runtime_reconciler_v3.py \
            backend/app/runtime_reconciler_v4.py \
            backend/app/tp27_reference_runtime_v91.py \
            backend/app/self_hosted_runtime.py \
            backend/app/routers/modern_transports.py \
            backend/app/transport_candidates/__init__.py \
            backend/app/transport_candidates/common.py \
            backend/app/transport_candidates/tp27_fast.py \
            backend/app/transport_candidates/gost.py \
            backend/app/unified_l3_core_v49.py \
            backend/app/unified_l3_agent_rollout_v49.py \
            backend/app/unified_l3_candidate_registry_v79.py \
            backend/tests/integration/test_tunnel_core_candidate_registry_v79.py \
            backend/tests/integration/test_gost_profile_canary_v81.py \
            backend/tests/integration/test_gost_upstream_udp_fix_v82.py \
            backend/tests/integration/test_gost_relay_registration_v85.py \
            backend/tests/integration/test_tp27_fast_preserve_port_v91.py

      - name: Smart transport static contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          smart = Path('backend/app/smart_transport_auto_v21.py').read_text()
          bootstrap = Path('backend/app/smart_auto_bootstrap_v24.py').read_text()
          manager = Path('backend/app/tunnel_transport_manager_v12.py').read_text()
          lifecycle = Path('backend/app/candidate_lifecycle_v21.py').read_text()
          reconciler3 = Path('backend/app/runtime_reconciler_v3.py').read_text()
          reconciler4 = Path('backend/app/runtime_reconciler_v4.py').read_text()
          runtime = Path('backend/app/self_hosted_runtime.py').read_text()
          api = Path('backend/app/routers/modern_transports.py').read_text()
          candidates = Path('backend/app/transport_candidates/__init__.py').read_text()
          common = Path('backend/app/transport_candidates/common.py').read_text()
          tp27 = Path('backend/app/transport_candidates/tp27_fast.py').read_text()
          tp27_runtime = Path('backend/app/tp27_reference_runtime_v91.py').read_text()
          gost = Path('backend/app/transport_candidates/gost.py').read_text()
          registry = Path('backend/app/unified_l3_candidate_registry_v79.py').read_text()
          rollout = Path('backend/app/unified_l3_agent_rollout_v49.py').read_text()
          unit = Path('backend/deploy/systemd/twinpanel-transport-manager.service').read_text()

          # SmartAuto selection mechanics remain unchanged.
          assert 'download_weight=0.70' in smart
          assert 'upload_weight=0.30' in smart
          assert 'known_bad_quic_0.6.1_frag_dataplane_idle_timeout' in smart
          assert 'CANDIDATE_STABLE_SECONDS = 60.0' in smart
          assert 'install_smart_transport_auto_v21()' in manager
          assert 'smart_bootstrap_loop()' in manager
          assert 'bootstrap=v24' in manager
          assert 'pg_try_advisory_xact_lock' in bootstrap
          assert 'len(irans) != 1 or len(exits) != 1' in bootstrap
          assert 'enabled=False' in bootstrap
          assert 'enter_smart_auto_without_legacy_install' in bootstrap
          assert 'cleanup_tunnel_runtime_v21' in lifecycle
          assert 'cleanup_tunnel_runtime_v21' in runtime
          assert 'tunnel_transport_manager_v12' in unit

          # V91 product surface: TP27 Fast is the only installable/catalog
          # candidate. kernel_gre remains health-visible solely for bounded
          # make-before-break migration and is retired after TP27 promotion.
          assert '"tp27_fast": TP27_SPEC' in candidates
          assert 'ACTIVE_SPECS' in candidates
          active_block = candidates.split('ACTIVE_SPECS =', 1)[1].split('_legacy_runtime', 1)[0]
          assert '"tp27_fast"' in active_block
          assert '"kernel_gre"' not in active_block
          installer_block = candidates.split('INSTALLERS =', 1)[1].split('async def install_transport', 1)[0]
          assert '"tp27_fast": tp27_fast.install' in installer_block
          for retired in ('kernel_gre', 'gost_tun', 'amneziawg', 'netrix'):
              assert f'"{retired}"' not in installer_block
              assert retired in tp27_runtime
          assert 'smart.AUTO_INSTALL_NAMES = ("tp27_fast",)' in tp27_runtime
          assert 'if active != "tp27_fast":' in tp27_runtime
          assert 'runtime_reconciler_v4' in manager
          assert 'twinpanel-tp27-reference-v91' in manager
          assert 'twinpanel-tp27_fast-' in reconciler4
          assert 'TP27 Fast' in api
          assert 'ACTIVE_SPECS' in api
          assert '"selectable": qualified' in api
          assert 'selectable": False' not in api
          assert 'NAME = "tp27_fast"' in tp27
          assert 'FOU_PORT_CANDIDATES = (443, 8443, 2053, 2083, 10443)' in tp27
          assert 'await probe(' in tp27

          # Historical V3 still understands old candidate runtime so V4 can
          # clean installations left by previous releases.
          for retired in ('kernel_gre', 'gost_tun', 'amneziawg', 'netrix'):
              assert retired in reconciler3
              assert retired in candidates

          # V79 remains the bridge from the current migration SPECS registry to
          # the Unified L3 Agent; packet loss is still fail-closed.
          assert 'from .transport_candidates import SPECS' in registry
          assert 'managed_candidates.update(' in registry
          assert 'or selected in' in registry
          assert 'TWINPANEL_UNIFIED_L3_CANDIDATE_REGISTRY_V79' in registry
          assert 'parse_packet_loss_pct' in common
          assert '"packet_loss_pct": packet_loss' in common
          assert 'LC_ALL=C ping' in common
          assert 'shlex.quote(_AGENT_MARKER)' in rollout
          assert 'apply_unified_l3_candidate_registry_v79()' in runtime
          assert runtime.index('apply_unified_l3_candidate_registry_v79()') < runtime.index('apply_unified_l3_core_v49()')

          # Historical GOST source remains compilable solely for idempotent
          # cleanup/rollback archaeology; it is no longer installable/cataloged.
          assert 'TWINPANEL_GOST_PROFILE_CANARY_V81' in gost
          assert 'TWINPANEL_GOST_UPSTREAM_UDP_FRAME_FIX_V82' in gost
          assert 'TWINPANEL_GOST_RELAY_REGISTRATION_V85' in gost

          print('SMART_TRANSPORT_AUTO_TP27_V91_CONTRACT_OK')
          PY

      - name: Tunnel Core V79 regression
        run: |
          python backend/tests/integration/test_tunnel_core_candidate_registry_v79.py

      - name: TP27 Fast V91 regression
        run: |
          python backend/tests/integration/test_tp27_fast_preserve_port_v91.py

      - name: Historical GOST profile regression
        run: |
          python backend/tests/integration/test_gost_profile_canary_v81.py
          python backend/tests/integration/test_gost_upstream_udp_fix_v82.py
          python backend/tests/integration/test_gost_relay_registration_v85.py
