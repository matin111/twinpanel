name: Telegram Account Link Credentials Smoke

on:
  pull_request:
    paths:
      - "backend/app/telegram_account_link_bot.py"
      - "backend/app/routers/telegram_account_link_lookup.py"
      - "backend/app/routers/__init__.py"
      - "backend/scripts/telegram_account_link_credentials_smoke.py"
      - ".github/workflows/telegram-account-link-credentials-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile changed Telegram modules
        run: |
          python -m py_compile backend/app/telegram_account_link_bot.py
          python -m py_compile backend/app/routers/telegram_account_link_lookup.py
          python -m py_compile backend/app/routers/__init__.py

      - name: Verify secure VPN account link recovery contract
        run: python backend/scripts/telegram_account_link_credentials_smoke.py
