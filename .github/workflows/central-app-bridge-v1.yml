name: Central App Tenant Identity V1

on:
  pull_request:
    paths:
      - "backend/app/central_app_identity.py"
      - "backend/app/central_app_models.py"
      - "backend/app/routers/central_app_v1.py"
      - "backend/app/services/subscription_factory.py"
      - "backend/app/routers/reseller_sale_v2.py"
      - "backend/app/routers/reseller_portal.py"
      - "backend/app/reseller_manual_subscriptions.py"
      - "backend/app/reseller_owned_plans.py"
      - "backend/app/main.py"
      - "backend/tests/test_central_app_identity_v1.py"
      - ".github/workflows/central-app-bridge-v1.yml"

jobs:
  tenant-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile changed backend modules
        run: |
          python -m py_compile \
            backend/app/central_app_identity.py \
            backend/app/central_app_models.py \
            backend/app/routers/central_app_v1.py \
            backend/app/services/subscription_factory.py \
            backend/app/routers/reseller_sale_v2.py \
            backend/app/routers/reseller_portal.py \
            backend/app/reseller_manual_subscriptions.py \
            backend/app/reseller_owned_plans.py \
            backend/app/main.py
      - name: Test namespacing and existing creation paths
        run: python -m unittest discover -s backend/tests -p 'test_central_app_identity_v1.py' -v
