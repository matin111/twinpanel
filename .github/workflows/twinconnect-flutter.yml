name: TwinConnect Flutter Foundation

on:
  pull_request:
    paths:
      - "clients/twinconnect/**"
      - ".github/workflows/twinconnect-flutter.yml"
      - "backend/app/routers/central_app_v1.py"
  workflow_dispatch:
    inputs:
      build_four_platforms:
        description: "Build unsigned Android, Windows, iOS, and macOS previews"
        type: boolean
        default: false
      directory_url:
        description: "Public HTTPS TwinPanel vendor directory base URL"
        type: string
        required: false

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/twinconnect
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native project scaffolds
        run: flutter create --platforms=android,ios,macos,windows --org com.twinpanel --project-name twinconnect .
      - name: Install reviewed Android WireGuard source
        run: python tools/install_android_native.py
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test --reporter expanded

  unsigned-platform-previews:
    if: github.event_name == 'workflow_dispatch' && inputs.build_four_platforms
    needs: analyze-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: ios
            runner: macos-latest
          - platform: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: clients/twinconnect
    env:
      TWINCONNECT_DIRECTORY_URL: ${{ inputs.directory_url || vars.TWINCONNECT_DIRECTORY_URL || 'https://167-104-219-168.sslip.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native project files
        run: flutter create --platforms=android,ios,macos,windows --org com.twinpanel --project-name twinconnect .
      - name: Install Android native WireGuard
        if: matrix.platform == 'android'
        run: python tools/install_android_native.py
      - name: Validate central license directory before building platform binaries
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from urllib.parse import urlsplit
          origin = os.environ["TWINCONNECT_DIRECTORY_URL"].rstrip("/")
          parsed = urlsplit(origin)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username or
              parsed.password or parsed.path or parsed.query or parsed.fragment):
              raise SystemExit("Invalid central license directory origin")
          with urllib.request.urlopen(origin + "/v1/app/resolve/TP934FE9", timeout=15) as response:
              payload = json.load(response)
          if payload.get("namespace") != "TP934FE9" or not str(payload.get("api_origin", "")).startswith("https://"):
              raise SystemExit("Central license lookup failed")
          if payload["api_origin"].rstrip("/") == origin:
              raise SystemExit("Customer panel cannot be used as central bootstrap")
          print("Central license lookup verified for platform preview")
          PY
      - name: Build Android (unsigned preview)
        if: matrix.platform == 'android'
        run: flutter build apk --release --dart-define=TWINCONNECT_DIRECTORY_URL=$TWINCONNECT_DIRECTORY_URL
      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: flutter build windows --release "--dart-define=TWINCONNECT_DIRECTORY_URL=$env:TWINCONNECT_DIRECTORY_URL"
      - name: Build iOS app without signing
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign "--dart-define=TWINCONNECT_DIRECTORY_URL=$TWINCONNECT_DIRECTORY_URL"
      - name: Build macOS app
        if: matrix.platform == 'macos'
        run: flutter build macos --release "--dart-define=TWINCONNECT_DIRECTORY_URL=$TWINCONNECT_DIRECTORY_URL"
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'android'
        with:
          name: twinconnect-android-preview
          path: clients/twinconnect/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: twinconnect-windows-preview
          path: clients/twinconnect/build/windows/x64/runner/Release/**
          if-no-files-found: error
      - name: Upload iOS .app artifact (not IPA)
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'ios'
        with:
          name: twinconnect-ios-unsigned-app
          path: clients/twinconnect/build/ios/iphoneos/Runner.app/**
          if-no-files-found: error
      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos'
        with:
          name: twinconnect-macos-preview
          path: clients/twinconnect/build/macos/Build/Products/Release/*.app/**
          if-no-files-found: error
