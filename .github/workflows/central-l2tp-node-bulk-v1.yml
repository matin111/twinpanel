name: Central L2TP Node Bulk V1

on:
  pull_request:
    paths:
      - "backend/tests/test_central_node_stage_v1.py"
      - "backend/scripts/twinpanel_central_node_stage_v1.py"
      - "backend/tests/test_central_openvpn_node_bulk_v1.py"
      - "backend/scripts/twinpanel_central_openvpn_node_bulk_v1.py"
      - "backend/app/protocol_identity.py"
      - "backend/app/routers/account_delivery.py"
      - "backend/scripts/twinpanel_central_l2tp_node_bulk_v1.py"
      - "backend/scripts/twinpanel_central_cisco_node_bulk_v1.py"
      - "backend/scripts/twinpanel_central_singbox_node_bulk_v1.py"
      - "backend/scripts/twinpanel_central_xray_node_bulk_v1.py"
      - "backend/scripts/twinpanel_central_wireguard_node_bulk_v1.py"
      - "backend/app/central_wireguard_bulk_runtime_v1.py"
      - "backend/app/central_singbox_bulk_runtime_v1.py"
      - "backend/tests/test_central_l2tp_node_bulk_v1.py"
      - "backend/tests/test_central_cisco_node_bulk_v1.py"
      - "backend/tests/test_central_singbox_bulk_v1.py"
      - "backend/tests/test_central_xray_node_bulk_v1.py"
      - "backend/tests/test_central_wireguard_bulk_v1.py"
      - ".github/workflows/central-l2tp-node-bulk-v1.yml"

jobs:
  central-bulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile central materializer
        run: python -m py_compile backend/tests/test_central_openvpn_node_bulk_v1.py backend/scripts/twinpanel_central_openvpn_node_bulk_v1.py backend/tests/test_central_node_stage_v1.py backend/scripts/twinpanel_central_node_stage_v1.py backend/scripts/twinpanel_central_l2tp_node_bulk_v1.py backend/tests/test_central_l2tp_node_bulk_v1.py backend/scripts/twinpanel_central_cisco_node_bulk_v1.py backend/tests/test_central_cisco_node_bulk_v1.py backend/app/central_singbox_bulk_runtime_v1.py backend/scripts/twinpanel_central_singbox_node_bulk_v1.py backend/tests/test_central_singbox_bulk_v1.py backend/scripts/twinpanel_central_xray_node_bulk_v1.py backend/tests/test_central_xray_node_bulk_v1.py backend/app/central_wireguard_bulk_runtime_v1.py backend/scripts/twinpanel_central_wireguard_node_bulk_v1.py backend/tests/test_central_wireguard_bulk_v1.py
      - name: Exercise one-batch no-restart credentials and safety
        working-directory: backend
        env:
          APP_SECRET_KEY: "ci-central-bulk-local-only-not-for-production"
          DATABASE_URL: "sqlite:///./central-bulk-test.db"
          NODE_AGENT_SHARED_SECRET: "ci-central-bulk-node-agent-local-only"
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_openvpn_node_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_stage_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_l2tp_node_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_cisco_node_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_singbox_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_xray_node_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_wireguard_bulk_v1.py' -v
