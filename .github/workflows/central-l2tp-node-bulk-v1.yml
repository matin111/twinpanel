jobs:
  central-bulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile central materializer
        run: python -m py_compile backend/app/central_sudoku_shared_runtime_v2.py backend/app/services/central_sudoku_shared_bootstrap_v2.py backend/scripts/twinpanel_central_sudoku_shared_v2.py backend/tests/test_central_sudoku_shared_runtime_v2.py backend/tests/test_central_node_reverify_v1.py backend/tests/test_central_direct_without_tunnel_v1.py backend/tests/test_central_node_background_pipeline_v1.py backend/app/routers/publish_node_all_users_v1.py backend/app/routers/provision.py backend/app/services/node_stage_publish_guard_v1.py backend/tests/test_central_node_installer_cutover_v1.py backend/app/services/central_node_desired_state_v1.py backend/app/services/central_node_runtime_engine_v1.py backend/tests/test_central_node_desired_state_v1.py backend/tests/test_central_node_runtime_engine_v1.py backend/app/central_sudoku_keygen_bulk_v1.py backend/tests/test_central_sudoku_keygen_bulk_v1.py backend/app/routers/nodes.py backend/tests/test_new_exit_visibility_v1.py backend/app/services/central_node_stage_launcher_v1.py backend/app/services/node_install_progress_v1.py backend/app/routers/publish_node_all_users_v2.py backend/tests/test_central_node_stage_launcher_v1.py backend/tests/test_central_node_publish_guard_v1.py backend/app/central_node_stage_audit_v1.py backend/tests/test_central_node_stage_audit_v1.py backend/app/central_sudoku_bulk_runtime_v1.py backend/scripts/twinpanel_central_sudoku_node_bulk_v1.py backend/tests/test_central_sudoku_bulk_v1.py backend/tests/test_central_sudoku_node_bulk_v1.py backend/app/services/central_sudoku_capacity_v1.py backend/tests/test_central_sudoku_capacity_v1.py backend/app/central_amneziawg_bulk_runtime_v1.py backend/scripts/twinpanel_central_amneziawg_node_bulk_v1.py backend/tests/test_central_amneziawg_bulk_v1.py backend/app/central_trusttunnel_bulk_runtime_v1.py backend/scripts/twinpanel_central_trusttunnel_node_bulk_v1.py backend/tests/test_central_trusttunnel_bulk_v1.py backend/scripts/twinpanel_central_mieru_node_bulk_v1.py backend/tests/test_central_mieru_node_bulk_v1.py backend/app/central_mieru_bulk_runtime_v1.py backend/tests/test_central_mieru_bulk_v1.py backend/tests/test_central_openvpn_node_bulk_v1.py backend/scripts/twinpanel_central_openvpn_node_bulk_v1.py backend/tests/test_central_node_stage_v1.py backend/scripts/twinpanel_central_node_stage_v1.py backend/scripts/twinpanel_central_l2tp_node_bulk_v1.py backend/tests/test_central_l2tp_node_bulk_v1.py backend/scripts/twinpanel_central_cisco_node_bulk_v1.py backend/tests/test_central_cisco_node_bulk_v1.py backend/app/central_singbox_bulk_runtime_v1.py backend/scripts/twinpanel_central_singbox_node_bulk_v1.py backend/tests/test_central_singbox_bulk_v1.py backend/scripts/twinpanel_central_xray_node_bulk_v1.py backend/tests/test_central_xray_node_bulk_v1.py backend/app/central_wireguard_bulk_runtime_v1.py backend/scripts/twinpanel_central_wireguard_node_bulk_v1.py backend/tests/test_central_wireguard_bulk_v1.py backend/tests/test_central_wireguard_stage_identity_v1.py
      - name: Exercise one-batch no-restart credentials and safety
        working-directory: backend
        env:
          APP_SECRET_KEY: "ci-central-bulk-local-only-not-for-production"
          DATABASE_URL: "sqlite:///./central-bulk-test.db"
          NODE_AGENT_SHARED_SECRET: "ci-central-bulk-node-agent-local-only"
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_amneziawg_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_trusttunnel_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_mieru_node_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_mieru_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_openvpn_node_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_new_exit_visibility_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_stage_launcher_v1.py' -v
