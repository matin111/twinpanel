          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_stage_audit_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_sudoku_keygen_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_sudoku_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_sudoku_node_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_sudoku_shared_runtime_v2.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_sudoku_capacity_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_direct_without_tunnel_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_background_pipeline_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_reverify_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_installer_cutover_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_desired_state_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_runtime_engine_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_node_stage_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_l2tp_node_bulk_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_central_cisco_node_bulk_v1.py' -v
