name: offline-license-v1-smoke

on:
  pull_request:
    paths:
      - "backend/app/system_release.py"
      - "backend/.env.example"
      - "backend/tests/test_license_resilience.py"
      - ".github/workflows/offline-license-v1-smoke.yml"

permissions:
  contents: read

jobs:
  backend-license:
    runs-on: ubuntu-latest
    env:
      APP_NAME: TwinPanel-License-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-license-secret-key-ci-license-secret-key-ci-license-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: sqlite:///./twinpanel-license-ci.db
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-license-node-agent-shared-secret
      TWINPANEL_LICENSE_ENFORCE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Compile license runtime
        run: python -m py_compile backend/app/system_release.py
      - name: Run resilience tests
        run: PYTHONPATH=backend pytest -q backend/tests/test_license_resilience.py
      - name: Verify offline-first contract
        run: |
          grep -Fq 'TWINPANEL_LICENSE_IR_API_URL' backend/app/system_release.py
          grep -Fq 'validation_source' backend/app/system_release.py
          grep -Fq 'offline_cache' backend/app/system_release.py
          grep -Fq 'AUTHORITATIVE_BLOCKED_STATES' backend/app/system_release.py
          grep -Fq 'TWINPANEL_LICENSE_OFFLINE_GRACE_SECONDS=2592000' backend/.env.example
