name: TwinPanel Store Tutorial Compat V124

on:
  push:
    branches:
      - feat/store-tutorial-inline-v124-final
    paths:
      - '.github/workflows/store-tutorial-compat-v124.yml'

permissions:
  contents: write

jobs:
  add-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-tutorial-inline-v124-final
          fetch-depth: 0
      - name: Restore compatibility export
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/store-guide-content.ts')
          s=p.read_text(encoding='utf-8')
          marker='export function storeGuideScreenshot('
          if marker not in s:
              s += '''\n\nexport function storeGuideScreenshot(platform:StoreGuidePlatform,protocol:StoreGuideProtocol,_index:number):string{\n  return storeGuideTutorialImage(platform,protocol);\n}\n'''
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/store-guide-content.ts
          git commit -m 'Keep storefront tutorial screenshot compatibility'
          git push origin HEAD:feat/store-tutorial-inline-v124-final
