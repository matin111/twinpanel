name: TwinPanel TP27 GRE FAST Canary Smoke

on:
  pull_request:
    paths:
      - "backend/app/transport_candidates/gre.py"
      - "backend/scripts/tp27_fast_canary_smoke.py"
      - ".github/workflows/tp27-fast-canary-smoke.yml"

jobs:
  tp27-fast-canary:
    runs-on: ubuntu-24.04

    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      DATABASE_URL: sqlite:////tmp/twinpanel-tp27-fast-ci.db
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile TP27 GRE FAST canary
        run: |
          python -m py_compile \
            backend/app/transport_candidates/gre.py \
            backend/scripts/tp27_fast_canary_smoke.py

      - name: Run TP27 GRE FAST canary smoke
        working-directory: backend
        run: python -m scripts.tp27_fast_canary_smoke
