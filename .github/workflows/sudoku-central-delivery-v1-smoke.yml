name: Sudoku Central Delivery V1 Smoke

on:
  pull_request:
    paths:
      - backend/app/services/sudoku_central_delivery_v1.py
      - backend/app/routers/account_delivery.py
      - backend/tests/sudoku_central_delivery_v1_smoke.py
      - .github/workflows/sudoku-central-delivery-v1-smoke.yml
  workflow_dispatch:

jobs:
  delivery-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Compile shared identity and existing account delivery
        run: |
          python -m py_compile backend/app/services/sudoku_central_delivery_v1.py
          python -m py_compile backend/app/routers/account_delivery.py
      - name: Run isolated central-only delivery tests
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_NAME: TwinPanel-CI
          APP_ENV: test
          APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
          DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/test
          NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
        run: python tests/sudoku_central_delivery_v1_smoke.py
