name: Durable Fast Provision Queue V1

on:
  pull_request:
    paths:
      - "backend/app/fast_provision_job_models_v1.py"
      - "backend/app/services/fast_provision_queue_v1.py"
      - "backend/app/services/fast_provision_worker_v1.py"
      - "backend/app/routers/subscription_create_fast_v1.py"
      - "backend/app/main.py"
      - "backend/tests/test_fast_provision_queue_v1.py"
      - "backend/tests/test_fast_provision_worker_v1.py"
      - ".github/workflows/fast-provision-queue-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_SECRET_KEY: test-secret-not-for-production
      DATABASE_URL: sqlite:///./fast-provision-queue-ci.sqlite3
      NODE_AGENT_SHARED_SECRET: test-agent-secret-not-for-production
      PYTHONPATH: backend
      TWINPANEL_FAST_PROVISION_QUEUE_V1: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Compile queue and integration paths
        run: |
          python -m py_compile \
            backend/app/fast_provision_job_models_v1.py \
            backend/app/services/fast_provision_queue_v1.py \
            backend/app/services/fast_provision_worker_v1.py \
            backend/app/routers/subscription_create_fast_v1.py \
            backend/app/main.py
      - name: Verify durable queue contracts
        run: python -m pytest -q backend/tests/test_fast_provision_queue_v1.py backend/tests/test_fast_provision_worker_v1.py
      - name: Current fast-create UI contract
        # Legacy completion_v1 asserts removed pre-BackgroundTasks code and
        # also unrelated reseller/timeouts; it already fails on main.
        run: python -m pytest -q backend/tests/test_subscription_create_stuck_spinner_v1.py
