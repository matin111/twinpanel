name: TwinPanel SSH Management Menu Smoke

on:
  pull_request:
    paths:
      - "installer/**"
      - "scripts/twinpanel-menu.sh"
      - "backend/scripts/twinpanel_admin_cli.py"
      - "backend/scripts/twinpanel_protocol_cli.py"
      - "backend/scripts/twinpanel_protocol_cli_en.py"
      - ".github/workflows/ssh-management-menu-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: TwinPanel-CLI-CI
      APP_ENV: test
      APP_SECRET_KEY: cli-ci-secret-key-cli-ci-secret-key-cli-ci-secret-key
      DATABASE_URL: sqlite:////tmp/twinpanel-cli-ci.db
      REDIS_URL: redis://127.0.0.1:6379/15
      NODE_AGENT_SHARED_SECRET: cli-ci-node-secret-cli-ci-node-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n installer/install.sh
          bash -n scripts/twinpanel-menu.sh

      - name: Validate Python syntax
        run: |
          python3 -m py_compile backend/scripts/twinpanel_admin_cli.py
          python3 -m py_compile backend/scripts/twinpanel_protocol_cli.py
          python3 -m py_compile backend/scripts/twinpanel_protocol_cli_en.py

      - name: Verify SSH menu is English-only and ASCII-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in (
              Path("scripts/twinpanel-menu.sh"),
              Path("backend/scripts/twinpanel_protocol_cli_en.py"),
          ):
              text = path.read_text(encoding="utf-8")
              non_ascii = [(i, ch) for i, ch in enumerate(text) if ord(ch) > 127]
              assert not non_ascii, f"non-ASCII characters found in {path}: {non_ascii[:5]}"

          menu = Path("scripts/twinpanel-menu.sh").read_text(encoding="utf-8")
          assert "Language" not in menu
          assert "Panel status" in menu
          assert "Service management" in menu
          assert "Administrator management" in menu
          assert "Protocol management" in menu
          assert "scripts/twinpanel_protocol_cli_en.py" in menu
          print("SSH_MENU_ENGLISH_ASCII_OK")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Import management helpers
        working-directory: backend
        run: |
          python - <<'PY'
          from scripts import twinpanel_admin_cli, twinpanel_protocol_cli, twinpanel_protocol_cli_en
          assert callable(twinpanel_admin_cli.main)
          assert callable(twinpanel_protocol_cli.main)
          assert callable(twinpanel_protocol_cli_en.main)
          print("SSH_MANAGEMENT_IMPORT_OK")
          PY

      - name: Verify installer wires SSH menu
        run: |
          grep -q 'exec bash /opt/twinpanel/current/scripts/twinpanel-menu.sh' installer/install.sh
          grep -q 'SSH management: twinpanel' installer/install.sh
          grep -q 'TwinPanel initial admin — first login only' installer/install.sh
          grep -q 'Existing administrator preserved' installer/install.sh

      - name: Verify English protocol actions are explicit
        run: |
          grep -q '("status", "Status")' backend/scripts/twinpanel_protocol_cli_en.py
          grep -q '("install", "Install")' backend/scripts/twinpanel_protocol_cli_en.py
          grep -q '("repair", "Repair")' backend/scripts/twinpanel_protocol_cli_en.py
          grep -q '("restart", "Restart")' backend/scripts/twinpanel_protocol_cli_en.py
          grep -q '("remove", "Remove")' backend/scripts/twinpanel_protocol_cli_en.py
