name: TwinPanel Subscription Creation Protocol Smoke

on:
  pull_request:
    paths:
      - 'backend/app/subscription_plan_schema.py'
      - 'backend/app/routers/subscription_admin_v2.py'
      - 'backend/app/services/subscription_factory.py'
      - 'backend/app/protocol_account_registry.py'
      - 'backend/app/schemas.py'
      - 'components/admin-manual-subscription-create.tsx'
      - 'components/legacy-subscriptions-exact.tsx'
      - 'components/routed-page-client.tsx'
      - 'lib/admin-api.ts'
      - 'lib/subscription-protocol-api.ts'
      - '.github/workflows/admin-manual-subscription-smoke.yml'
  workflow_dispatch:

jobs:
  subscription-create:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twinpanel
          POSTGRES_PASSWORD: twinpanel_test
          POSTGRES_DB: twinpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twinpanel -d twinpanel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_NAME: TwinPanel-Subscription-Create-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: postgresql+psycopg2://twinpanel:twinpanel_test@127.0.0.1:5432/twinpanel
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095
      TWINPANEL_ADMIN_EMAIL: admin-ci@example.com
      TWINPANEL_ADMIN_PASSWORD: TwinPanel-CI-Admin-2026!
      TWINPANEL_ADMIN_NAME: TwinPanel CI Admin
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Prepare runtime directories
        run: |
          sudo install -d -m 700 /etc/twinpanel
          sudo install -d -m 700 /var/lib/twinpanel-backups
          sudo chown -R "$(id -u):$(id -g)" /etc/twinpanel /var/lib/twinpanel-backups

      - name: Verify explicit per-subscription 15-protocol creation
        working-directory: backend
        run: |
          python - <<'PY'
          from fastapi import HTTPException
          from sqlalchemy import inspect, text

          from app.main import app
          from app.database import SessionLocal, engine
          from app.models import Plan, Subscription, SubscriptionProtocol, User
          from app.protocol_account_registry import ALL_PROTOCOL_KEYS
          from app.routers.subscription_admin_v2 import AdminSubscriptionCreateV2, admin_create_v2
          from app.security import hash_password

          assert app.title
          assert len(ALL_PROTOCOL_KEYS) == 15
          assert Subscription.__table__.c.plan_id.nullable is True
          assert inspect(engine).get_columns('subscriptions')

          db = SessionLocal()
          try:
              user = User(
                  email='subscription-create-ci@example.com',
                  password_hash=hash_password('TwinPanel-CI-Subscription-2026!'),
                  full_name='Subscription Create CI',
                  is_active=True,
              )
              plan = Plan(
                  name='CI Commercial Plan',
                  duration_days=30,
                  traffic_gb=50,
                  device_limit=2,
                  price_toman=1000,
                  is_active=True,
              )
              db.add_all([user, plan]); db.commit(); db.refresh(user); db.refresh(plan)
              user_id=user.id; plan_id=plan.id
          finally:
              db.close()

          # Preserve compatibility with older databases where manual subscriptions
          # were blocked by subscriptions.plan_id NOT NULL.
          with engine.begin() as connection:
              connection.execute(text('ALTER TABLE subscriptions ALTER COLUMN plan_id SET NOT NULL'))

          db = SessionLocal()
          try:
              manual = admin_create_v2(
                  AdminSubscriptionCreateV2(
                      user_id=user_id,
                      plan_id=None,
                      traffic_gb=25,
                      duration_days=45,
                      device_limit=3,
                      protocols=['cisco','sudoku'],
                  ),
                  db,
              )
              assert manual['plan_id'] is None
              manual_id=int(manual['id'])
          finally:
              db.close()

          db = SessionLocal()
          try:
              manual_protocols=[row[0] for row in db.query(SubscriptionProtocol.protocol).filter(SubscriptionProtocol.subscription_id==manual_id).order_by(SubscriptionProtocol.protocol).all()]
              assert manual_protocols == ['cisco','sudoku']

              all_protocols = admin_create_v2(
                  AdminSubscriptionCreateV2(
                      user_id=user_id,
                      plan_id=plan_id,
                      protocols=list(ALL_PROTOCOL_KEYS),
                  ),
                  db,
              )
              all_id=int(all_protocols['id'])
              stored={row[0] for row in db.query(SubscriptionProtocol.protocol).filter(SubscriptionProtocol.subscription_id==all_id).all()}
              assert stored == set(ALL_PROTOCOL_KEYS)

              explicit = admin_create_v2(
                  AdminSubscriptionCreateV2(
                      user_id=user_id,
                      plan_id=plan_id,
                      protocols=['wireguard','hysteria2'],
                  ),
                  db,
              )
              explicit_id=int(explicit['id'])
              explicit_protocols={row[0] for row in db.query(SubscriptionProtocol.protocol).filter(SubscriptionProtocol.subscription_id==explicit_id).all()}
              assert explicit_protocols == {'wireguard','hysteria2'}

              try:
                  admin_create_v2(
                      AdminSubscriptionCreateV2(
                          user_id=user_id,
                          plan_id=plan_id,
                          protocols=[],
                      ),
                      db,
                  )
              except HTTPException as exc:
                  assert exc.status_code == 422
              else:
                  raise AssertionError('plan-backed subscription must require explicit protocols')
          finally:
              db.close()

          print('SUBSCRIPTION_EXPLICIT_15_PROTOCOL_CREATION_OK')
          PY

      - name: Verify frontend selection contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui=Path('components/admin-manual-subscription-create.tsx').read_text(encoding='utf-8')
          plan_ui=Path('components/legacy-plans-exact.tsx').read_text(encoding='utf-8')
          backend=Path('backend/app/routers/subscription_admin_v2.py').read_text(encoding='utf-8')
          factory=Path('backend/app/services/subscription_factory.py').read_text(encoding='utf-8')
          client=Path('lib/subscription-protocol-api.ts').read_text(encoding='utf-8')

          assert 'subscriptionProtocolApi.catalog()' in ui
          assert 'انتخاب همه ۱۵ پروتکل' in ui
          assert 'لغو انتخاب همه' in ui
          assert 'plan_id:planId||null' in ui
          assert 'protocols.length===0' in ui
          assert '/v1/subscriptions/protocol-catalog' in client
          assert '@router.get("/protocol-catalog")' in backend
          assert 'هنگام ساخت اشتراک حداقل یک پروتکل انتخاب کنید' in backend
          assert 'plan_protocols' not in factory
          assert 'planProtocolApi' not in plan_ui
          assert 'پروتکل در پلن تعریف نمی‌شود' in plan_ui

          print('SUBSCRIPTION_PROTOCOL_FRONTEND_CONTRACT_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend
        run: npm run build
