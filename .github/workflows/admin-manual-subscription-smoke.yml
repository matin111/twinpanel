name: TwinPanel Subscription Creation Protocol Smoke

on:
  pull_request:
    paths:
      - 'backend/app/subscription_plan_schema.py'
      - 'backend/app/routers/subscription_admin_v2.py'
      - 'backend/app/services/subscription_factory.py'
      - 'backend/app/protocol_account_registry.py'
      - 'backend/app/plan_template_selection.py'
      - 'backend/app/plan_node_models.py'
      - 'backend/app/schemas.py'
      - 'components/admin-manual-subscription-create.tsx'
      - 'components/legacy-plans-exact.tsx'
      - 'components/legacy-subscriptions-exact.tsx'
      - 'components/routed-page-client.tsx'
      - 'lib/admin-api.ts'
      - 'lib/subscription-protocol-api.ts'
      - '.github/workflows/admin-manual-subscription-smoke.yml'
  workflow_dispatch:

jobs:
  subscription-create:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twinpanel
          POSTGRES_PASSWORD: twinpanel_test
          POSTGRES_DB: twinpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twinpanel -d twinpanel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_NAME: TwinPanel-Subscription-Create-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: postgresql+psycopg2://twinpanel:twinpanel_test@127.0.0.1:5432/twinpanel
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095
      TWINPANEL_ADMIN_EMAIL: admin-ci@example.com
      TWINPANEL_ADMIN_PASSWORD: TwinPanel-CI-Admin-2026!
      TWINPANEL_ADMIN_NAME: TwinPanel CI Admin
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Prepare runtime directories
        run: |
          sudo install -d -m 700 /etc/twinpanel
          sudo install -d -m 700 /var/lib/twinpanel-backups
          sudo chown -R "$(id -u):$(id -g)" /etc/twinpanel /var/lib/twinpanel-backups

      - name: Verify explicit per-subscription 15-protocol creation
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio

          from fastapi import HTTPException
          from sqlalchemy import inspect, text

          from app.main import app
          from app.database import SessionLocal, engine
          from app.models import Node, NodeType, Plan, ProtocolCredential, Subscription, SubscriptionProtocol, User
          from app.plan_template_selection import replace_plan_nodes, replace_plan_template_protocols
          from app.protocol_account_registry import ALL_PROTOCOL_KEYS
          from app.routers import modern_account_delivery_v1
          from app.routers.subscription_admin_v2 import AdminSubscriptionCreateV2, admin_create_v2
          from app.security import hash_password

          assert app.title
          assert len(ALL_PROTOCOL_KEYS) == 15
          assert Subscription.__table__.c.plan_id.nullable is True
          assert inspect(engine).get_columns('subscriptions')

          async def fake_provision_account_v1(subscription_id: int, db):
              protocols = [
                  row[0]
                  for row in db.query(SubscriptionProtocol.protocol)
                  .filter(SubscriptionProtocol.subscription_id == subscription_id)
                  .all()
              ]
              for protocol in protocols:
                  cred = (
                      db.query(ProtocolCredential)
                      .filter(
                          ProtocolCredential.subscription_id == subscription_id,
                          ProtocolCredential.protocol == protocol,
                      )
                      .first()
                  )
                  if cred is None:
                      cred = ProtocolCredential(
                          subscription_id=subscription_id,
                          protocol=protocol,
                      )
                      db.add(cred)
                  cred.username = cred.username or f'ci-{subscription_id}-{protocol}'
                  cred.config_text_encrypted = f'ci-config-{subscription_id}-{protocol}'
                  cred.is_active = True
              db.commit()
              return {
                  'ok': True,
                  'errors': [],
                  'quota': {'ok': True, 'nodes': []},
              }

          modern_account_delivery_v1.provision_account_v1 = fake_provision_account_v1

          db = SessionLocal()
          try:
              user = User(
                  email='subscription-create-ci@example.com',
                  password_hash=hash_password('TwinPanel-CI-Subscription-2026!'),
                  full_name='Subscription Create CI',
                  is_active=True,
              )
              plan = Plan(
                  name='CI Commercial Plan',
                  duration_days=30,
                  traffic_gb=50,
                  device_limit=2,
                  price_toman=1000,
                  is_active=True,
              )
              node = Node(
                  name='subscription-create-ci-exit',
                  node_type=NodeType.EXIT,
                  country_code='DE',
                  public_ip='198.51.100.50',
                  agent_url='http://127.0.0.1:65535',
              )
              db.add_all([user, plan, node]); db.flush()
              replace_plan_template_protocols(db, plan.id, ALL_PROTOCOL_KEYS)
              replace_plan_nodes(db, plan.id, [node.id])
              db.commit(); db.refresh(user); db.refresh(plan); db.refresh(node)
              user_id=user.id; plan_id=plan.id; node_id=node.id
          finally:
              db.close()

          # Preserve compatibility with older databases where manual subscriptions
          # were blocked by subscriptions.plan_id NOT NULL.
          with engine.begin() as connection:
              connection.execute(text('ALTER TABLE subscriptions ALTER COLUMN plan_id SET NOT NULL'))

          db = SessionLocal()
          try:
              manual = asyncio.run(admin_create_v2(
                  AdminSubscriptionCreateV2(
                      user_id=user_id,
                      plan_id=None,
                      traffic_gb=25,
                      duration_days=45,
                      device_limit=3,
                      protocols=['cisco','sudoku'],
                  ),
                  db,
              ))
              assert manual['plan_id'] is None
              assert manual['provisioning']['ok'] is True
              manual_id=int(manual['id'])
          finally:
              db.close()

          db = SessionLocal()
          try:
              manual_protocols=[row[0] for row in db.query(SubscriptionProtocol.protocol).filter(SubscriptionProtocol.subscription_id==manual_id).order_by(SubscriptionProtocol.protocol).all()]
              assert manual_protocols == ['cisco','sudoku']

              all_protocols = asyncio.run(admin_create_v2(
                  AdminSubscriptionCreateV2(
                      user_id=user_id,
                      plan_id=plan_id,
                      node_ids=[node_id],
                      protocols=list(ALL_PROTOCOL_KEYS),
                  ),
                  db,
              ))
              assert all_protocols['provisioning']['ok'] is True
              all_id=int(all_protocols['id'])
              stored={row[0] for row in db.query(SubscriptionProtocol.protocol).filter(SubscriptionProtocol.subscription_id==all_id).all()}
              assert stored == set(ALL_PROTOCOL_KEYS)
              provisioned={row[0] for row in db.query(ProtocolCredential.protocol).filter(ProtocolCredential.subscription_id==all_id, ProtocolCredential.is_active.is_(True)).all()}
              assert provisioned == set(ALL_PROTOCOL_KEYS)

              explicit = asyncio.run(admin_create_v2(
                  AdminSubscriptionCreateV2(
                      user_id=user_id,
                      plan_id=plan_id,
                      node_ids=[node_id],
                      protocols=['wireguard','hysteria2'],
                  ),
                  db,
              ))
              assert explicit['provisioning']['ok'] is True
              explicit_id=int(explicit['id'])
              explicit_protocols={row[0] for row in db.query(SubscriptionProtocol.protocol).filter(SubscriptionProtocol.subscription_id==explicit_id).all()}
              assert explicit_protocols == {'wireguard','hysteria2'}

              # The admin/manual creation endpoint intentionally keeps explicit
              # protocol selection. Store/plan purchase paths default to the Plan
              # template before reaching the subscription factory.
              try:
                  asyncio.run(admin_create_v2(
                      AdminSubscriptionCreateV2(
                          user_id=user_id,
                          plan_id=plan_id,
                          node_ids=[node_id],
                          protocols=[],
                      ),
                      db,
                  ))
              except HTTPException as exc:
                  assert exc.status_code == 422
              else:
                  raise AssertionError('admin create must keep explicit protocol selection')
          finally:
              db.close()

          print('SUBSCRIPTION_EXPLICIT_15_PROTOCOL_CREATION_OK')
          PY

      - name: Verify frontend selection contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui=Path('components/admin-manual-subscription-create.tsx').read_text(encoding='utf-8')
          plan_ui=Path('components/legacy-plans-exact.tsx').read_text(encoding='utf-8')
          backend=Path('backend/app/routers/subscription_admin_v2.py').read_text(encoding='utf-8')
          factory=Path('backend/app/services/subscription_factory.py').read_text(encoding='utf-8')
          client=Path('lib/subscription-protocol-api.ts').read_text(encoding='utf-8')

          assert 'subscriptionProtocolApi.catalog()' in ui
          assert 'انتخاب همه ۱۵ پروتکل' in ui
          assert 'لغو انتخاب همه' in ui
          assert 'plan_id:planId||null' in ui
          assert 'protocols.length===0' in ui
          assert '/v1/subscriptions/protocol-catalog' in client
          assert '@router.get("/protocol-catalog")' in backend
          assert 'هنگام ساخت اشتراک حداقل یک پروتکل انتخاب کنید' in backend

          # Plan UI is a creation template. Runtime desired-state remains on the
          # created SubscriptionProtocol / SubscriptionNode snapshot.
          assert 'Protocols · 15' in plan_ui
          assert 'Allowed servers' in plan_ui
          assert 'node_ids' in plan_ui
          assert 'snapshotted onto each subscription' in plan_ui
          assert 'allowed_protocols = plan_template_protocols' in factory
          assert 'plan_template_node_ids' in factory
          assert 'SubscriptionProtocol(' in factory
          assert 'SubscriptionNode(' in factory

          print('SUBSCRIPTION_PROTOCOL_FRONTEND_CONTRACT_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend
        run: npm run build