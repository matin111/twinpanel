name: Adaptive Multi-Lane V149 Smoke

on:
  pull_request:
    paths:
      - "VERSION"
      - "tools/tp27-tcp-direct/**"
      - "backend/app/adaptive_multilane_v149.py"
      - "backend/app/adaptive_multilane_v151.py"
      - "backend/app/transport_candidates/__init__.py"
      - "backend/app/transport_candidates/common.py"
      - "backend/app/transport_candidates/tp27_tcp_direct.py"
      - "backend/app/tunnel_transport_manager_v12.py"
      - ".github/workflows/publish-prebuilt-release.yml"
      - ".github/workflows/adaptive-multilane-v149-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "tools/tp27-tcp-direct/**"
      - "backend/app/adaptive_multilane_v149.py"
      - "backend/app/adaptive_multilane_v151.py"
      - "backend/app/transport_candidates/__init__.py"
      - "backend/app/transport_candidates/common.py"
      - "backend/app/transport_candidates/tp27_tcp_direct.py"
      - "backend/app/tunnel_transport_manager_v12.py"
      - ".github/workflows/publish-prebuilt-release.yml"
      - ".github/workflows/adaptive-multilane-v149-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile V149/V152 runtime
        run: |
          python -m py_compile \
            backend/app/adaptive_multilane_v149.py \
            backend/app/transport_candidates/__init__.py \
            backend/app/transport_candidates/common.py \
            backend/app/transport_candidates/tp27_tcp_direct.py \
            backend/app/tunnel_transport_manager_v12.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false

      - name: Test and build source-owned Direct TCP carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd tools/tp27-tcp-direct
            GOWORK=off go test ./...
            GOWORK=off go vet ./...
          )

          BUILD_DIR="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DIR"' EXIT
          cp tools/tp27-tcp-direct/go.mod "$BUILD_DIR/go.mod"
          cp tools/tp27-tcp-direct/main.go "$BUILD_DIR/main.go"
          (
            cd "$BUILD_DIR"
            GOWORK=off go vet ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOWORK=off \
              go build -trimpath -o tp27-tcp-direct .
            test -s tp27-tcp-direct
            ./tp27-tcp-direct -h >help.txt 2>&1 || true
            grep -q -- '-token-file' help.txt
            grep -q -- '-lanes' help.txt
            grep -q -- '-mtu' help.txt
          )
          test -z "$(git status --short -- tools/tp27-tcp-direct)"

      - name: Verify V149/V152/V183 Direct TCP contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          version = Path("VERSION").read_text().strip()
          adaptive = Path("backend/app/adaptive_multilane_v149.py").read_text()
          registry = Path("backend/app/transport_candidates/__init__.py").read_text()
          common = Path("backend/app/transport_candidates/common.py").read_text()
          tcp = Path("backend/app/transport_candidates/tp27_tcp_direct.py").read_text()
          tcp_go = Path("tools/tp27-tcp-direct/main.go").read_text()
          tcp_test = Path("tools/tp27-tcp-direct/main_test.go").read_text()
          manager = Path("backend/app/tunnel_transport_manager_v12.py").read_text()
          publisher = Path(".github/workflows/publish-prebuilt-release.yml").read_text()

          prefix = "1.1.0-rc."
          assert version.startswith(prefix), version
          assert int(version[len(prefix):]) >= 149, version

          for token in (
              "TWINPANEL_ADAPTIVE_MULTILANE_V149",
              '"tp27_fast",',
              '"tp27_tcp_direct",',
              "reference_v91.activate_manager_candidate_policy_v91 = _apply_lane_policy",
              "udp_dependency=not-required",
          ):
              assert token in adaptive, token

          for token in (
              "TP27_TCP_DIRECT_SPEC",
              '"tp27_tcp_direct": TP27_TCP_DIRECT_SPEC',
              '"tp27_tcp_direct": tp27_tcp_direct.install',
              "10.254.",
              "30000 +",
          ):
              assert token in registry, token

          for token in (
              "TWINPANEL TP27 DIRECT TCP L3 V152",
              'carrier_class": "direct-tcp-l3"',
              '"depends_on": None',
              'ARTIFACT_NAME = "tp27-tcp-direct-linux-x86_64"',
              '"source_built": True',
              "--mode client",
              "--mode server",
              "--lanes {LANES}",
              "--mtu {MTU}",
              "--token-file {token_path}",
              "TCP_PORT_BASES = (46200, 47200, 48200)",
          ):
              assert token in tcp, token

          for forbidden in (
              "ARTIFACT_STORE",
              "twinpanel-backhaul-tcp-0.3.0",
              "install_tp2027_overlays",
              "backhaul_runtime_values",
              "encap fou",
          ):
              assert forbidden not in tcp, forbidden

          for token in (
              'magic     = "TP27TCP3"',
              'flag.String("token-file"',
              "subtle.ConstantTimeCompare",
              "flowHash(packet)",
              "heartbeatLoop",
              "startupHeartbeatTimeout",
              "heartbeat_timeout",
              "heartbeat_startup_timeout",
              "tcpUserTimeoutMS",
              "verified  atomic.Bool",
              "lane verified=%d",
              "healthyCount",
              "forwardPacket",
              "retrying packet on healthy fallback",
              "SetNoDelay(true)",
              "SetKeepAlive(true)",
          ):
              assert token in tcp_go, token

          assert "TestIncidentICMPPreferredLanes" in tcp_test
          assert "TestNewLaneRequiresHeartbeatPong" in tcp_test
          assert "TestForwardPacketSkipsUnverifiedPreferredLane" in tcp_test
          assert "TestForwardPacketRetriesNextHealthyLane" in tcp_test
          assert "parse_ping_rtt" in common
          assert '"jitter_ms": jitter' in common
          assert '"iran_jitter_ms"' in common
          assert '"exit_jitter_ms"' in common

          assert "apply_adaptive_multilane_v149()" in manager
          assert "tp27_fast" in manager
          assert "tp27_tcp_direct" in manager
          assert manager.index("activate_manager_candidate_policy_v91()") < manager.index(
              "apply_adaptive_multilane_v149()"
          )

          assert "Build verified TP27 Direct TCP carrier" in publisher
          assert "tp27-tcp-direct-linux-x86_64.sha256" in publisher
          assert "source/tools/tp27-tcp-direct/main.go" in publisher

          print("ADAPTIVE_MULTILANE_V149_V152_V183_SMOKE_OK")
          PY
