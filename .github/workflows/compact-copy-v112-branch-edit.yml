name: TwinPanel Compact Copy V112 Branch Edit

on:
  push:
    branches:
      - fix/compact-panel-bot-copy-v112
    paths:
      - .github/workflows/compact-copy-v112-branch-edit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-panel-bot-copy-v112
          fetch-depth: 0

      - name: Apply exact reseller bot copy cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/reseller_bot_runtime.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''                welcome = (\n                    f"👋 به <b>"\n                    f"{escape(brand)}"\n                    f"</b> خوش آمدید.\\n\\n"\n                    "از این ربات می‌توانید "\n                    "اشتراک‌های خود را مدیریت "\n                    "و اطلاعات اتصال را دریافت کنید."\n                )''',
                  '''                welcome = (\n                    f"👋 به <b>"\n                    f"{escape(brand)}"\n                    f"</b> خوش آمدید."\n                )''',
              ),
              (
                  '''                "🟢 فعال   🟡 رو به اتمام   "\n                "🔴 غیرفعال\\n\\n"\n                "یک کاربری را انتخاب کنید."''',
                  '''                "🟢 فعال   🟡 رو به اتمام   "\n                "🔴 غیرفعال"''',
              ),
              (
                  '''            await message.answer(\n                "🎫 <b>پشتیبانی</b>\\n\\n"\n                "برای ارتباط با پشتیبانی "\n                "دکمه زیر را بزنید.",''',
                  '''            await message.answer(\n                "🎫 <b>پشتیبانی</b>",''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary branch edit workflow
        run: git rm .github/workflows/compact-copy-v112-branch-edit.yml

      - name: Commit exact source cleanup
        run: |
          git config user.name "twinpanel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/reseller_bot_runtime.py
          git diff --cached --check
          git commit -m "Refine reseller bot copy density"
          git push origin HEAD:fix/compact-panel-bot-copy-v112
