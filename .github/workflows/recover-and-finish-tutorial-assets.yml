name: Recover And Finish Tutorial Assets

on:
  push:
    branches:
      - feat/store-tutorial-images-v121
    paths:
      - '.github/workflows/recover-and-finish-tutorial-assets.yml'

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-tutorial-images-v121
          fetch-depth: 0

      - name: Recover exact legacy screenshots from staged backup chunks
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/recover

          if [ -d public/learning/screenshots ] && [ "$(find public/learning/screenshots -type f -name '*.webp' | wc -l | tr -d ' ')" = 65 ]; then
            tar -czf /tmp/tutorial-assets.tar.gz -C public/learning screenshots
            echo 'Existing 65-image local asset set found.'
            exit 0
          fi

          found=0
          try_prefixes() {
            local label="$1"
            shift
            local files=("$@")
            local total="${#files[@]}"
            [ "$total" -gt 0 ] || return 0
            echo "Testing $label: $total staged chunks"
            for n in $(seq 1 "$total"); do
              : > /tmp/recover/stream.b64
              for i in $(seq 0 $((n-1))); do
                cat "${files[$i]}" >> /tmp/recover/stream.b64
              done
              tr -d '\r\n ' < /tmp/recover/stream.b64 > /tmp/recover/clean.b64
              if ! base64 -d /tmp/recover/clean.b64 > /tmp/recover/candidate.tar.gz 2>/dev/null; then
                continue
              fi
              if ! gzip -t /tmp/recover/candidate.tar.gz 2>/dev/null; then
                continue
              fi
              if ! tar -tzf /tmp/recover/candidate.tar.gz > /tmp/recover/list.txt 2>/dev/null; then
                continue
              fi
              count="$(grep -E '(^|/)screenshots/.+\.webp$' /tmp/recover/list.txt | wc -l | tr -d ' ')"
              echo "$label prefix $n/$total is valid gzip/tar with $count screenshots"
              if [ "$count" = 65 ]; then
                cp /tmp/recover/candidate.tar.gz /tmp/tutorial-assets.tar.gz
                found=1
                return 0
              fi
            done
          }

          mapfile -t finals < <(find .tutorial-import-v121 -maxdepth 1 -type f -name 'final-*.b64' | sort -V)
          try_prefixes finals "${finals[@]}"

          if [ "$found" != 1 ]; then
            mapfile -t p3 < <(find .tutorial-import-v121 -maxdepth 1 -type f -regextype posix-extended -regex '.*/part-[0-9]{3}\.b64' | sort -V)
            try_prefixes parts3 "${p3[@]}"
          fi

          if [ "$found" != 1 ]; then
            mapfile -t p2 < <(find .tutorial-import-v121 -maxdepth 1 -type f -regextype posix-extended -regex '.*/part-[0-9]{2}\.b64' | sort -V)
            try_prefixes parts2 "${p2[@]}"
          fi

          [ "$found" = 1 ] || { echo 'No complete 65-image archive exists in staged chunks.' >&2; exit 42; }

      - name: Build a clean branch from current main with only local tutorial assets
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/tutorial-unpack
          mkdir -p /tmp/tutorial-unpack
          tar -xzf /tmp/tutorial-assets.tar.gz -C /tmp/tutorial-unpack
          screenshots_root="$(find /tmp/tutorial-unpack -type d -name screenshots | head -n1)"
          test -n "$screenshots_root"
          test "$(find "$screenshots_root" -type f -name '*.webp' | wc -l | tr -d ' ')" = 65

          git fetch origin main
          git reset --hard origin/main

          rm -rf public/learning/screenshots
          mkdir -p public/learning
          cp -a "$screenshots_root" public/learning/screenshots

          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/store-guide-content.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const LEGACY_APP_IMAGE_BASE="https://movilineapp.com/learning/apps";', 'const LEGACY_APP_IMAGE_BASE="/learning/apps";')
          s=s.replace('const LEGACY_STEP_IMAGE_BASE="https://movilineapp.com/learning/screenshots";', 'const LEGACY_STEP_IMAGE_BASE="/learning/screenshots";')
          if 'https://movilineapp.com/learning/' in s:
              raise SystemExit('legacy external learning dependency remains')
          p.write_text(s,encoding='utf-8')
          PY

          test "$(find public/learning/screenshots -type f -name '*.webp' | wc -l | tr -d ' ')" = 65
          grep -Fq 'const LEGACY_STEP_IMAGE_BASE="/learning/screenshots";' lib/store-guide-content.ts

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/learning/screenshots lib/store-guide-content.ts
          git commit -m 'Bundle legacy storefront tutorial screenshots locally'
          git push --force origin HEAD:feat/store-tutorial-images-v121

      - name: Open or reuse PR and merge only after green CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr="$(gh pr list --head feat/store-tutorial-images-v121 --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --base main --head feat/store-tutorial-images-v121 --title 'Bundle legacy storefront tutorial images locally' --body 'Adds the 65 tutorial screenshots from the provided legacy backup directly to TwinPanel and switches storefront guide screenshots to local /learning assets. No external legacy domain is required.')"
            pr="${url##*/}"
          fi
          echo "Using PR #$pr"

          for i in $(seq 1 120); do
            checks="$(gh pr checks "$pr" --json name,state,bucket 2>/dev/null || true)"
            if [ -z "$checks" ] || [ "$checks" = '[]' ]; then sleep 10; continue; fi
            if echo "$checks" | jq -e 'any(.[]; (.bucket=="fail" or .bucket=="cancel"))' >/dev/null; then
              echo "$checks"; exit 50
            fi
            if echo "$checks" | jq -e 'all(.[]; (.bucket=="pass" or .bucket=="skipping"))' >/dev/null; then
              echo "$checks"
              gh pr merge "$pr" --squash --delete-branch
              exit 0
            fi
            sleep 10
          done
          echo 'CI wait timed out' >&2
          exit 51
