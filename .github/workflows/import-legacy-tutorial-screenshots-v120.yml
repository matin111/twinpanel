name: TwinPanel one-time legacy tutorial screenshot import V120

on:
  push:
    branches:
      - feat/store-tutorial-screenshots-v120-final
    paths:
      - .github/workflows/import-legacy-tutorial-screenshots-v120.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/store-tutorial-screenshots-v120-final
          fetch-depth: 0

      - name: Import verified legacy screenshots and wire existing guide
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import urllib.request

          base = "https://movilineapp.com/learning/screenshots"
          inventory = {
              "windows": {
                  "cisco": [1,2,3,4,5],
                  "openvpn": [1,2,3,4,5],
                  "wireguard": [3,4,5],
                  "l2tp": [1,2,3,4,5],
                  "v2ray": [1,3,5],
              },
              "android": {
                  "cisco": [1,2,3,4,5],
                  "openvpn": [1,2,3,4],
                  "wireguard": [1,2,3,4,5],
                  "l2tp": [1,2,3,4,5],
                  "v2ray": [1,2,3,4,5],
              },
              "ios": {
                  "cisco": [1,2,3,4,5],
                  "openvpn": [2,3,4,5],
                  "wireguard": [3,4,5],
                  "l2tp": [1,2,3,4,5],
                  "v2ray": [3,4,5],
              },
          }

          keys = []
          total_before = 0
          total_after = 0

          for platform, protocols in inventory.items():
              for protocol, steps in protocols.items():
                  target_dir = Path("public/learning/screenshots") / platform / protocol
                  target_dir.mkdir(parents=True, exist_ok=True)
                  for step in steps:
                      name = f"{step:02d}.webp"
                      key = f"{platform}/{protocol}/{step:02d}"
                      url = f"{base}/{key}.webp"
                      original = target_dir / (name + ".source")
                      target = target_dir / name
                      req = urllib.request.Request(url, headers={"User-Agent":"TwinPanel-Tutorial-Import/120"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = response.read()
                      if len(payload) < 20 or payload[:4] != b"RIFF" or payload[8:12] != b"WEBP":
                          raise SystemExit(f"invalid WebP payload: {url}")
                      original.write_bytes(payload)
                      total_before += len(payload)
                      subprocess.run([
                          "cwebp", "-quiet", "-q", "60", "-m", "6",
                          str(original), "-o", str(target),
                      ], check=True)
                      data = target.read_bytes()
                      if len(data) < 20 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                          raise SystemExit(f"re-encoded WebP invalid: {target}")
                      total_after += len(data)
                      original.unlink()
                      keys.append(key)

          if len(keys) != 65:
              raise SystemExit(f"unexpected tutorial screenshot count: {len(keys)}")

          path = Path("lib/store-guide-content.ts")
          text = path.read_text(encoding="utf-8")
          old = '''export function storeGuideScreenshot(platform:StoreGuidePlatform,protocol:StoreGuideProtocol,index:number):string{\n  return `${LEGACY_STEP_IMAGE_BASE}/${platform}/${protocol}/${String(index+1).padStart(2,"0")}.webp`;\n}\n'''
          local_keys = "\n".join(f'  "{key}",' for key in keys)
          new = f'''const LOCAL_STEP_IMAGE_KEYS=new Set<string>([\n{local_keys}\n]);\n\nexport function storeGuideScreenshot(platform:StoreGuidePlatform,protocol:StoreGuideProtocol,index:number):string{{\n  const step=String(index+1).padStart(2,"0");\n  const key=`${{platform}}/${{protocol}}/${{step}}`;\n  if(LOCAL_STEP_IMAGE_KEYS.has(key))return `/learning/screenshots/${{key}}.webp`;\n  return `${{LEGACY_STEP_IMAGE_BASE}}/${{key}}.webp`;\n}}\n'''
          if old not in text:
              raise SystemExit("storeGuideScreenshot source contract changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          print(f"IMPORTED={len(keys)}")
          print(f"BYTES_BEFORE={total_before}")
          print(f"BYTES_AFTER={total_after}")
          PY

          test "$(find public/learning/screenshots -type f -name '*.webp' | wc -l)" -eq 65
          ! find public/learning/screenshots -type f -name '*.source' -print -quit | grep -q .

      - name: Remove one-time importer and commit final source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-legacy-tutorial-screenshots-v120.yml
          git add public/learning/screenshots lib/store-guide-content.ts
          git diff --cached --check
          git commit -m "Bundle compressed legacy tutorial screenshots"
          git push origin HEAD:feat/store-tutorial-screenshots-v120-final
