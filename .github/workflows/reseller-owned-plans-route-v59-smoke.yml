name: Reseller Owned Plans Route V59 Smoke

on:
  pull_request:
    paths:
      - 'components/routed-page-client.tsx'
      - 'components/reseller-owned-plans.tsx'
      - 'lib/reseller-runtime-api.ts'
      - 'backend/app/routers/reseller_owned_plans.py'
      - '.github/workflows/reseller-owned-plans-route-v59-smoke.yml'
  workflow_dispatch:

jobs:
  reseller-owned-plans-route:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify reseller-owned plan route contracts
        shell: python
        run: |
          from pathlib import Path

          routing = Path('components/routed-page-client.tsx').read_text(encoding='utf-8')
          owned = Path('components/reseller-owned-plans.tsx').read_text(encoding='utf-8')
          api = Path('lib/reseller-runtime-api.ts').read_text(encoding='utf-8')
          backend = Path('backend/app/routers/reseller_owned_plans.py').read_text(encoding='utf-8')

          assert 'const ResellerOwnedPlansRuntime=dynamic(()=>import("./reseller-owned-plans").then(m=>m.ResellerOwnedPlansRuntime));' in routing
          assert 'if(key==="reseller/sales") return <ResellerOwnedPlansRuntime/>;' in routing
          assert 'if(key==="reseller/sales") return <ResellerSubscriptionPlansV3/>;' not in routing

          assert 'این پلن‌ها مستقل از پلن‌های پنل اصلی هستند.' in owned
          assert 'createPlan(payload)' in owned
          assert 'updatePlan(editingId,payload)' in owned
          assert 'deletePlan(id)' in owned

          assert 'plans:()=>request<ResellerRow[]>("/v1/reseller/owned-plans")' in api
          assert 'createPlan:' in api and '"/v1/reseller/owned-plans"' in api
          assert 'updatePlan:' in api and '/v1/reseller/owned-plans/${planId}' in api

          assert '@router.get("/owned-plans")' in backend
          assert '@router.post("/owned-plans")' in backend
          assert 'ResellerBotPlan.reseller_id == reseller.id' in backend
          assert 'create_owned_plan(' in backend

          print('RESELLER_OWNED_PLANS_ROUTE_V59_OK')

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --include=optional --no-audit --no-fund
          fi

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE: ''
        run: npm run build
