name: Sudoku Shared Native Presence V1 Smoke

on:
  pull_request:
    paths:
      - backend/app/services/sudoku_shared_native_presence_v1.py
      - backend/scripts/twinpanel_sudoku_fast_presence_worker.py
      - backend/tests/sudoku_shared_native_presence_v1_smoke.py
      - backend/tests/sudoku_fast_presence_isolation_v1_smoke.py
      - .github/workflows/sudoku-shared-native-presence-v1-smoke.yml
  workflow_dispatch:

jobs:
  per-account-native-presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Validate source and per-account presence regression
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_NAME: TwinPanel-CI
          APP_ENV: test
          APP_SECRET_KEY: ci-only-sudoku-native-presence-key
          DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/test
          NODE_AGENT_SHARED_SECRET: ci-node-agent-only-nonproduction
        run: |
          python -m py_compile app/services/sudoku_shared_native_presence_v1.py scripts/twinpanel_sudoku_fast_presence_worker.py tests/sudoku_shared_native_presence_v1_smoke.py
          python tests/sudoku_shared_native_presence_v1_smoke.py
          python tests/sudoku_fast_presence_isolation_v1_smoke.py
