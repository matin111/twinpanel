name: TwinPanel Public Mobile Composition V22 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_hub_live_v5.py'
      - 'backend/app/routers/public_connection_mobile_server_inventory_v18.py'
      - 'backend/app/routers/public_connection_protocol_actions_v20.py'
      - 'backend/app/routers/public_connection_canonical_mobile_v26.py'
      - 'backend/tests/integration/test_public_connection_canonical_mobile_v319.py'
      - 'backend/tests/smoke_public_connection_mobile_ui_v27.py'
      - 'backend/tests/smoke_public_connection_presentation_reset_v33.py'
      - '.github/workflows/public-connection-mobile-composition-v22-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile canonical public connection refinements
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_hub_live_v5.py \
            backend/app/routers/public_connection_mobile_server_inventory_v18.py \
            backend/app/routers/public_connection_protocol_actions_v20.py \
            backend/app/routers/public_connection_canonical_mobile_v26.py \
            backend/tests/integration/test_public_connection_canonical_mobile_v319.py \
            backend/tests/smoke_public_connection_mobile_ui_v27.py \
            backend/tests/smoke_public_connection_presentation_reset_v33.py

      - name: Verify canonical presentation composition
        run: |
          python - <<'PY'
          from pathlib import Path

          hub = Path('backend/app/routers/public_connection_hub_live_v5.py').read_text(encoding='utf-8')
          v26 = Path('backend/app/routers/public_connection_canonical_mobile_v26.py').read_text(encoding='utf-8')

          include_v16 = 'router.include_router(public_connection_modern_delivery_v16_router)'
          import_v18 = 'public_connection_mobile_server_inventory_v18 as _public_connection_mobile_server_inventory_v18'
          assert import_v18 in hub, 'V18 endpoint registration import is missing'
          assert hub.index(import_v18) < hub.index(include_v16), 'V18 endpoint registration must occur before V16 router include'

          retired_hub = (
              'refine_public_connection_hub_v9',
              'refine_public_connection_mobile_protocols_v17',
              'refine_public_connection_mobile_server_inventory_v18(source)',
              'refine_public_connection_protocol_uri_details_v21',
          )
          for symbol in retired_hub:
              assert symbol not in hub, f'retired renderer still active in hub: {symbol}'

          chain = [
              'source = refine_public_connection_device_actions_v11(source)',
              'source = refine_public_connection_windows_v12(source)',
              'source = refine_public_connection_modern_delivery_v13(source, token, db)',
              'source = refine_public_connection_modern_names_v14(source, token, db)',
              'source = refine_public_connection_modern_import_v15(source, token, db)',
              'source = refine_public_connection_modern_delivery_v16(source, token, db)',
              'source = refine_public_connection_protocol_actions_v20(source)',
              'source = refine_public_connection_xray_profiles_v48(source)',
              'source = refine_public_connection_canonical_mobile_v26(source)',
          ]
          positions = [hub.index(item) for item in chain]
          assert positions == sorted(positions), f'bad canonical refinement order: {positions}'

          assert 'TWINPANEL_PUBLIC_CONNECT_CANONICAL_MOBILE_V26' in v26
          assert 'public_connection_protocol_subscriptions_mount_v30' in v26
          assert "platform==='android'||platform==='ios'" in v26
          assert '!isPhone()||!window.matchMedia(MOBILE).matches' in v26

          retired_stack = (
              'refine_public_connection_mobile_ui_v27(source)',
              'refine_public_connection_mobile_v28(source)',
              'refine_public_connection_presentation_v29(source)',
              'refine_public_connection_protocol_subscriptions_v30(source)',
              'refine_public_connection_unified_actions_v31(source)',
              'refine_public_connection_platform_guard_v32(source)',
          )
          for symbol in retired_stack:
              assert symbol not in v26, f'stacked presentation still active: {symbol}'

          print('PUBLIC_PRESENTATION_RESET_V33_COMPOSITION=PASS')
          PY

      - name: Run canonical mobile regression
        run: python backend/tests/integration/test_public_connection_canonical_mobile_v319.py

      - name: Run retired-stack composition regression
        run: python backend/tests/smoke_public_connection_mobile_ui_v27.py

      - name: Run V33 reset regression
        run: python backend/tests/smoke_public_connection_presentation_reset_v33.py
