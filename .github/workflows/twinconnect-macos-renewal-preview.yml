name: TwinConnect macOS Native Preview

on:
  pull_request:
    paths:
      - 'clients/twinconnect/**'
      - '.github/workflows/twinconnect-macos-renewal-preview.yml'
  push:
    branches:
      - 'feat/twinconnect-ios-simulator-foundation-20261115'
      - 'feat/twinconnect-macos-packet-tunnel-foundation-20261116'
    paths:
      - 'clients/twinconnect/**'
      - '.github/workflows/twinconnect-macos-renewal-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twinconnect-macos-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-preview:
    name: macOS native bridge, Flutter tests and unsigned app
    runs-on: macos-15
    timeout-minutes: 55
    defaults:
      run:
        working-directory: clients/twinconnect
    steps:
      - uses: actions/checkout@v4
      - name: macOS toolchain
        shell: bash
        run: |
          sw_vers
          xcodebuild -version
          xcrun --find swiftc
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Generate native macOS runner
        run: flutter create --platforms=macos --org com.twinpanel --project-name twinconnect .
      - name: Install Mac capability channel and HTTPS sandbox entitlement
        shell: bash
        run: |
          python3 macos_native/install_macos_bridge.py
          plutil -lint macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          for name in ("DebugProfile.entitlements","Release.entitlements"):
              path = Path("macos/Runner") / name
              with path.open("rb") as f:
                  entitlements = plistlib.load(f)
              assert entitlements.get("com.apple.security.network.client") is True, path
              assert not entitlements.get("com.apple.developer.networking.networkextension"), path
          source = Path("macos/Runner/MainFlutterWindow.swift").read_text()
          assert source.count("TwinConnectMacOSVPNBridge.register(") == 1
          assert "MACOS_PACKET_TUNNEL_NOT_INSTALLED" in source
          print("Mac app network permission and fail-closed native bridge confirmed")
          PY
      - name: Create macOS packet tunnel extension and validate native sources
        shell: bash
        run: |
          gem install xcodeproj --no-document
          ruby macos_native/install_packet_tunnel_target.rb
          ruby -e "require 'xcodeproj'; p=Xcodeproj::Project.open('macos/Runner.xcodeproj'); abort 'missing mac target' unless p.targets.any? { |t| t.name == 'PacketTunnel' }"
          plutil -lint macos_native/PacketTunnel-Info.plist macos_native/PacketTunnel.entitlements
          test -s macos_native/PacketTunnelProvider.swift
      - name: Compile Packet Tunnel extension for macOS (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project macos/Runner.xcodeproj -target PacketTunnel -configuration Release -sdk macosx CODE_SIGNING_ALLOWED=NO build | tail -60
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Flutter analysis
        run: flutter analyze --no-fatal-infos
      - name: Run all Flutter and platform contract tests
        run: flutter test --reporter expanded
      - name: Build macOS Release app (unsigned preview)
        env:
          TWINCONNECT_DIRECTORY_URL: ${{ vars.TWINCONNECT_DIRECTORY_URL || 'https://panel.matindnspro.sbs' }}
        run: |
          flutter build macos --release \
            --dart-define=TWINCONNECT_DIRECTORY_URL="$TWINCONNECT_DIRECTORY_URL"
      - name: Bundle verified native Hysteria2 transport binary (not a tunnel)
        shell: bash
        run: |
          set -euo pipefail
          bash macos_native/fetch_singbox_macos.sh
          app="build/macos/Build/Products/Release/twinconnect.app"
          target="$app/Contents/Resources/TwinConnectEngines"
          mkdir -p "$target"
          cp macos_native/build/singbox/arm64/sing-box "$target/sing-box"
          chmod 755 "$target/sing-box"
          "$target/sing-box" check -c macos_native/hysteria2-config-check.json
          # Verify the actual Dart macOS composer, not only a static JSON
          # fixture. No production secrets are used or printed.
          dart run tool/macos_hysteria2_config_fixture.dart > "$RUNNER_TEMP/twinconnect-macos-hy2-synthetic.json"
          "$target/sing-box" check -c "$RUNNER_TEMP/twinconnect-macos-hy2-synthetic.json"
          dart run tool/macos_tuic_config_fixture.dart > "$RUNNER_TEMP/twinconnect-macos-tuic-synthetic.json"
          "$target/sing-box" check -c "$RUNNER_TEMP/twinconnect-macos-tuic-synthetic.json"
          dart run tool/macos_anytls_config_fixture.dart > "$RUNNER_TEMP/twinconnect-macos-anytls-synthetic.json"
          "$target/sing-box" check -c "$RUNNER_TEMP/twinconnect-macos-anytls-synthetic.json"
          # NaiveProxy uses Cronet and is omitted from some sing-box builds.
          # The official macOS release must contain the outbound build tag.
          "$target/sing-box" version | grep -q 'with_naive_outbound'
          dart run tool/macos_naive_config_fixture.dart > "$RUNNER_TEMP/twinconnect-macos-naive-synthetic.json"
          "$target/sing-box" check -c "$RUNNER_TEMP/twinconnect-macos-naive-synthetic.json"
          echo "Synthetic NaiveProxy outbound parsed by official Cronet-enabled sing-box"
          echo "Synthetic macOS AnyTLS, TUIC and Hysteria2 profiles parsed by official sing-box"
          file "$target/sing-box" | grep -q arm64
      - name: Bundle pinned Xray/V2Ray transport binary
        shell: bash
        run: |
          set -euo pipefail
          bash macos_native/fetch_xray_macos.sh
          app="build/macos/Build/Products/Release/twinconnect.app"
          target="$app/Contents/Resources/TwinConnectEngines"
          mkdir -p "$target"
          cp macos_native/build/xray/arm64/xray "$target/xray"
          chmod 755 "$target/xray"
          "$target/xray" run -test -config macos_native/xray-config-check.json
          file "$target/xray" | grep -q arm64
      - name: Verify Mac app bundle, native channel and architecture
        shell: bash
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/twinconnect.app"
          test -d "$app"
          exe="$app/Contents/MacOS/twinconnect"
          test -x "$exe"
          test -d "$app/Contents/Frameworks/FlutterMacOS.framework"
          test -d "$app/Contents/Frameworks/App.framework"
          test -d "$app/Contents/PlugIns/PacketTunnel.appex"
          test -x "$app/Contents/Resources/TwinConnectEngines/xray"
          "$app/Contents/Resources/TwinConnectEngines/xray" version
          test -x "$app/Contents/Resources/TwinConnectEngines/sing-box"
          "$app/Contents/Resources/TwinConnectEngines/sing-box" version
          # Transport binary is packaged but no PacketTunnel -> sing-box
          # packetFlow adapter exists. Never claim connected traffic.
          /usr/libexec/PlistBuddy -c 'Print TwinConnectProtocolBackendLinked' "$app/Contents/PlugIns/PacketTunnel.appex/Contents/Info.plist" | grep -qx false
          plutil -lint "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist"
          file "$exe"
          lipo -archs "$exe"
          otool -L "$exe" | head -25
          # CI is *not* a Developer ID notarization step. Do not claim this
          # unsigned preview can establish a macOS Network Extension VPN.
          codesign --display --verbose=2 "$app" 2>&1 || true
          {
            echo "TwinConnect macOS native UI and account preview"
            echo "Repository commit: $GITHUB_SHA"
            echo "Mac PacketTunnel extension: EMBEDDED, backend NOT LINKED"
            echo "Hysteria2 sing-box arm64: BUNDLED and offline config checked"
            echo "Hysteria2 packetFlow bridge: NOT IMPLEMENTED"
            echo "Xray/V2Ray arm64: BUNDLED and offline config checked"
            echo "Xray packetFlow bridge: NOT IMPLEMENTED"
            echo "Code signing/notarization: NOT a Developer ID release"
            echo "VPN connect/egress: NOT VERIFIED"
            echo "Built application: twinconnect.app"
          } > build/macos/Build/Products/Release/MACOS-TEST-NOTES.txt
      - name: Archive Mac app and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent twinconnect.app TwinConnect-macOS-Native-Preview.zip
          shasum -a 256 TwinConnect-macOS-Native-Preview.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TwinConnect-macOS-Native-Preview-UNSIGNED
          path: |
            clients/twinconnect/build/macos/Build/Products/Release/TwinConnect-macOS-Native-Preview.zip
            clients/twinconnect/build/macos/Build/Products/Release/SHA256SUMS.txt
            clients/twinconnect/build/macos/Build/Products/Release/MACOS-TEST-NOTES.txt
          if-no-files-found: error
          retention-days: 14
