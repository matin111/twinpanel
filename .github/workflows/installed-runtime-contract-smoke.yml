name: TwinPanel Installed Runtime Contract Smoke

on:
  pull_request:
    paths:
      - 'lib/api.ts'
      - 'components/support-chat-widget-v2.tsx'
      - 'components/support-center-runtime-v3.tsx'
      - 'components/ui.tsx'
      - 'app/v1/**'
      - 'backend/app/routers/__init__.py'
      - 'backend/app/routers/support_live_delta.py'
      - 'backend/scripts/twinpanel_feature_audit.py'
      - '.github/workflows/installed-runtime-contract-smoke.yml'
  workflow_dispatch:

jobs:
  portable-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify portable same-origin API contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path('lib/api.ts').read_text(encoding='utf-8')
          assert 'browserOrigin' in api
          assert '!configuredApiBase||isLoopbackApiBase' in api
          assert 'window.location.origin' in api

          proxy = Path('app/v1/[...path]/route.ts').read_text(encoding='utf-8')
          assert 'TWINPANEL_BACKEND_URL' in proxy
          assert 'http://127.0.0.1:8095' in proxy

          audit = Path('backend/scripts/twinpanel_feature_audit.py').read_text(encoding='utf-8')
          assert 'installed-read-only' in audit
          assert 'feature.support' in audit
          assert 'feature.telegram' in audit
          assert 'feature.update_system' in audit

          support_ui = Path('components/support-center-runtime-v3.tsx').read_text(encoding='utf-8')
          support_delta = Path('backend/app/routers/support_live_delta.py').read_text(encoding='utf-8')
          routers_init = Path('backend/app/routers/__init__.py').read_text(encoding='utf-8')
          delta_path = '/tickets/{ticket_id}/messages-after'
          assert '/messages-after?after_id=${after}' in support_ui
          assert delta_path in support_delta
          assert 'SupportMessage.id > after_id' in support_delta
          assert 'support_live_delta' in routers_init

          shell = Path('components/ui.tsx').read_text(encoding='utf-8')
          assert '<main onPointerDown={closeMenus}>' in shell

          print('PORTABLE_RUNTIME_CONTRACT_OK')
          PY

      - name: Compile installed feature audit and support delta
        run: |
          python3 -m py_compile backend/scripts/twinpanel_feature_audit.py
          python3 -m py_compile backend/app/routers/support_live_delta.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build exact portable frontend mode
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE: ''
        run: npm run build

      - name: Verify standalone frontend exists
        run: test -f .next/standalone/server.js
