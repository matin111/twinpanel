name: Central Exact Node Identity Link Repair
on:
  pull_request:
    paths:
      - backend/scripts/twinpanel_existing_identity_link_repair_v1.py
      - backend/tests/test_central_existing_identity_link_repair_v1.py
      - .github/workflows/central-exact-identity-link-repair-v1.yml
permissions:
  contents: read
jobs:
  exact-match-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile backend/scripts/twinpanel_existing_identity_link_repair_v1.py backend/tests/test_central_existing_identity_link_repair_v1.py
      - run: python backend/tests/test_central_existing_identity_link_repair_v1.py -v
