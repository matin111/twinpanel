name: TwinConnect Windows Portable Preview

on:
  pull_request:
    paths:
      - "clients/twinconnect/**"
      - ".github/workflows/twinconnect-windows-preview.yml"
  push:
    branches:
      - feat/twinconnect-windows-preview-v1
      - integration/twinconnect-windows-app-20261110
    paths:
      - "clients/twinconnect/**"
      - ".github/workflows/twinconnect-windows-preview.yml"

jobs:
  windows-preview:
    # PRs have read-only permissions; only trusted branch pushes may publish
    # unsigned preview assets to a clearly marked prerelease.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/twinconnect
    env:
      # Temporary panel-hosted HTTPS mirror of the vendor directory for preview.
      # A dedicated owned HTTPS domain must replace this before production.
      # Using a repository variable takes precedence without modifying code.
      TWINCONNECT_DIRECTORY_URL: ${{ vars.TWINCONNECT_DIRECTORY_URL || 'https://panel.matindnspro.sbs' }}
      SIGNING_CONFIGURED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/twinconnect-windows-app-20261110' && secrets.TWINCONNECT_SIGN_PFX_BASE64 != '' && secrets.TWINCONNECT_SIGN_PFX_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      # Avoid a stalled Flutter SDK cache restore on GitHub Windows runners.
      # This build needs a fresh SDK setup; pub dependencies are fetched below.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Generate native Windows Flutter project
        run: flutter create --platforms=windows --org com.twinpanel --project-name twinconnect .
      - name: Install fail-closed Windows VPN native bridge
        run: python tools/install_windows_native.py
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Verify Dart compilation and tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded
      - name: Verify HTTPS directory is configured and reachable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $origin = [uri]$env:TWINCONNECT_DIRECTORY_URL
          if ($origin.Scheme -ne "https" -or !$origin.Host -or $origin.UserInfo -or
              $origin.Query -or $origin.Fragment -or $origin.AbsolutePath -ne "/") {
            throw "TWINCONNECT_DIRECTORY_URL must be a clean HTTPS origin"
          }
          $probe = "$($origin.AbsoluteUri.TrimEnd('/'))/v1/app/resolve/TP934FE9"
          $result = Invoke-RestMethod -Uri $probe -Method Get -TimeoutSec 15
          if ($result.namespace -ne "TP934FE9" -or
              $result.api_origin -ne "https://panel.matindnspro.sbs") {
            throw "Tenant directory contract invalid or panel registration missing"
          }
          Write-Host "Verified HTTPS directory and registered panel namespace"
      - name: Verify real TwinConnect dashboard redesign is present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dashboard = Get-Content -LiteralPath 'lib/live_dashboard.dart' -Raw
          foreach ($marker in @('TunnelTrafficChart(', 'liveHomeDataProgress',
              'liveConnectionControlsButton', 'Connect now',
              'BackdropFilter(', 'liveHomeExpiryChip')) {
            if (!$dashboard.Contains($marker)) {
              throw "Operational dashboard update missing from this checkout: $marker"
            }
          }
          if (!(Test-Path 'lib/tunnel_traffic_chart.dart')) {
            throw 'Real native tunnel traffic chart source missing'
          }
          Write-Host "Verified operational TwinConnect UI redesign in commit $env:GITHUB_SHA"
      - name: Build Windows x64 standalone directory
        shell: pwsh
        run: flutter build windows --release "--dart-define=TWINCONNECT_DIRECTORY_URL=$env:TWINCONNECT_DIRECTORY_URL"
      - name: Bundle pinned SHA256-verified official Xray-core
        shell: pwsh
        run: ./tools/bundle_xray_windows.ps1
      - name: Check Xray-core synthetic stdin config without routes
        shell: pwsh
        run: ./tools/check_xray_windows.ps1
      - name: Bundle checksum-pinned official Sudoku Windows core
        shell: pwsh
        run: ./tools/bundle_sudoku_windows.ps1
      - name: Verify official Sudoku core accepts synthetic client config
        shell: pwsh
        run: ./tools/check_sudoku_windows.ps1
      - name: Bundle official SHA256-pinned Mieru Windows client
        shell: pwsh
        run: ./tools/bundle_mieru_windows.ps1
      - name: Verify independent Mieru engine with synthetic loopback SOCKS5
        shell: pwsh
        run: ./tools/check_mieru_windows.ps1
      - name: Bundle official pinned TrustTunnel Windows CLI and verify release SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/bundle_trusttunnel_windows.ps1
      - name: Bundle official SHA256-verified AmneziaWG Windows prerequisite
        shell: pwsh
        run: ./tools/bundle_amneziawg_windows.ps1
      - name: Bundle pinned and verified sing-box engine (not yet enabled)
        shell: pwsh
        run: ./tools/bundle_singbox_windows.ps1
      - name: Verify bundled sing-box accepts synthetic Windows TUN config
        shell: pwsh
        run: ./tools/check_singbox_windows.ps1
      - name: Exercise sing-box runtime with loopback-only synthetic proxy
        shell: pwsh
        run: ./tools/smoke_singbox_loopback_windows.ps1
      - name: Verify actual TUN adapter creation without changing system routes
        shell: pwsh
        run: ./tools/smoke_singbox_tun_windows.ps1
      - name: Bundle signed OpenConnect Windows prerequisite
        shell: pwsh
        env:
          TWINCONNECT_OPENCONNECT_SHA256: ${{ vars.TWINCONNECT_OPENCONNECT_SHA256 }}
        run: ./tools/bundle_openconnect_windows.ps1
      - name: Verify packaged OpenConnect upstream provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Get-Location) 'build/windows/x64/runner/Release/prerequisites/openconnect-gui-1.6.2-win64.exe'
          if (!(Test-Path $exe)) { throw 'OpenConnect prerequisite is missing from release' }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne 'Valid') { throw 'Bundled OpenConnect vendor signature invalid' }
          $provenance = Join-Path (Split-Path $exe) 'OPENCONNECT-SOURCE.txt'
          if (!(Test-Path $provenance)) { throw 'OpenConnect provenance missing' }
      - name: Extract and execute verified OpenConnect CLI from vendor package
        shell: pwsh
        run: ./tools/extract_openconnect_windows.ps1
      - name: Bundle official signed OpenVPN Community MSI for integrated setup
        shell: pwsh
        env:
          TWINCONNECT_OPENVPN_SHA256: ${{ vars.TWINCONNECT_OPENVPN_SHA256 }}
        run: ./tools/bundle_openvpn_windows.ps1
      - name: Inspect release binaries with Windows Defender (when available)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path (Get-Location) 'build/windows/x64/runner/Release'
          $defender = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          if (!(Test-Path $defender)) {
            Write-Warning 'Defender command-line scanner is not available on this runner. No malware-clean claim is made.'
          } else {
            & $defender -Scan -ScanType 3 -File $release -DisableRemediation
            $scanExit = $LASTEXITCODE
            if ($scanExit -ne 0) {
              throw "Windows Defender scan did not complete cleanly (exit code $scanExit); refusing artifact publication."
            }
            Write-Host 'Windows Defender on-demand scan completed successfully'
          }
      - name: Authenticode-sign app when a publisher certificate is configured
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        shell: pwsh
        env:
          TWINCONNECT_SIGN_PFX_BASE64: ${{ secrets.TWINCONNECT_SIGN_PFX_BASE64 }}
          TWINCONNECT_SIGN_PFX_PASSWORD: ${{ secrets.TWINCONNECT_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:TWINCONNECT_SIGN_PFX_BASE64 -or !$env:TWINCONNECT_SIGN_PFX_PASSWORD) {
            throw 'Incomplete signing configuration'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'twinconnect-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:TWINCONNECT_SIGN_PFX_BASE64))
            $password = ConvertTo-SecureString $env:TWINCONNECT_SIGN_PFX_PASSWORD -AsPlainText -Force
            $certificate = Get-PfxCertificate -FilePath $pfx -Password $password
            if (!$certificate.HasPrivateKey -or
                $certificate.NotAfter -le (Get-Date) -or
                !$certificate.EnhancedKeyUsageList.ObjectId.Value.Contains('1.3.6.1.5.5.7.3.3')) {
              throw 'Code signing certificate is invalid, expired, or lacks code-signing usage'
            }
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -File |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw 'Windows SDK signtool.exe not available' }
            $exe = Join-Path (Get-Location) 'build/windows/x64/runner/Release/twinconnect.exe'
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:TWINCONNECT_SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw 'App signing failed' }
            & $signtool.FullName verify /pa /all $exe
            if ($LASTEXITCODE -ne 0) { throw 'App Authenticode verification failed' }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Package portable ZIP and usage instructions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path (Get-Location) "build/windows/x64/runner/Release"
          $exe = Join-Path $release "twinconnect.exe"
          if (!(Test-Path $exe)) {
            throw "Windows release executable missing: $exe"
          }
          @'
          TwinConnect - Windows portable PREVIEW (x64)
          
          1. Extract the complete ZIP to a folder (do not run from inside ZIP).
          2. Run twinconnect.exe from that folder. Keep DLL/data files beside it.
          3. For UI-only demo: use the Dev Dashboard artifact instead.
          4. For experimental REAL WireGuard:
             - Install official WireGuard for Windows from wireguard.com/install.
             - Run THIS Portable EXE as Administrator (Windows tunnel service).
             - Sign in with a valid TwinConnect APP username/password.
             - The vendor directory URL and licensed panel backend must be
               deployed and reachable over HTTPS at build time.
             - Pick an ONLINE authorized WireGuard server and Start.
             - Read the actual service/handshake status; never assume that
               an interface-up state means internet connectivity.
             - Stop the tunnel before closing the app, and check for leaks.
          5. Only one TwinConnect WireGuard tunnel is supported per PC.
          6. This is an unsigned TEST build. Only run builds you trust.

          IMPORTANT:
          - No WireGuard software or drivers are bundled with TwinConnect.
          - The sing-box 1.14.4 executable is bundled and SHA256-verified,
            but its native TUN lifecycle is not connected in this build.
          - Only WireGuard has a verified Windows connection adapter.
          - Do not interpret bundled executable as enabled protocol support.
          - Only one-peer WireGuard profiles with DNS and complete IPv4
            default coverage are accepted. The native adapter derives
            protected /0 routes in memory from panel split-/1 routes; it
            does not modify server endpoints, keys or panel records.
          - The native adapter writes a DPAPI-encrypted file with restrictive
            admin/SYSTEM ACLs; no plain private-key config is saved to disk.
          - The directory URL is built in for this development preview.
          - Until the project gets an owned HTTPS vendor domain, the
            test directory uses an existing HTTPS panel reverse proxy.
            Do not use it as a permanent customer deployment address.
          - The Dev Dashboard artifact remains entirely offline.
          - Do not deploy these experimental binaries to customers yet.
          '@ | Set-Content -Path (Join-Path $release "README-TEST.txt") -Encoding UTF8
          @(
            'TwinConnect real operational Windows client (not the Dev dashboard)',
            "Source commit: $env:GITHUB_SHA",
            "Workflow run: $env:GITHUB_RUN_ID",
            'Check this file when replacing an older installed TwinConnect.',
            'This is an internal test build. Do not distribute to customers.'
          ) | Set-Content -Path (Join-Path $release 'BUILD-SOURCE.txt') -Encoding UTF8
          $zip = Join-Path (Get-Location) "TwinConnect-Windows-Preview.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $release "*") -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "ZIP packaging failed" }
          Write-Host ("Windows ZIP bytes: " + (Get-Item $zip).Length)
      - name: Install Inno Setup installer compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Validate global guard installer release gate and PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path (Get-Location) 'tools/install_guard_service.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Guard service installer PowerShell syntax invalid'
          }
          $setup = Get-Content 'installer.iss' -Raw
          if (!$setup.Contains('#define IncludeVerifiedGlobalGuard 0')) {
            throw 'Guard must remain release-gated until leak tests pass'
          }
          if (!$setup.Contains('install_guard_service.ps1') -or
              !$setup.Contains('-Action Uninstall')) {
            throw 'Automated service lifecycle missing'
          }
      - name: Validate Windows network reset and guard-owned WFP recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path (Get-Location) 'tools/reset_windows_network.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'Network recovery script has parse errors' }
          $source = Get-Content $path -Raw
          foreach ($marker in @('Get-AuthenticodeSignature', 'offline-status',
              'OWNED_RULES_PRESENT 0 0 0', 'winsock reset', 'int ip reset')) {
            if (!$source.Contains($marker)) {
              throw "Missing Windows recovery check: $marker"
            }
          }
          foreach ($marker in @('GuardOnly', 'TWINCONNECT_GUARD_RECOVERY_OK')) {
            if (!$source.Contains($marker)) {
              throw "Missing guard-only emergency recovery: $marker"
            }
          }
          $settings = Get-Content 'lib/vpn_settings.dart' -Raw
          foreach ($marker in @('vpnGuardEmergencyRecovery', '_recoverWindowsGuard')) {
            if (!$settings.Contains($marker)) {
              throw "Missing visible Windows guard emergency control: $marker"
            }
          }
          if ($source.Contains('advfirewall reset')) {
            throw 'Network recovery must not reset unrelated firewall rules'
          }
          $iss = Get-Content 'installer.iss' -Raw
          if (!$iss.Contains('reset_windows_network.ps1')) {
            throw 'Windows Setup must bundle the network recovery script'
          }
      - name: Build signed WFP service for approved installer
        if: ${{ env.SIGNING_CONFIGURED == 'true' && vars.TWINCONNECT_GUARD_RELEASE_APPROVED == 'true' }}
        shell: pwsh
        env:
          TWINCONNECT_SIGN_PFX_BASE64: ${{ secrets.TWINCONNECT_SIGN_PFX_BASE64 }}
          TWINCONNECT_SIGN_PFX_PASSWORD: ${{ secrets.TWINCONNECT_SIGN_PFX_PASSWORD }}
          GUARD_SIGNER: ${{ vars.TWINCONNECT_GUARD_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:GUARD_SIGNER -or $env:GUARD_SIGNER.Length -ne 40 -or
              $env:GUARD_SIGNER -notmatch '^[0-9a-fA-F]+') {
            throw 'Verified guard signer thumbprint missing'
          }
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -property installationPath).Trim()
          $dev = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $target = Join-Path (Get-Location) 'build/windows/x64/runner/Release/services'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $exe = Join-Path $target 'TwinConnectGlobalGuard.exe'
          $source = Join-Path (Get-Location) 'native/windows/twinconnect_global_guard_service_experimental.cpp'
          $command = 'call "' + $dev + '" -arch=amd64 && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"' + $exe + '" "' + $source + '" /link Fwpuclnt.lib Iphlpapi.lib Ws2_32.lib Rpcrt4.lib Advapi32.lib Ole32.lib Oleaut32.lib Taskschd.lib'
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $exe)) { throw 'Guard compile failed' }
          $pfx = Join-Path $env:RUNNER_TEMP 'guard-sign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:TWINCONNECT_SIGN_PFX_BASE64))
            $cert = Get-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString $env:TWINCONNECT_SIGN_PFX_PASSWORD -AsPlainText -Force)
            if ($cert.Thumbprint -ine $env:GUARD_SIGNER) { throw 'Guard certificate thumbprint mismatch' }
            $sign = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -File |
              Where-Object { $_.FullName.Contains('\x64\') } | Select-Object -Last 1
            if (!$sign) { throw 'SignTool not found' }
            & $sign.FullName sign /fd SHA256 /f $pfx /p $env:TWINCONNECT_SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw 'Guard signing failed' }
            $verified = Get-AuthenticodeSignature -LiteralPath $exe
            if ($verified.Status -ne 'Valid' -or $verified.SignerCertificate.Thumbprint -ine $env:GUARD_SIGNER) {
              throw 'Guard Authenticode verification failed'
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          & $exe offline-status
          if ($LASTEXITCODE -ne 0) { throw 'Guard WFP preflight failed' }
      - name: Build app-scoped WFP bypass guard for normal TwinConnect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -property installationPath).Trim()
          if (!$vs) { throw 'Visual Studio C++ compiler missing' }
          $dev = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $target = Join-Path (Get-Location) 'build/windows/x64/runner/Release/services'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $exe = Join-Path $target 'TwinConnectAppKillSwitch.exe'
          $source = Join-Path (Get-Location) 'native/windows/twinconnect_app_killswitch.cpp'
          $cmd = 'call "' + $dev + '" -arch=amd64 && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"' + $exe + '" "' + $source + '" /link Fwpuclnt.lib Iphlpapi.lib Rpcrt4.lib'
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $exe)) {
            throw 'Selected-app WFP Kill Switch compilation failed'
          }
          # Never arm persistent firewall filters on GitHub-hosted runners.
          $audit = & $exe audit
          if ($LASTEXITCODE -ne 0 -or $audit -notmatch '^OWNED_APP_RULES_PRESENT 0 0') {
            throw 'Read-only WFP policy audit did not pass'
          }
      - name: Verify bundled Windows Kill Switch test controller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path (Get-Location) 'tools/windows_guard_control.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $source, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Guard control PowerShell parse error' }
          $script = Get-Content $source -Raw
          foreach ($marker in @('SIGNED_GUARD_REQUIRED','Register-ScheduledTask',
              'New-ScheduledTaskTrigger','GUARD_ARMED_TWO_MINUTE_TEST',
              'offline-status','recover $ack')) {
            if (!$script.Contains($marker)) {
              throw "Guard control missing safety requirement: $marker"
            }
          }
          $installer = Get-Content 'installer.iss' -Raw
          if (!$installer.Contains('windows_guard_control.ps1')) {
            throw 'Main Setup does not bundle guard test controller'
          }
          $settings = Get-Content 'lib/vpn_settings.dart' -Raw
          if (!$settings.Contains('vpnSignedGuardTimedTest')) {
            throw 'Settings guard test control is missing'
          }
          $appLock = Join-Path (Get-Location) 'tools/windows_app_network_lock.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $appLock, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Selected-app Kill Switch PowerShell parse error' }
          $firewallCode = Get-Content $appLock -Raw
          foreach ($marker in @('TwinConnectAppKillSwitch.exe','APP_WFP_STATUS_UNVERIFIED',
              'Get-NetAdapter','TWINCONNECT_APP_UNLOCKED')) {
            if (!$firewallCode.Contains($marker)) { throw "Missing WFP app guard check: $marker" }
          }
          if ($firewallCode.Contains('New-NetFirewallRule')) {
            throw 'Unsafe generic application deny must not replace VPN bypass Kill Switch'
          }
          if (!$installer.Contains('windows_app_network_lock.ps1') -or
              !$settings.Contains('vpnSelectKillSwitchApp') -or
              !$settings.Contains('vpnSelectedAppKillSwitch')) {
            throw 'Selected-app Kill Switch is not bundled or accessible in TwinConnect settings'
          }
          $proxyEngine = Join-Path (Get-Location) 'tools/windows_system_proxy.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $proxyEngine, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw "System proxy engine PowerShell parse error: $($errors -join '; ')"
          }
          $proxyCode = Get-Content $proxyEngine -Raw
          foreach ($marker in @('LOCAL_SOCKS5_NOT_VERIFIED','Restore-Values',
              'WININET_SETTINGS_CHANGED_FAILED')) {
            if (!$proxyCode.Contains($marker)) {
              throw "Missing Windows proxy safety guard: $marker"
            }
          }
          if (!$installer.Contains('windows_system_proxy.ps1') -or
              !$settings.Contains('vpnSystemProxyToggle') -or
              !$settings.Contains('vpnRoutingIncludeApps') -or
              !$settings.Contains('vpnRoutingExcludeApps')) {
            throw 'Windows routing/proxy engines missing from setup or Settings'
          }
      - name: Package TwinConnect Windows setup with automatic WireGuard prerequisite
        shell: pwsh
        env:
          GUARD_RELEASE_APPROVED: ${{ vars.TWINCONNECT_GUARD_RELEASE_APPROVED }}
          GUARD_SIGNER: ${{ vars.TWINCONNECT_GUARD_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler not installed" }
          if ($env:SIGNING_CONFIGURED -eq 'true' -and
              $env:GUARD_RELEASE_APPROVED -eq 'true') {
            $signer = $env:GUARD_SIGNER
            $guard = 'build/windows/x64/runner/Release/services/TwinConnectGlobalGuard.exe'
            if (!$signer -or !(Test-Path $guard)) { throw 'Signed guard not present' }
            & $compiler '/DIncludeVerifiedGlobalGuard=1' ("/DGuardSigningThumbprint=" + $signer) 'installer.iss'
          } else {
            & $compiler "installer.iss"
          }
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path "TwinConnect-Windows-x64-Setup.exe")) {
            throw "TwinConnect setup executable missing"
          }
      - name: Sign installer when a publisher certificate is configured
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        shell: pwsh
        env:
          TWINCONNECT_SIGN_PFX_BASE64: ${{ secrets.TWINCONNECT_SIGN_PFX_BASE64 }}
          TWINCONNECT_SIGN_PFX_PASSWORD: ${{ secrets.TWINCONNECT_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'twinconnect-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:TWINCONNECT_SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -File |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw 'Windows SDK signtool.exe not available' }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:TWINCONNECT_SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 'TwinConnect-Windows-x64-Setup.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed' }
            & $signtool.FullName verify /pa /all 'TwinConnect-Windows-x64-Setup.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Installer Authenticode verification failed' }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Publish release integrity manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('TwinConnect-Windows-x64-Setup.exe', 'TwinConnect-Windows-Preview.zip')
          $files | ForEach-Object {
            if (!(Test-Path $_)) { throw "Missing artifact: $_" }
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -Path 'TwinConnect-Windows-SHA256SUMS.txt' -Encoding ascii
          $setup = Get-AuthenticodeSignature 'TwinConnect-Windows-x64-Setup.exe'
          Write-Host "Setup Authenticode status: $($setup.Status)"
          if ($env:SIGNING_CONFIGURED -eq 'true' -and $setup.Status -ne 'Valid') {
            throw 'Signed build did not retain a valid installer signature'
          }
      # A draft PR may offer a private, clearly named installation-test
      # artifact to its repository collaborators. This is NOT a public
      # release or a certified Kill Switch. IncludeVerifiedGlobalGuard=0,
      # so the experimental WFP service is never installed or armed.
      - uses: actions/upload-artifact@v4
        with:
          name: TwinConnect-Windows-TEST-SHA256SUMS
          path: clients/twinconnect/TwinConnect-Windows-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: TwinConnect-Windows-TEST-Only-KillSwitch-OFF
          path: clients/twinconnect/TwinConnect-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7
      # Unsigned artifacts are for internal testing only. Never distribute
      # unsigned Windows executables as public GitHub Release assets.
      # A publisher code-signing certificate is mandatory for prereleases.
      - name: Publish signed installer as GitHub prerelease assets
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/twinconnect-windows-app-20261110' && env.SIGNING_CONFIGURED == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail closed: do not publish unsigned or unverified executables.
          foreach ($file in @('TwinConnect-Windows-x64-Setup.exe', 'build/windows/x64/runner/Release/twinconnect.exe')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "Refusing release: invalid or missing Authenticode signature for $file ($($signature.Status))"
            }
          }
          $tag = 'twinconnect-windows-preview-' + $env:GITHUB_SHA.Substring(0, 12)
          $files = @(
            'TwinConnect-Windows-x64-Setup.exe',
            'TwinConnect-Windows-Preview.zip',
            'TwinConnect-Windows-SHA256SUMS.txt'
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing release file: $file" }
          }
          $notes = @'
          SIGNED DEVELOPMENT PRERELEASE — not approved for customers.
          Built from the TwinConnect integration branch. Contains the signed Windows
          installer, standalone portable ZIP, and SHA-256 integrity manifest.
          Signature verification is required but does not guarantee malware-free code.
          Do not disable antivirus protections to run it.
          The Windows Defender on-demand CI scan is separate from a professional
          security audit and does not certify malware-free binaries.
          '@
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TwinConnect Windows Preview ($($env:GITHUB_SHA.Substring(0, 12)))" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish TwinConnect preview release' }
          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0 -or !($assets -contains 'TwinConnect-Windows-x64-Setup.exe') -or !($assets -contains 'TwinConnect-Windows-SHA256SUMS.txt')) {
            throw 'GitHub prerelease asset verification failed'
          }
          Write-Host "TwinConnect release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
      - name: Build isolated Windows Dev dashboard (no sign-in)
        shell: pwsh
        run: flutter build windows --release --target lib/main_dev.dart
      - name: Package Windows Dev dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path (Get-Location) "build/windows/x64/runner/Release"
          if (!(Test-Path (Join-Path $release "twinconnect.exe"))) {
            throw "Dev executable missing"
          }
          @'
          TwinConnect DEV dashboard - Windows x64
          Extract every file, then start twinconnect.exe.
          Offline visual test: navigation, protocol filters, theme and language.
          No account, license, VPN secrets or real connection is included.
          This is a development-only build. Do not distribute to customers.
          '@ | Set-Content -Path (Join-Path $release "README-DEV.txt") -Encoding UTF8
          $zip = Join-Path (Get-Location) "TwinConnect-Windows-Dev.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $release "*") -DestinationPath $zip -CompressionLevel Optimal
      # Draft Kill Switch PRs may run compilation checks but must not
      # emit installable application artifacts until network safety is proven.
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
        with:
          name: TwinConnect-Windows-x64-Dev-Dashboard
          path: clients/twinconnect/TwinConnect-Windows-Dev.zip
          if-no-files-found: error
          retention-days: 14
      # Draft Kill Switch PRs may run compilation checks but must not
      # emit installable application artifacts until network safety is proven.
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
        with:
          name: TwinConnect-Windows-x64-Portable
          path: clients/twinconnect/TwinConnect-Windows-Preview.zip
          if-no-files-found: error
          retention-days: 30
