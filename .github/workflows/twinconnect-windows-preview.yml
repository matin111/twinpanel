name: TwinConnect Windows Portable Preview

on:
  pull_request:
    paths:
      - "clients/twinconnect/**"
      - ".github/workflows/twinconnect-windows-preview.yml"
  push:
    branches:
      - feat/twinconnect-windows-preview-v1
      - integration/twinconnect-windows-app-20261110
    paths:
      - "clients/twinconnect/**"
      - ".github/workflows/twinconnect-windows-preview.yml"

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/twinconnect
    env:
      # Temporary panel-hosted HTTPS mirror of the vendor directory for preview.
      # A dedicated owned HTTPS domain must replace this before production.
      # Using a repository variable takes precedence without modifying code.
      TWINCONNECT_DIRECTORY_URL: ${{ vars.TWINCONNECT_DIRECTORY_URL || 'https://panel.matindnspro.sbs' }}
    steps:
      - uses: actions/checkout@v4
      # Avoid a stalled Flutter SDK cache restore on GitHub Windows runners.
      # This build needs a fresh SDK setup; pub dependencies are fetched below.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Generate native Windows Flutter project
        run: flutter create --platforms=windows --org com.twinpanel --project-name twinconnect .
      - name: Install fail-closed Windows VPN native bridge
        run: python tools/install_windows_native.py
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Verify Dart compilation and tests
        run: |
          flutter analyze
          flutter test --reporter expanded
      - name: Verify HTTPS directory is configured and reachable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $origin = [uri]$env:TWINCONNECT_DIRECTORY_URL
          if ($origin.Scheme -ne "https" -or !$origin.Host -or $origin.UserInfo -or
              $origin.Query -or $origin.Fragment -or $origin.AbsolutePath -ne "/") {
            throw "TWINCONNECT_DIRECTORY_URL must be a clean HTTPS origin"
          }
          $probe = "$($origin.AbsoluteUri.TrimEnd('/'))/v1/app/resolve/TP934FE9"
          $result = Invoke-RestMethod -Uri $probe -Method Get -TimeoutSec 15
          if ($result.namespace -ne "TP934FE9" -or
              $result.api_origin -ne "https://panel.matindnspro.sbs") {
            throw "Tenant directory contract invalid or panel registration missing"
          }
          Write-Host "Verified HTTPS directory and registered panel namespace"
      - name: Build Windows x64 standalone directory
        shell: pwsh
        run: flutter build windows --release "--dart-define=TWINCONNECT_DIRECTORY_URL=$env:TWINCONNECT_DIRECTORY_URL"
      - name: Bundle pinned and verified sing-box engine (not yet enabled)
        shell: pwsh
        run: ./tools/bundle_singbox_windows.ps1
      - name: Verify bundled sing-box accepts synthetic Windows TUN config
        shell: pwsh
        run: ./tools/check_singbox_windows.ps1
      - name: Exercise sing-box runtime with loopback-only synthetic proxy
        shell: pwsh
        run: ./tools/smoke_singbox_loopback_windows.ps1
      - name: Verify actual TUN adapter creation without changing system routes
        shell: pwsh
        run: ./tools/smoke_singbox_tun_windows.ps1
      - name: Package portable ZIP and usage instructions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path (Get-Location) "build/windows/x64/runner/Release"
          $exe = Join-Path $release "twinconnect.exe"
          if (!(Test-Path $exe)) {
            throw "Windows release executable missing: $exe"
          }
          @'
          TwinConnect - Windows portable PREVIEW (x64)
          
          1. Extract the complete ZIP to a folder (do not run from inside ZIP).
          2. Run twinconnect.exe from that folder. Keep DLL/data files beside it.
          3. For UI-only demo: use the Dev Dashboard artifact instead.
          4. For experimental REAL WireGuard:
             - Install official WireGuard for Windows from wireguard.com/install.
             - Run THIS Portable EXE as Administrator (Windows tunnel service).
             - Sign in with a valid TwinConnect APP username/password.
             - The vendor directory URL and licensed panel backend must be
               deployed and reachable over HTTPS at build time.
             - Pick an ONLINE authorized WireGuard server and Start.
             - Read the actual service/handshake status; never assume that
               an interface-up state means internet connectivity.
             - Stop the tunnel before closing the app, and check for leaks.
          5. Only one TwinConnect WireGuard tunnel is supported per PC.
          6. This is an unsigned TEST build. Only run builds you trust.

          IMPORTANT:
          - No WireGuard software or drivers are bundled with TwinConnect.
          - The sing-box 1.14.4 executable is bundled and SHA256-verified,
            but its native TUN lifecycle is not connected in this build.
          - Only WireGuard has a verified Windows connection adapter.
          - Do not interpret bundled executable as enabled protocol support.
          - Only one-peer WireGuard profiles with DNS and complete IPv4
            default coverage are accepted. The native adapter derives
            protected /0 routes in memory from panel split-/1 routes; it
            does not modify server endpoints, keys or panel records.
          - The native adapter writes a DPAPI-encrypted file with restrictive
            admin/SYSTEM ACLs; no plain private-key config is saved to disk.
          - The directory URL is built in for this development preview.
          - Until the project gets an owned HTTPS vendor domain, the
            test directory uses an existing HTTPS panel reverse proxy.
            Do not use it as a permanent customer deployment address.
          - The Dev Dashboard artifact remains entirely offline.
          - Do not deploy these experimental binaries to customers yet.
          '@ | Set-Content -Path (Join-Path $release "README-TEST.txt") -Encoding UTF8
          $zip = Join-Path (Get-Location) "TwinConnect-Windows-Preview.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $release "*") -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "ZIP packaging failed" }
          Write-Host ("Windows ZIP bytes: " + (Get-Item $zip).Length)
      - name: Install Inno Setup installer compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package TwinConnect Windows setup with automatic WireGuard prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler not installed" }
          & $compiler "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path "TwinConnect-Windows-x64-Setup.exe")) {
            throw "TwinConnect setup executable missing"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TwinConnect-Windows-x64-Setup
          path: clients/twinconnect/TwinConnect-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Build isolated Windows Dev dashboard (no sign-in)
        shell: pwsh
        run: flutter build windows --release --target lib/main_dev.dart
      - name: Package Windows Dev dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path (Get-Location) "build/windows/x64/runner/Release"
          if (!(Test-Path (Join-Path $release "twinconnect.exe"))) {
            throw "Dev executable missing"
          }
          @'
          TwinConnect DEV dashboard - Windows x64
          Extract every file, then start twinconnect.exe.
          Offline visual test: navigation, protocol filters, theme and language.
          No account, license, VPN secrets or real connection is included.
          This is a development-only build. Do not distribute to customers.
          '@ | Set-Content -Path (Join-Path $release "README-DEV.txt") -Encoding UTF8
          $zip = Join-Path (Get-Location) "TwinConnect-Windows-Dev.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $release "*") -DestinationPath $zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: TwinConnect-Windows-x64-Dev-Dashboard
          path: clients/twinconnect/TwinConnect-Windows-Dev.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: TwinConnect-Windows-x64-Portable
          path: clients/twinconnect/TwinConnect-Windows-Preview.zip
          if-no-files-found: error
          retention-days: 30
