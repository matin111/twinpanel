name: TwinPanel Preview Validation

on:
  push:
    branches:
      - main
      - fix/customer-panel-entry-crash-v2
  pull_request:
    branches:
      - main
      - fix/customer-panel-entry-crash-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional
          else
            npm install --include=optional --no-audit --no-fund
          fi

      - name: Build frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/twinpanel-build.log

      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-next-build-log
          path: /tmp/twinpanel-build.log
          if-no-files-found: error

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile backend Python
        run: python -m compileall -q backend/app
