name: TwinPanel Preview Validation

on:
  push:
    branches:
      - main
      - fix/customer-panel-entry-crash-v2
  pull_request:
    branches:
      - main
      - fix/customer-panel-entry-crash-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional
          else
            npm install --include=optional --no-audit --no-fund
          fi

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile backend Python
        run: python -m compileall -q backend/app

      - name: Install discount test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Test discount plan scope and redemption
        working-directory: backend
        env:
          APP_SECRET_KEY: ci-discount-plan-scope-nonproduction-key
          DATABASE_URL: sqlite:///./discount-plan-scope-ci.sqlite3
          NODE_AGENT_SHARED_SECRET: ci-discount-plan-scope-node-key
        run: python -m unittest discover -s tests -p 'test_admin_discount_plan_scope_v1.py' -v

      - name: Verify discount network failure feedback
        run: python backend/tests/test_admin_discount_network_feedback_v1.py -v

      - name: Validate fast Telegram link delivery and sales tooltip themes
        run: python3 backend/tests/test_telegram_link_delivery_fast_path_v1.py -v

      - name: Validate fast terminal menu and Web slot handling
        run: |
          bash -n scripts/twinpanel-menu.sh
          python3 -m unittest discover -s tests -p 'test_twinpanel_menu_release_check.py'
