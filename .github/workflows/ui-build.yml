name: TwinPanel UI Build

on:
  push:
    branches:
      - main
      - rebuild/legacy-exact-v1
  pull_request:
    branches:
      - main
      - rebuild/legacy-exact-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build
