name: Keep Latest Manual TwinConnect Releases

on:
  push:
    branches: [main]
    paths:
      - 'releases/twinconnect-cleanup-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twinconnect-release-cleanup
  cancel-in-progress: false

jobs:
  prune-twinconnect-releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicit cleanup request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('releases/twinconnect-cleanup-request.json').read_text())
          assert request == {
              "keep": [
                  "twinconnect-android-v1.0.0",
                  "twinconnect-windows-v0.1.0-beta.1"
              ],
              "remove": "all-other-twinconnect-releases-only",
              "preserve_git_tags": True,
              "confirmed": True
          }, request
          print("EXPLICIT_TWINCONNECT_CLEANUP_REQUEST_OK")
          PY
      - name: Verify latest manual releases and remove obsolete TwinConnect releases
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_TWINCONNECT_CLEANUP: keep-two-manual
        run: python3 scripts/prune_old_twinconnect_releases.py
      - name: Preserve removed release inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: removed-twinconnect-release-inventory
          path: removed-twinconnect-release-inventory.json
          if-no-files-found: ignore
