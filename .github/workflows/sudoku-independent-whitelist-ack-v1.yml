name: Sudoku Independent Whitelist ACK V1

on:
  pull_request:
    paths:
      - backend/app/services/central_sudoku_fingerprint_v1.py
      - backend/scripts/twinpanel_central_node_stage_v1.py
      - backend/scripts/twinpanel_central_sudoku_shared_v2.py
      - backend/tests/central_sudoku_independent_fingerprint_v1_smoke.py
      - backend/tests/sudoku_central_whitelist_revocation_v1_smoke.py
      - .github/workflows/sudoku-independent-whitelist-ack-v1.yml
  workflow_dispatch:

jobs:
  sudo-family-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Independent family ACK and previous revocation tests
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_NAME: TwinPanel-CI
          APP_ENV: test
          APP_SECRET_KEY: ci-sudoku-independent-ack-not-for-prod
          DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/test
          NODE_AGENT_SHARED_SECRET: ci-sudoku-independent-node-agent
        run: |
          python -m py_compile app/services/central_sudoku_fingerprint_v1.py scripts/twinpanel_central_node_stage_v1.py scripts/twinpanel_central_sudoku_shared_v2.py
          python tests/central_sudoku_independent_fingerprint_v1_smoke.py
          python tests/sudoku_central_whitelist_revocation_v1_smoke.py
