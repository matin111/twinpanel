name: Public Connect V44 V2Ray Multi Action Smoke

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_v2ray_multilink_action_v44.py'
      - 'backend/app/routers/public_connection_mobile_sheet_v42.py'
      - 'backend/app/routers/public_connection_reference_layout_v38.py'
      - 'backend/tests/smoke_public_connection_v2ray_multilink_action_v44.py'
      - 'backend/tests/smoke_public_connection_mobile_sheet_v42.py'
      - '.github/workflows/public-connect-v44-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/routers/public_connection_v2ray_multilink_action_v44.py'
      - 'backend/app/routers/public_connection_mobile_sheet_v42.py'
      - 'backend/app/routers/public_connection_reference_layout_v38.py'
      - 'backend/tests/smoke_public_connection_v2ray_multilink_action_v44.py'
      - 'backend/tests/smoke_public_connection_mobile_sheet_v42.py'
      - '.github/workflows/public-connect-v44-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run V42 bottom-sheet regression
        run: python3 backend/tests/smoke_public_connection_mobile_sheet_v42.py
      - name: Run V44 V2Ray Multi Server wiring smoke
        run: python3 backend/tests/smoke_public_connection_v2ray_multilink_action_v44.py
      - name: Parse V44 inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('backend/app/routers/public_connection_v2ray_multilink_action_v44.py').read_text()
          match = re.search(r'_SCRIPT\s*=\s*r"""(.*?)"""', source, re.S)
          assert match, 'V44 script block missing'
          script = match.group(1).strip()
          script = re.sub(r'^<script[^>]*>\s*', '', script)
          script = re.sub(r'\s*</script>$', '', script)
          Path('/tmp/twinpanel-public-connect-v44.js').write_text(script)
          PY
          node --check /tmp/twinpanel-public-connect-v44.js
