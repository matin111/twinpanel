name: TwinPanel Backend Static Check

on:
  push:
    branches:
      - main
      - 'feat/backend-runtime-import-*'
    paths:
      - 'backend/**'
      - 'installer/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/backend-static.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'installer/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/backend-static.yml'

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reject forbidden backend files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d backend ]; then exit 0; fi
          bad="$(find backend -type f \( \
            -name '.env' -o -name '*.key' -o -name '*.pem' -o -name '*.crt' -o -name '*.cer' -o \
            -name '*.p12' -o -name '*.pfx' -o -name '*.sql' -o -name '*.dump' -o \
            -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.bak*' -o -name '*.bad*' -o \
            -name '*candidate*' -o -name '*zeroed*' -o -name '*before-*' \
          \) -print)"
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

      - name: Scan obvious private material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude='.env.example' \
            'BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}' \
            backend installer deploy scripts 2>/dev/null; then
            echo 'Potential private material detected.'
            exit 1
          fi

      - name: Compile Python bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/create_admin.py
          if [ -d backend/app ]; then python -m compileall -q backend/app; fi

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.sh installer/*.sh installer/twinpanelctl; do
            [ -f "$file" ] || continue
            bash -n "$file"
          done

      - name: Validate clean deployment templates
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/systemd/twinpanel-api.service.tpl
          test -s deploy/systemd/twinpanel-web.service.tpl
          test -s deploy/systemd/twinpanel-transport-manager.service.tpl
          test -s deploy/nginx/twinpanel.conf.tpl
          test ! -e deploy/systemd/vpnshop-relay-manager.service.tpl

          if grep -RInE '/root/vpnshop|/opt/twinpanel-web/current|Requires=vpnshop-api\.service|After=.*vpnshop-api\.service' deploy installer; then
            echo 'Legacy deployment path/service reference detected.'
            exit 1
          fi

          grep -q '__API_PORT__' deploy/systemd/twinpanel-api.service.tpl
          grep -q '__WEB_PORT__' deploy/systemd/twinpanel-web.service.tpl
          grep -q '__API_PORT__' deploy/systemd/twinpanel-bot.service.tpl
          grep -q '__DOMAIN__' deploy/nginx/twinpanel.conf.tpl
          grep -q '__WEB_PORT__' deploy/nginx/twinpanel.conf.tpl
          grep -q '__API_PORT__' deploy/nginx/twinpanel.conf.tpl
          grep -q 'vpnshop-relay-manager.service' installer/install-workers.sh
          grep -q 'disable --now vpnshop-relay-manager.service' installer/install-workers.sh

      - name: Validate dependency file
        shell: bash
        run: |
          set -euo pipefail
          test -s backend/requirements.txt
          python -m pip install --disable-pip-version-check --dry-run -r backend/requirements.txt >/dev/null

      - name: Report runtime migration gate
        shell: bash
        run: |
          if [ -f backend/app/main.py ]; then
            echo 'BACKEND_RUNTIME_PRESENT=1'
          else
            echo 'BACKEND_RUNTIME_PRESENT=0'
            echo 'Static scaffolding is valid; runtime import/health gates remain intentionally pending.'
          fi
