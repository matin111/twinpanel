name: VPN Access Dataplane V53 Smoke

on:
  pull_request:
    paths:
      - "backend/app/vpn_access_dataplane_v46.py"
      - "backend/app/vpn_access_dataplane_v53.py"
      - "backend/app/tunnel_transport_manager_v12.py"
      - ".github/workflows/vpn-access-dataplane-v53-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/vpn_access_dataplane_v46.py"
      - "backend/app/vpn_access_dataplane_v53.py"
      - "backend/app/tunnel_transport_manager_v12.py"
      - ".github/workflows/vpn-access-dataplane-v53-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile runtime
        run: |
          python -m py_compile \
            backend/app/vpn_access_dataplane_v46.py \
            backend/app/vpn_access_dataplane_v53.py \
            backend/app/tunnel_transport_manager_v12.py

      - name: Verify status-independent egress contract
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path("backend/app/vpn_access_dataplane_v53.py").read_text()
          manager = Path("backend/app/tunnel_transport_manager_v12.py").read_text()

          required_policy = [
              "_ALWAYS_ON_ACCESS_PROTOCOLS",
              "frozenset(v46._PROTOCOL_SUBNETS.keys())",
              "v46._enabled_access_protocols = _all_access_protocols",
              "OpenVPN PKI",
              "status-independent",
          ]
          for token in required_policy:
              assert token in policy, token

          required_manager = [
              "install_vpn_access_dataplane_v53",
              "install_vpn_access_dataplane_v53()",
              "vpn_access_egress_policy=v53",
              "vpn_access_dataplane_v46",
              "vpn_access_dataplane_loop()",
          ]
          for token in required_manager:
              assert token in manager, token

          # The V53 installer must execute before the V46 task starts.
          assert manager.index("install_vpn_access_dataplane_v53()") < manager.index("vpn_access_dataplane_loop()")

          print("VPN_ACCESS_DATAPLANE_V53_SMOKE_OK")
          PY
