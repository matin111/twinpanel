name: TwinPanel Store Tutorial Assets V121 Import

on:
  push:
    branches:
      - feat/store-tutorial-images-v121
    paths:
      - .tutorial-import-v121/READY

permissions:
  contents: write

concurrency:
  group: store-tutorial-assets-v121-import
  cancel-in-progress: true

jobs:
  import-backup-screenshots:
    runs-on: ubuntu-latest
    if: github.repository == 'matin111/twinpanel'
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: feat/store-tutorial-images-v121
          fetch-depth: 0

      - name: Reconstruct optimized screenshots extracted from the supplied legacy backup
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .tutorial-import-v121/READY
          parts=(.tutorial-import-v121/part-*.b64)
          [[ "${#parts[@]}" -eq 32 ]] || { echo "Expected 32 archive chunks, got ${#parts[@]}" >&2; exit 41; }
          cat "${parts[@]}" | base64 -d > /tmp/tutorial-screenshots.tar.gz
          actual="$(sha256sum /tmp/tutorial-screenshots.tar.gz | awk '{print $1}')"
          expected="c64b6802ca795d2813e208109ff13453500a7450e6735c5922154ce065a631f8"
          [[ "$actual" == "$expected" ]] || { echo "Tutorial archive checksum mismatch" >&2; exit 42; }
          rm -rf public/learning/screenshots
          mkdir -p public/learning
          tar -xzf /tmp/tutorial-screenshots.tar.gz -C public/learning
          count="$(find public/learning/screenshots -type f -name '*.webp' | wc -l | tr -d ' ')"
          [[ "$count" == "65" ]] || { echo "Expected 65 screenshots, got $count" >&2; exit 43; }
          python3 - <<'PY'
          from pathlib import Path
          path=Path('lib/store-guide-content.ts')
          text=path.read_text(encoding='utf-8')
          old='const LEGACY_STEP_IMAGE_BASE="https://movilineapp.com/learning/screenshots";'
          new='const LEGACY_STEP_IMAGE_BASE="/learning/screenshots";'
          if old not in text and new not in text:
              raise SystemExit('store tutorial screenshot base not found')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          echo "LOCAL_TUTORIAL_SCREENSHOTS=$count"

      - name: Commit local storefront tutorial assets
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/learning/screenshots lib/store-guide-content.ts
          git rm -r .tutorial-import-v121
          git rm .github/workflows/store-tutorial-assets-v121-import.yml
          git rm assets/legacy-learning-screenshots.sha256
          git commit -m "Bundle legacy storefront tutorial screenshots locally"
          git push origin HEAD:feat/store-tutorial-images-v121
