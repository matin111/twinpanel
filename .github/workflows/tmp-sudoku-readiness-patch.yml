name: Temporary Sudoku readiness patch

on:
  push:
    branches:
      - fix/sudoku-readiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sudoku-readiness
          fetch-depth: 0

      - name: Apply readiness hardening and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          driver_path = Path('backend/app/standalone_subscription_accounts.py')
          driver = driver_path.read_text(encoding='utf-8')

          old = '''        f"systemctl enable {service}.service >/dev/null; systemctl restart {service}.service; "
                  f"systemctl is-active --quiet {service}.service",
          '''

          new = '''        f"systemctl enable {service}.service >/dev/null; systemctl restart {service}.service; "
                  f"systemctl is-active --quiet {service}.service; "
                  "ready=0; "
                  "for i in $(seq 1 100); do "
                  f"  if ss -H -lnt | awk '$4 ~ /:{port}$/ {{found=1}} END {{exit found?0:1}}'; then ready=1; break; fi; "
                  f"  if ! systemctl is-active --quiet {service}.service; then "
                  f"    systemctl status {service}.service --no-pager >&2 || true; "
                  f"    journalctl -u {service}.service -n 30 --no-pager >&2 || true; "
                  "    exit 1; "
                  "  fi; "
                  "  sleep 0.2; "
                  "done; "
                  "if [ ${ready:-0} -ne 1 ]; then "
                  f"  echo 'Sudoku listener readiness timeout on :{port}' >&2; "
                  f"  systemctl status {service}.service --no-pager >&2 || true; "
                  f"  journalctl -u {service}.service -n 30 --no-pager >&2 || true; "
                  "  exit 1; "
                  "fi",
          '''

          if driver.count(old) != 1:
              raise SystemExit(f'driver readiness anchor count={driver.count(old)}')
          driver = driver.replace(old, new, 1)
          driver_path.write_text(driver, encoding='utf-8')

          test_path = Path('backend/tests/public_connection_modern_delivery_v13_smoke.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '''assert '\"uri\": sudoku_uri' in standalone
          '''
          regression = '''assert '\"uri\": sudoku_uri' in standalone
          # Sudoku provisioning is not ready merely because systemd reports the
          # process active. The account driver must wait for the per-user TCP
          # listener to bind, otherwise an immediate client can race startup.
          for marker in (
              'ready=0; ',
              'for i in $(seq 1 100); do ',
              'ss -H -lnt',
              'sleep 0.2; ',
              'if [ ${ready:-0} -ne 1 ]; then ',
              "Sudoku listener readiness timeout on :{port}",
              'journalctl -u {service}.service -n 30 --no-pager',
          ):
              assert marker in standalone, marker
          '''
          if test.count(anchor) != 1:
              raise SystemExit(f'test readiness anchor count={test.count(anchor)}')
          test = test.replace(anchor, regression, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          python3 -m py_compile backend/app/standalone_subscription_accounts.py
          python3 backend/tests/public_connection_modern_delivery_v13_smoke.py

          git rm .github/workflows/tmp-sudoku-readiness-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/standalone_subscription_accounts.py backend/tests/public_connection_modern_delivery_v13_smoke.py
          git diff --cached --check
          git commit -m 'fix(sudoku): wait for listener readiness before delivery'
          git push origin HEAD:fix/sudoku-readiness
