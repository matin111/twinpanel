name: Active Transport Authority V258 Smoke

on:
  pull_request:
    paths:
      - "backend/app/unified_l3_candidate_registry_v79.py"
      - "backend/app/unified_l3_core_v49.py"
      - "backend/app/self_hosted_runtime.py"
      - "backend/tests/active_transport_authority_v258_smoke.py"
      - ".github/workflows/active-transport-authority-v258-smoke.yml"
  workflow_dispatch:

jobs:
  active-transport-authority-v258:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            backend/app/unified_l3_candidate_registry_v79.py \
            backend/app/unified_l3_core_v49.py \
            backend/app/self_hosted_runtime.py \
            backend/tests/active_transport_authority_v258_smoke.py

      - name: Validate active transport Service Plane authority
        run: python backend/tests/active_transport_authority_v258_smoke.py
