name: Tunnel transient route hold V1 smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/tunnels.py"
      - "tests/test_tunnel_transient_route_hold_v1.py"
      - ".github/workflows/tunnel-transient-route-hold-v1-smoke.yml"
  workflow_dispatch:

jobs:
  route-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate controller Python syntax
        run: python -m py_compile backend/app/routers/tunnels.py
      - name: Assert graceful transient failover and strict deactivation
        run: python -m unittest discover -s tests -p test_tunnel_transient_route_hold_v1.py -v
