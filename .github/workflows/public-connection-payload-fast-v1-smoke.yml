name: Public Connection Payload Fast V1 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/routers/account_delivery.py'
      - 'backend/app/routers/public_connection_hub_v5.py'
      - 'backend/app/routers/public_connection_hub_live_v5.py'
      - 'backend/app/routers/public_connection_payload_fast_v1.py'
      - 'backend/tests/public_connection_payload_fast_v1_smoke.py'
      - '.github/workflows/public-connection-payload-fast-v1-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Public Connect lazy QR regression smoke
        run: python backend/tests/public_connection_payload_fast_v1_smoke.py
