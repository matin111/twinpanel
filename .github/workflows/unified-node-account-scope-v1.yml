name: Unified New Node Account Scope V1

on:
  pull_request:
    paths:
      - "backend/scripts/twinpanel_migration_singbox_batch.py"
      - "backend/scripts/twinpanel_migration_classic_sequential_v3.py"
      - "backend/scripts/twinpanel_existing_node_backfill_v1.py"
      - "backend/scripts/twinpanel_node_auto_backfill_v1.py"
      - "backend/scripts/twinpanel_standalone_node_backfill_v1.py"
      - "backend/app/node_backfill_scope_models_v1.py"
      - "backend/app/services/node_auto_backfill_v1.py"
      - "backend/app/routers/publish_node_all_users_v2.py"
      - "backend/tests/test_central_unified_sixteen_v1.py"
      - "backend/tests/test_unified_node_account_scope_v1.py"
      - "backend/tests/test_existing_node_backfill_v1.py"
      - "backend/tests/test_node_auto_backfill_v1.py"
      - ".github/workflows/unified-node-account-scope-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      APP_SECRET_KEY: unified-node-ci-not-live
      DATABASE_URL: sqlite:///./unified-node-ci.sqlite3
      NODE_AGENT_SHARED_SECRET: unified-node-agent-ci-not-live
      TWINPANEL_UNIFIED_NODE_BACKFILL_V1: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend tests
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Compile non-destructive selection and queue code
        run: |
          python -m py_compile \
            backend/scripts/twinpanel_migration_singbox_batch.py \
            backend/scripts/twinpanel_migration_classic_sequential_v3.py \
            backend/scripts/twinpanel_existing_node_backfill_v1.py \
            backend/scripts/twinpanel_node_auto_backfill_v1.py \
            backend/scripts/twinpanel_standalone_node_backfill_v1.py \
            backend/app/node_backfill_scope_models_v1.py
      - name: Verify imported + new subscriptions use one scope and old workflow stays safe
        run: |
          python -m pytest -q \
            backend/tests/test_unified_node_account_scope_v1.py \
            backend/tests/test_existing_node_backfill_v1.py \
            backend/tests/test_node_auto_backfill_v1.py \
            backend/tests/test_central_unified_sixteen_v1.py
