name: Transport Manager Release Reload V48 Smoke

on:
  pull_request:
    paths:
      - "backend/app/transport_manager_service_v12.py"
      - "backend/app/tunnel_transport_manager_v12.py"
      - ".github/workflows/transport-manager-release-reload-v48-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/transport_manager_service_v12.py"
      - "backend/app/tunnel_transport_manager_v12.py"
      - ".github/workflows/transport-manager-release-reload-v48-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile manager activation code
        run: |
          python -m py_compile \
            backend/app/transport_manager_service_v12.py \
            backend/app/tunnel_transport_manager_v12.py

      - name: Verify release reload contract
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("backend/app/transport_manager_service_v12.py").read_text()
          manager = Path("backend/app/tunnel_transport_manager_v12.py").read_text()

          required_service = [
              "TWINPANEL_TRANSPORT_MANAGER_RELEASE_RELOAD_V48",
              '"is-active", "--quiet", UNIT_NAME',
              '"restart",',
              '"--no-block",',
              'result["restarted"] = True',
              'result["reason"] = "release_reloaded"',
          ]
          for token in required_service:
              assert token in service, token

          assert 'action = "restart"' in service
          assert 'action = "start"' in service
          assert 'result["started"] = True' in service

          # Dataplane V46 and the current access-performance worker must remain
          # inside the manager process so an API-start release reload activates
          # their newly shipped code. V51 supersedes V47 without weakening the
          # release-reload contract.
          assert "vpn_access_dataplane_v46" in manager
          assert "vpn_access_dataplane_loop()" in manager
          assert "vpn_access_performance_loop()" in manager
          assert (
              "vpn_access_performance_v51" in manager
              or "vpn_access_performance_v47" in manager
          )

          print("TRANSPORT_MANAGER_RELEASE_RELOAD_V48_SMOKE_OK")
          PY
