name: Telegram Root Navigation No Fake Back

on:
  pull_request:
    paths:
      - "backend/app/bot_text_middleware.py"
      - "backend/app/telegram_wallet_bot.py"
      - "backend/tests/test_telegram_root_navigation_no_back_v1.py"
      - "backend/tests/test_telegram_back_root_v2.py"
      - ".github/workflows/telegram-root-navigation-no-back.yml"
  push:
    branches: [main]
    paths:
      - "backend/tests/test_telegram_root_navigation_no_back_v1.py"
      - ".github/workflows/telegram-root-navigation-no-back.yml"

jobs:
  navigation-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile navigation modules
        run: python -m py_compile backend/app/bot_text_middleware.py backend/app/telegram_wallet_bot.py
      - name: Verify parent-aware navigation and wallet refresh
        run: python -m pytest -q backend/tests/test_telegram_root_navigation_no_back_v1.py backend/tests/test_telegram_back_root_v2.py
