name: Public Connect Device Actions V11 Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/public_connection_device_actions_v11.py"
      - "backend/app/routers/public_connection_hub_live_v5.py"
      - ".github/workflows/public-connect-device-actions-v11-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/routers/public_connection_device_actions_v11.py"
      - "backend/app/routers/public_connection_hub_live_v5.py"
      - ".github/workflows/public-connect-device-actions-v11-smoke.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile device intelligence refiner
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_device_actions_v11.py \
            backend/app/routers/public_connection_hub_live_v5.py

      - name: Parse V11 inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("backend/app/routers/public_connection_device_actions_v11.py").read_text()
          match = re.search(r'_V11_SCRIPT\s*=\s*r"""(.*?)"""', source, re.S)
          assert match, "V11 script block not found"
          script = match.group(1).strip()
          script = re.sub(r'^<script[^>]*>\s*', '', script)
          script = re.sub(r'\s*</script>$', '', script)
          Path('/tmp/twinpanel-public-connect-v11.js').write_text(script)
          PY
          node --check /tmp/twinpanel-public-connect-v11.js

      - name: Verify unified platform intelligence contract
        run: |
          python - <<'PY'
          from pathlib import Path

          v11 = Path("backend/app/routers/public_connection_device_actions_v11.py").read_text()
          live = Path("backend/app/routers/public_connection_hub_live_v5.py").read_text()

          assert "TWINPANEL_PUBLIC_CONNECT_DEVICE_ACTIONS_V11" in v11
          assert 'body[data-public-connect-mobile="v7"] .mobile-send-btn' in v11
          assert '.v9-icon-btn.mobile' in v11
          assert 'display:none' in v11
          assert '.tp-phone-actions .mobile-send-btn' in v11
          assert 'display:inline-flex' in v11
          assert '.tp-phone-actions .v9-icon-btn.mobile' in v11

          for platform in ('windows', 'macos', 'android', 'ios', 'linux', 'unknown'):
              assert platform in v11

          assert 'navigator.userAgentData' in v11
          assert 'Android|iPhone|iPad|iPod' in v11
          assert 'windows|win32|win64|winarm' in v11
          assert 'Macintosh' in v11 and 'maxTouchPoints' in v11
          assert 'linux|x11|cros' in v11
          assert 'body.dataset.tpPlatform=platform' in v11
          assert "platform==='android'||platform==='ios'" in v11

          assert "sourceAppLinks" in v11
          assert '.platform-group[data-platform=' in v11
          assert "list.replaceChildren()" in v11
          assert "برنامه‌های مناسب" in v11
          assert "همه سیستم‌ها" in v11
          assert "tp-show-all-platforms" in v11
          assert "!important" not in v11

          assert "refine_public_connection_device_actions_v11" in live
          assert live.index("refine_public_connection_manual_fields_v10(source)") < live.index("refine_public_connection_device_actions_v11(source)")
          PY
