name: Fast Admin Dashboard Ledger Scan Guard
on:
  pull_request:
    paths:
      - backend/app/routers/admin.py
      - backend/app/routers/admin_user_isolation.py
      - backend/app/routers/runtime_endpoints.py
      - backend/tests/test_admin_dashboard_fast_path_v1.py
      - .github/workflows/admin-dashboard-fast-path.yml
permissions:
  contents: read
jobs:
  fast-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - name: Compile modified dashboard modules
        run: python -m py_compile backend/app/routers/admin.py backend/app/routers/admin_user_isolation.py backend/app/routers/runtime_endpoints.py
      - name: Run dashboard fast-path contract
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_SECRET_KEY: ci-only-not-a-real-secret
          DATABASE_URL: postgresql+psycopg2://unused:unused@127.0.0.1:65432/unused
          NODE_AGENT_SHARED_SECRET: ci-only-not-a-real-secret
        run: python tests/test_admin_dashboard_fast_path_v1.py -v
