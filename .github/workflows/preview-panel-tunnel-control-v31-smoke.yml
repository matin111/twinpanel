name: Preview Panel Tunnel Control V31 Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Verify preview-safe V31 integration
        run: |
          grep -q 'TunnelsPanelRuntimeV31' components/tunnels-simple-runtime.tsx
          grep -q 'TunnelsServiceConnectionsRuntime' components/tunnels-simple-runtime.tsx
          grep -q 'managedDiagnose' components/tunnels-panel-runtime-v31.tsx
          grep -q 'managedRepair' components/tunnels-panel-runtime-v31.tsx
          grep -q 'setMode' components/tunnels-panel-runtime-v31.tsx
          grep -q 'TunnelServiceConnectionsPanel' components/tunnels-service-connections-runtime.tsx
      - name: Build UI
        run: npm run build
