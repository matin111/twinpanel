name: Preview Panel Tunnel Control V31 Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Verify unified tunnel and node controls
        run: |
          grep -q 'TunnelControlCenterV1' components/tunnels-simple-runtime.tsx
          grep -q 'TunnelControlCenterV1' components/smart-transports-runtime-v25.tsx
          grep -q 'TWINPANEL_TUNNEL_CONTROL_CENTER_V1' components/tunnel-control-center-v1.tsx
          grep -q 'legacyControlApi.createManagedTunnel' components/tunnel-control-center-v1.tsx
          grep -q 'managedDeepRepair' components/tunnel-control-center-v1.tsx
          grep -q 'setMode(selectedId,"auto")' components/tunnel-control-center-v1.tsx
          grep -q 'setMode(selectedId,"manual",name)' components/tunnel-control-center-v1.tsx
          grep -q 'manual_selectable' components/tunnel-control-center-v1.tsx
          ! grep -q 'selectedId===6' components/tunnel-control-center-v1.tsx
          ! grep -q 'tunnel.id===6' components/tunnel-control-center-v1.tsx
          ! grep -q 'repairProtocolsSaved' components/legacy-nodes-exact.tsx
          ! grep -q 'upgradeAgent' components/legacy-nodes-exact.tsx
          ! grep -q 'installTunnelFabric' components/legacy-nodes-exact.tsx
          grep -q 'protocolHealth' components/legacy-nodes-exact.tsx
          grep -q 'restartProtocol' components/legacy-nodes-exact.tsx
      - name: Build UI
        run: npm run build
