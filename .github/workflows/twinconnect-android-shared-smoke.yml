name: TwinConnect Shared TUN Android Compile Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/twinconnect-android-openvpn-core-20261115
    paths:
      - "clients/twinconnect/native/android/kotlin/**"
      - "clients/twinconnect/lib/android_*.dart"
      - "clients/twinconnect/tools/patch_shared_tun_android_plugins.py"
      - "clients/twinconnect/tools/stage_shared_openvpn_android.py"
      - "clients/twinconnect/tools/install_android_native.py"
      - ".github/workflows/twinconnect-android-shared-smoke.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/twinconnect
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create Android scaffold
        run: flutter create --platforms=android --org com.twinpanel --project-name twinconnect .
      - name: Install sole VPN owner native sources
        run: |
          python -m pip install --user Pillow==11.3.0
          python tools/install_android_native.py
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Patch Xray and sing-box native TUN ownership
        run: python tools/patch_shared_tun_android_plugins.py
      - name: Stage pinned OpenVPN source
        run: python tools/stage_shared_openvpn_android.py
      - name: Compile all plugin Kotlin and OpenVPN Java code
        run: flutter build apk --debug --no-pub
      # No APK is published: AWG/Cisco native binaries are intentionally absent
      # in this fast compile smoke. Only the full Android workflow ships APKs.
