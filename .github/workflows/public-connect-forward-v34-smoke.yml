name: Public Connect Forward V34 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_forward_v34.py'
      - 'backend/app/routers/public_connection_canonical_mobile_v26.py'
      - 'backend/app/routers/public_connection_mobile_compact_v36.py'
      - 'backend/app/routers/public_connection_final_presentation_v37.py'
      - 'backend/app/routers/public_connection_reference_layout_v38.py'
      - 'backend/app/routers/public_connection_mobile_simplified_v39.py'
      - 'backend/app/routers/public_connection_mobile_authority_v40.py'
      - 'backend/app/routers/public_connection_v2ray_actions_v41.py'
      - 'backend/app/routers/public_connection_mobile_sheet_v42.py'
      - 'backend/app/routers/public_connection_device_actions_v11.py'
      - 'backend/app/routers/public_connection_modern_delivery_v13.py'
      - 'backend/app/routers/public_connection_modern_import_v15.py'
      - 'backend/app/routers/public_connection_modern_delivery_v16.py'
      - 'backend/app/routers/public_connection_protocol_actions_v20.py'
      - 'backend/app/routers/public_connection_protocol_subscriptions_v30.py'
      - 'backend/app/xray_public_hub_profiles_v48.py'
      - 'backend/app/routers/public_connection_all_multilink_v34.py'
      - 'backend/app/routers/public_connection_forward_mount_v34.py'
      - 'backend/tests/smoke_public_connection_forward_v34.py'
      - 'backend/tests/smoke_public_connection_forward_v34_matrix.py'
      - 'backend/tests/smoke_public_connection_mobile_compact_v36.py'
      - 'backend/tests/smoke_public_connection_final_presentation_v37.py'
      - 'backend/tests/smoke_public_connection_reference_layout_v38.py'
      - 'backend/tests/smoke_public_connection_mobile_simplified_v39.py'
      - 'backend/tests/smoke_public_connection_mobile_authority_v40.py'
      - 'backend/tests/smoke_public_connection_v2ray_actions_v41.py'
      - 'backend/tests/smoke_public_connection_mobile_sheet_v42.py'
      - '.github/workflows/public-connect-forward-v34-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/routers/public_connection_forward_v34.py'
      - 'backend/app/routers/public_connection_canonical_mobile_v26.py'
      - 'backend/app/routers/public_connection_mobile_compact_v36.py'
      - 'backend/app/routers/public_connection_final_presentation_v37.py'
      - 'backend/app/routers/public_connection_reference_layout_v38.py'
      - 'backend/app/routers/public_connection_mobile_simplified_v39.py'
      - 'backend/app/routers/public_connection_mobile_authority_v40.py'
      - 'backend/app/routers/public_connection_v2ray_actions_v41.py'
      - 'backend/app/routers/public_connection_mobile_sheet_v42.py'
      - 'backend/app/routers/public_connection_device_actions_v11.py'
      - 'backend/app/routers/public_connection_modern_delivery_v13.py'
      - 'backend/app/routers/public_connection_modern_import_v15.py'
      - 'backend/app/routers/public_connection_modern_delivery_v16.py'
      - 'backend/app/routers/public_connection_protocol_actions_v20.py'
      - 'backend/app/routers/public_connection_protocol_subscriptions_v30.py'
      - 'backend/app/xray_public_hub_profiles_v48.py'
      - 'backend/app/routers/public_connection_all_multilink_v34.py'
      - 'backend/app/routers/public_connection_forward_mount_v34.py'
      - 'backend/tests/smoke_public_connection_forward_v34.py'
      - 'backend/tests/smoke_public_connection_forward_v34_matrix.py'
      - 'backend/tests/smoke_public_connection_mobile_compact_v36.py'
      - 'backend/tests/smoke_public_connection_final_presentation_v37.py'
      - 'backend/tests/smoke_public_connection_reference_layout_v38.py'
      - 'backend/tests/smoke_public_connection_mobile_simplified_v39.py'
      - 'backend/tests/smoke_public_connection_mobile_authority_v40.py'
      - 'backend/tests/smoke_public_connection_v2ray_actions_v41.py'
      - 'backend/tests/smoke_public_connection_mobile_sheet_v42.py'
      - '.github/workflows/public-connect-forward-v34-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run V34 presentation authority smoke
        run: python3 backend/tests/smoke_public_connection_forward_v34.py
      - name: Run 15-protocol x 4-platform regression matrix
        run: python3 backend/tests/smoke_public_connection_forward_v34_matrix.py
      - name: Run V36 responsive mobile accordion smoke
        run: python3 backend/tests/smoke_public_connection_mobile_compact_v36.py
      - name: Run V37 final multilink and cleanup smoke
        run: python3 backend/tests/smoke_public_connection_final_presentation_v37.py
      - name: Run V38 reference layout and multilink restore smoke
        run: python3 backend/tests/smoke_public_connection_reference_layout_v38.py
      - name: Run V39 mobile all-protocol and V2Ray simplification smoke
        run: python3 backend/tests/smoke_public_connection_mobile_simplified_v39.py
      - name: Parse V39 inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('backend/app/routers/public_connection_mobile_simplified_v39.py').read_text()
          match = re.search(r'_SCRIPT\s*=\s*r"""(.*?)"""', source, re.S)
          assert match, 'V39 script block missing'
          script = match.group(1).strip()
          script = re.sub(r'^<script[^>]*>\s*', '', script)
          script = re.sub(r'\s*</script>$', '', script)
          Path('/tmp/twinpanel-public-connect-v39.js').write_text(script)
          PY
          node --check /tmp/twinpanel-public-connect-v39.js
      - name: Run V40 final mobile authority smoke
        run: python3 backend/tests/smoke_public_connection_mobile_authority_v40.py
      - name: Parse V40 inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('backend/app/routers/public_connection_mobile_authority_v40.py').read_text()
          match = re.search(r'_SCRIPT\s*=\s*r"""(.*?)"""', source, re.S)
          assert match, 'V40 script block missing'
          script = match.group(1).strip()
          script = re.sub(r'^<script[^>]*>\s*', '', script)
          script = re.sub(r'\s*</script>$', '', script)
          Path('/tmp/twinpanel-public-connect-v40.js').write_text(script)
          PY
          node --check /tmp/twinpanel-public-connect-v40.js
      - name: Run V41 exact V2Ray two-action smoke
        run: python3 backend/tests/smoke_public_connection_v2ray_actions_v41.py
      - name: Parse V41 inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('backend/app/routers/public_connection_v2ray_actions_v41.py').read_text()
          match = re.search(r'_SCRIPT\s*=\s*r"""(.*?)"""', source, re.S)
          assert match, 'V41 script block missing'
          script = match.group(1).strip()
          script = re.sub(r'^<script[^>]*>\s*', '', script)
          script = re.sub(r'\s*</script>$', '', script)
          Path('/tmp/twinpanel-public-connect-v41.js').write_text(script)
          PY
          node --check /tmp/twinpanel-public-connect-v41.js
      - name: Run V42 mobile bottom-sheet smoke
        run: python3 backend/tests/smoke_public_connection_mobile_sheet_v42.py
      - name: Parse V42 inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('backend/app/routers/public_connection_mobile_sheet_v42.py').read_text()
          match = re.search(r'_SCRIPT\s*=\s*r"""(.*?)"""', source, re.S)
          assert match, 'V42 script block missing'
          script = match.group(1).strip()
          script = re.sub(r'^<script[^>]*>\s*', '', script)
          script = re.sub(r'\s*</script>$', '', script)
          Path('/tmp/twinpanel-public-connect-v42.js').write_text(script)
          PY
          node --check /tmp/twinpanel-public-connect-v42.js
