name: Modern Account Lifecycle V1 Smoke

on:
  pull_request:
    paths:
      - "backend/app/plan_protocol_models.py"
      - "backend/app/protocol_account_registry.py"
      - "backend/app/quota_schemas.py"
      - "backend/app/routers/plans.py"
      - "backend/app/routers/__init__.py"
      - "backend/app/routers/modern_account_delivery_v1.py"
      - "backend/app/routers/modern_enforcement_runtime_v1.py"
      - "backend/app/services/modern_enforcement_v1.py"
      - "backend/app/services/quota_node_sync.py"
      - "backend/app/services/subscription_factory.py"
      - "backend/app/singbox_subscription_accounts.py"
      - "backend/app/standalone_subscription_accounts.py"
      - "backend/tests/singbox_subscription_account_mutation_v217_smoke.py"
      - "backend/tests/amneziawg_key_padding_v217_smoke.py"
      - "scripts/smoke-modern-account-lifecycle-v1.py"
      - ".github/workflows/modern-account-lifecycle-v1-smoke.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile lifecycle modules
        run: |
          python -m py_compile \
            backend/app/protocol_account_registry.py \
            backend/app/quota_schemas.py \
            backend/app/routers/modern_account_delivery_v1.py \
            backend/app/routers/modern_enforcement_runtime_v1.py \
            backend/app/services/modern_enforcement_v1.py \
            backend/app/services/quota_node_sync.py \
            backend/app/services/subscription_factory.py \
            backend/app/singbox_subscription_accounts.py \
            backend/app/standalone_subscription_accounts.py \
            backend/tests/singbox_subscription_account_mutation_v217_smoke.py \
            backend/tests/amneziawg_key_padding_v217_smoke.py
      - name: Verify lifecycle contract
        run: python scripts/smoke-modern-account-lifecycle-v1.py
      - name: Verify generated sing-box account mutation scripts
        run: python backend/tests/singbox_subscription_account_mutation_v217_smoke.py
      - name: Verify AmneziaWG private-key padding extraction
        run: python backend/tests/amneziawg_key_padding_v217_smoke.py
