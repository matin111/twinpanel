name: Sing-box Readonly Metering Fast Path
on:
  pull_request:
    paths:
      - backend/app/services/singbox_native_accounting_v265.py
      - backend/tests/test_singbox_readonly_snapshot_fastpath_v1.py
      - .github/workflows/singbox-readonly-fastpath-v1.yml
permissions:
  contents: read
jobs:
  verified-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile backend/app/services/singbox_native_accounting_v265.py backend/tests/test_singbox_readonly_snapshot_fastpath_v1.py
      - run: python backend/tests/test_singbox_readonly_snapshot_fastpath_v1.py -v
