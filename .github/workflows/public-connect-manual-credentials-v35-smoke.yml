name: Public Connect Manual Credentials V35 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_manual_credentials_v35.py'
      - 'backend/app/routers/public_connection_canonical_mobile_v26.py'
      - 'backend/tests/smoke_public_connection_manual_credentials_v35.py'
      - '.github/workflows/public-connect-manual-credentials-v35-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/routers/public_connection_manual_credentials_v35.py'
      - 'backend/app/routers/public_connection_canonical_mobile_v26.py'
      - 'backend/tests/smoke_public_connection_manual_credentials_v35.py'
      - '.github/workflows/public-connect-manual-credentials-v35-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile V35 presentation modules
        run: |
          python3 -m py_compile \
            backend/app/routers/public_connection_manual_credentials_v35.py \
            backend/app/routers/public_connection_canonical_mobile_v26.py \
            backend/tests/smoke_public_connection_manual_credentials_v35.py

      - name: Run V35 regression contract
        run: python3 backend/tests/smoke_public_connection_manual_credentials_v35.py

      - name: Parse V35 inline JavaScript
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('backend/app/routers/public_connection_manual_credentials_v35.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          script = None
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == '_SCRIPT' for target in node.targets):
                  script = ast.literal_eval(node.value)
                  break
          if script is None:
              raise SystemExit('_SCRIPT missing')
          script = script.replace('<script id="twinpanelPublicConnectManualCredentialsV35">', '', 1)
          script = script.rsplit('</script>', 1)[0]
          Path('/tmp/twinpanel-public-connect-v35.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/twinpanel-public-connect-v35.js
