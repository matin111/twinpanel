name: TwinPanel Store Tutorial Assets V121 Import 2

on:
  push:
    branches:
      - feat/store-tutorial-images-v121

permissions:
  contents: write

jobs:
  import-verified-legacy-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-tutorial-images-v121
          fetch-depth: 0

      - name: Import exact backup screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest="assets/legacy-learning-screenshots.sha256"
          test -s "$manifest"
          count=0
          while read -r expected rel; do
            [[ -n "${expected:-}" && -n "${rel:-}" ]] || continue
            case "$rel" in
              learning/screenshots/*/*/*.webp) ;;
              *) echo "Unexpected tutorial path: $rel" >&2; exit 41 ;;
            esac
            target="public/$rel"
            mkdir -p "$(dirname "$target")"
            curl -fL --retry 1 --retry-delay 1 --connect-timeout 8 --max-time 30 \
              "http://217.179.6.142/$rel" -o "$target"
            actual="$(sha256sum "$target" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || {
              echo "Backup checksum mismatch for $rel" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 42
            }
            count=$((count + 1))
          done < "$manifest"
          [[ "$count" -eq 65 ]] || { echo "Expected 65 verified screenshots, got $count" >&2; exit 43; }
          echo "VERIFIED_TUTORIAL_SCREENSHOTS=$count"

      - name: Commit exact screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          git add public/learning/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "Import exact legacy tutorial screenshots"
          git push origin HEAD:feat/store-tutorial-images-v121
