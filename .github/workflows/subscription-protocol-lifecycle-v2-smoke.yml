name: Subscription Protocol Lifecycle V2 Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/subscription_protocol_lifecycle_v2.py"
      - "backend/app/routers/__init__.py"
      - "backend/app/protocol_account_registry.py"
      - "backend/app/subscription_enforcement.py"
      - "backend/tests/subscription_protocol_lifecycle_v2_smoke.py"
      - ".github/workflows/subscription-protocol-lifecycle-v2-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routers/subscription_protocol_lifecycle_v2.py"
      - "backend/app/routers/__init__.py"
      - "backend/app/protocol_account_registry.py"
      - "backend/app/subscription_enforcement.py"
      - "backend/tests/subscription_protocol_lifecycle_v2_smoke.py"
      - ".github/workflows/subscription-protocol-lifecycle-v2-smoke.yml"

permissions:
  contents: read

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile lifecycle override
        run: |
          python -m py_compile backend/app/routers/subscription_protocol_lifecycle_v2.py
          python -m py_compile backend/app/routers/__init__.py
      - name: Verify all-15 lifecycle contract
        run: python backend/tests/subscription_protocol_lifecycle_v2_smoke.py
