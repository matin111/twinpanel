name: Telegram Connection Stability Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/telegram_manager.py"
      - "backend/app/routers/telegram_membership_settings.py"
      - "backend/app/routers/reseller_bot_delivery_runtime_v2.py"
      - "backend/app/routers/__init__.py"
      - "backend/app/telegram_runtime_bot.py"
      - "backend/app/telegram_runtime_custom.py"
      - "backend/app/telegram_account_link_bot.py"
      - "backend/app/telegram_account_link_bot_original.py"
      - "backend/app/telegram_membership.py"
      - "backend/app/telegram_button_styles.py"
      - "backend/app/reseller_bot_runtime_owned.py"
      - "backend/app/bot_text_middleware.py"
      - "backend/requirements.txt"
      - "backend/scripts/telegram_connection_stability_smoke.py"
      - "backend/scripts/telegram_membership_enforcement_smoke.py"
      - "backend/scripts/telegram_button_styles_smoke.py"
      - "backend/scripts/reseller_bot_account_delivery_smoke.py"
      - "components/telegram-button-style-settings.tsx"
      - "components/routed-page-client-v2.tsx"
      - ".github/workflows/telegram-connection-stability-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Telegram runtime
        run: python -m pip install "aiogram==3.30.0"

      - name: Compile Telegram runtimes
        run: |
          python -m py_compile backend/app/routers/telegram_manager.py
          python -m py_compile backend/app/routers/telegram_membership_settings.py
          python -m py_compile backend/app/routers/reseller_bot_delivery_runtime_v2.py
          python -m py_compile backend/app/telegram_runtime_custom.py
          python -m py_compile backend/app/telegram_account_link_bot.py
          python -m py_compile backend/app/telegram_membership.py
          python -m py_compile backend/app/telegram_button_styles.py
          python -m py_compile backend/app/reseller_bot_runtime_owned.py
          python -m py_compile backend/app/bot_text_middleware.py
          python -m py_compile backend/scripts/telegram_membership_enforcement_smoke.py
          python -m py_compile backend/scripts/telegram_button_styles_smoke.py
          python -m py_compile backend/scripts/reseller_bot_account_delivery_smoke.py

      - name: Verify persistent Telegram connection contract
        run: python backend/scripts/telegram_connection_stability_smoke.py

      - name: Verify mandatory membership enforcement contract
        run: python backend/scripts/telegram_membership_enforcement_smoke.py

      - name: Verify button style runtime and admin contract
        run: python backend/scripts/telegram_button_styles_smoke.py

      - name: Verify reseller bot account delivery contract
        run: python backend/scripts/reseller_bot_account_delivery_smoke.py
