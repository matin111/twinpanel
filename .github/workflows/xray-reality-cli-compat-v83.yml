name: TwinPanel Xray REALITY CLI Compat V83

on:
  pull_request:
    paths:
      - "backend/app/xray_modern_runtime.py"
      - "backend/app/xray_reality_cli_compat_v83.py"
      - "backend/app/self_hosted_runtime.py"
      - "backend/tests/integration/test_xray_reality_cli_compat_v83.py"
      - ".github/workflows/xray-reality-cli-compat-v83.yml"
  workflow_dispatch:

jobs:
  reality-cli-compat:
    runs-on: ubuntu-24.04

    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: sqlite:////tmp/twinpanel-xray-v83.db
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile compatibility runtime and executable regression
        run: |
          python -m py_compile \
            backend/app/xray_reality_cli_compat_v83.py \
            backend/app/self_hosted_runtime.py \
            backend/tests/integration/test_xray_reality_cli_compat_v83.py

      - name: Run exact generated-state-script regression
        working-directory: backend
        run: python tests/integration/test_xray_reality_cli_compat_v83.py

      - name: Verify self-hosted runtime wiring imports
        working-directory: backend
        run: |
          python - <<'PY'
          from app import self_hosted_runtime
          from app import xray_reality_cli_compat_v83

          assert callable(self_hosted_runtime.apply_xray_reality_cli_compat_v83)
          assert callable(xray_reality_cli_compat_v83.apply_xray_reality_cli_compat_v83)
          print("XRAY_REALITY_CLI_COMPAT_V83_WIRING_OK")
          PY
