name: TwinPanel Xray REALITY CLI Compat V83

on:
  pull_request:
    paths:
      - "backend/app/xray_modern_runtime.py"
      - "backend/app/xray_reality_cli_compat_v83.py"
      - "backend/app/self_hosted_runtime.py"
      - "backend/tests/integration/test_xray_reality_cli_compat_v83.py"
      - ".github/workflows/xray-reality-cli-compat-v83.yml"
  workflow_dispatch:

jobs:
  reality-cli-compat:
    runs-on: ubuntu-24.04

    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: sqlite:////tmp/twinpanel-xray-v83.db
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile compatibility runtime and executable regression
        run: |
          python -m py_compile \
            backend/app/xray_reality_cli_compat_v83.py \
            backend/app/self_hosted_runtime.py \
            backend/tests/integration/test_xray_reality_cli_compat_v83.py

      - name: Run exact generated-state-script regression
        working-directory: backend
        run: python tests/integration/test_xray_reality_cli_compat_v83.py

      - name: Verify self-hosted runtime wiring order
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/app/self_hosted_runtime.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))

          imported = False
          apply_body = None

          for node in tree.body:
              if isinstance(node, ast.ImportFrom) and node.module == "xray_reality_cli_compat_v83":
                  imported = any(alias.name == "apply_xray_reality_cli_compat_v83" for alias in node.names)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == "apply_self_hosted_runtime":
                  apply_body = node

          assert imported, "V83 compatibility hook is not imported by self_hosted_runtime"
          assert apply_body is not None, "apply_self_hosted_runtime is missing"

          calls = []
          for node in ast.walk(apply_body):
              if not isinstance(node, ast.Call):
                  continue
              func = node.func
              if isinstance(func, ast.Name):
                  calls.append((getattr(node, "lineno", 0), func.id))
              elif isinstance(func, ast.Attribute):
                  calls.append((getattr(node, "lineno", 0), func.attr))

          ordered = [name for _, name in sorted(calls)]
          base_index = ordered.index("apply_xray_modern_runtime")
          compat_index = ordered.index("apply_xray_reality_cli_compat_v83")
          config_index = ordered.index("apply_xray_modern_config_compat_v45")

          assert base_index < compat_index < config_index, ordered
          print("XRAY_REALITY_CLI_COMPAT_V83_WIRING_OK")
          PY
