name: Telegram Back Root Regression

on:
  pull_request:
    paths:
      - "backend/app/bot_text_middleware.py"
      - "backend/app/telegram_purchase_bot.py"
      - "backend/tests/test_telegram_back_root_v2.py"
      - ".github/workflows/telegram-back-root-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/tests/test_telegram_back_root_v2.py"
      - ".github/workflows/telegram-back-root-smoke.yml"

jobs:
  back-navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile main bot and middleware
        run: python -m py_compile backend/app/bot_text_middleware.py backend/app/telegram_purchase_bot.py backend/app/telegram_navigation_v1.py
      - name: Back and duplicate-navigation regression
        run: python -m pytest -q backend/tests/test_telegram_back_root_v2.py
