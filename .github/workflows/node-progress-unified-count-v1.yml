name: Node Progress and Unified Count V1

on:
  pull_request:
    paths:
      - "backend/app/services/node_install_progress_v1.py"
      - "backend/app/routers/node_overview_v1.py"
      - "components/node-add-modal-bridge.tsx"
      - "backend/tests/test_node_progress_and_unified_total_v1.py"
      - ".github/workflows/node-progress-unified-count-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-and-count:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      APP_SECRET_KEY: node-progress-ci-not-live
      DATABASE_URL: sqlite:///./node-progress-ci.sqlite3
      NODE_AGENT_SHARED_SECRET: node-progress-agent-ci-not-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Node total and pending state smoke
        run: python -m pytest -q backend/tests/test_node_progress_and_unified_total_v1.py
