name: Spoof Last Error Recovery V212 Smoke

on:
  pull_request:
    paths:
      - "backend/app/spoof_last_error_recovery_v212.py"
      - "backend/app/spoof_candidate_policy_v202.py"
      - "backend/app/spoof_underlay_guard_v206.py"
      - "backend/tests/spoof_last_error_recovery_v212_smoke.py"
      - ".github/workflows/spoof-last-error-recovery-v212-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: TwinPanel-V212-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: postgresql+psycopg2://twinpanel:twinpanel_test@127.0.0.1:5432/twinpanel
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile V212 recovery
        run: |
          python -m py_compile \
            backend/app/spoof_last_error_recovery_v212.py \
            backend/app/spoof_candidate_policy_v202.py \
            backend/app/spoof_underlay_guard_v206.py \
            backend/tests/spoof_last_error_recovery_v212_smoke.py

      - name: Verify strict historical recovery and false-positive guards
        working-directory: backend
        run: PYTHONPATH=. python tests/spoof_last_error_recovery_v212_smoke.py
