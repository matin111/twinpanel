name: TwinPanel Public Connection Canonical Presentation V24 Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/public_connection_device_actions_v11.py"
      - "backend/app/routers/public_connection_canonical_presentation_v24.py"
      - "backend/tests/smoke_public_connection_canonical_presentation_v24.py"
      - ".github/workflows/public-connection-canonical-presentation-v24-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routers/public_connection_device_actions_v11.py"
      - "backend/app/routers/public_connection_canonical_presentation_v24.py"
      - "backend/tests/smoke_public_connection_canonical_presentation_v24.py"
      - ".github/workflows/public-connection-canonical-presentation-v24-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V11/V24
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_device_actions_v11.py \
            backend/app/routers/public_connection_canonical_presentation_v24.py
      - name: Verify canonical presentation contract
        run: python backend/tests/smoke_public_connection_canonical_presentation_v24.py
