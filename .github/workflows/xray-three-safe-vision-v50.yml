name: Xray Three Safe Profiles V50

on:
  pull_request:
    paths:
      - "backend/app/xray_domainless_vision_v50.py"
      - "backend/app/xray_adaptive_three_profiles_v47.py"
      - "backend/app/central_xray_node_authority_v1.py"
      - "backend/app/xray_hot_client_sync_v1.py"
      - "backend/app/xray_bulk_hot_sync_pilot_v1.py"
      - "backend/scripts/twinpanel_central_xray_node_bulk_v1.py"
      - "backend/app/self_hosted_runtime.py"
      - "backend/scripts/twinpanel_hidden_node_install_finish_v1.py"
      - "backend/tests/test_hidden_node_xray_runtime_composition_v1.py"
      - "backend/tests/test_xray_three_safe_vision_v50.py"
      - ".github/workflows/xray-three-safe-vision-v50.yml"
  workflow_dispatch:

jobs:
  safe-three-profile-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      APP_SECRET_KEY: ci-xray-safe-three-only
      DATABASE_URL: sqlite:///./ci-safe-three.sqlite3
      NODE_AGENT_SHARED_SECRET: ci-xray-safe-three-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test requirements
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Compile all modified backend modules
        run: |
          python -m py_compile \
            backend/app/xray_domainless_vision_v50.py \
            backend/app/xray_adaptive_three_profiles_v47.py \
            backend/app/central_xray_node_authority_v1.py \
            backend/app/xray_hot_client_sync_v1.py \
            backend/app/xray_bulk_hot_sync_pilot_v1.py \
            backend/scripts/twinpanel_central_xray_node_bulk_v1.py \
            backend/app/self_hosted_runtime.py \
            backend/tests/test_xray_three_safe_vision_v50.py
      - name: Run three safe profile invariants
        run: python -m unittest discover -s backend/tests -p "test_xray_three_safe_vision_v50.py" -v
      - name: Run existing node-authority and bulk regression tests
        run: |
          python -m unittest discover -s backend/tests -p "test_central_xray_node_authority_v1.py" -v
          python -m unittest discover -s backend/tests -p "test_central_xray_node_bulk_v1.py" -v
      - name: Detached node installer must compose all three Xray profiles
        run: |
          python -m py_compile backend/scripts/twinpanel_hidden_node_install_finish_v1.py
          python -m unittest discover -s backend/tests -p "test_hidden_node_xray_runtime_composition_v1.py" -v

      - name: Confirm no restart in hot-add installer
        run: |
          ! grep -n 'systemctl restart xray' backend/app/xray_domainless_vision_v50.py
