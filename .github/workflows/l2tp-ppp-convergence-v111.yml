name: TwinPanel L2TP PPP Convergence V111

on:
  pull_request:
    paths:
      - "backend/app/l2tp_ppp_convergence_v111.py"
      - "backend/app/protocol_dataplane_desired_state_v87.py"
      - "backend/app/self_hosted_runtime.py"
      - "backend/app/routers/provision.py"
      - "backend/tests/integration/test_l2tp_ppp_convergence_v111.py"
      - ".github/workflows/l2tp-ppp-convergence-v111.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/l2tp_ppp_convergence_v111.py"
      - "backend/app/protocol_dataplane_desired_state_v87.py"
      - "backend/app/self_hosted_runtime.py"
      - "backend/app/routers/provision.py"
      - "backend/tests/integration/test_l2tp_ppp_convergence_v111.py"
      - ".github/workflows/l2tp-ppp-convergence-v111.yml"

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile changed runtime
        run: |
          python -W error::SyntaxWarning -m py_compile \
            backend/app/l2tp_ppp_convergence_v111.py \
            backend/app/protocol_dataplane_desired_state_v87.py \
            backend/tests/integration/test_l2tp_ppp_convergence_v111.py

      - name: Verify L2TP PPP convergence contracts
        run: |
          python backend/tests/integration/test_l2tp_ppp_convergence_v111.py
