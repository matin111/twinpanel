name: Sudoku Central Whitelist Revocation V1 Smoke

on:
  pull_request:
    paths:
      - backend/scripts/twinpanel_central_node_stage_v1.py
      - backend/scripts/twinpanel_central_sudoku_shared_v2.py
      - backend/app/central_sudoku_shared_runtime_v2.py
      - backend/tests/sudoku_central_whitelist_revocation_v1_smoke.py
      - .github/workflows/sudoku-central-whitelist-revocation-v1-smoke.yml
  workflow_dispatch:

jobs:
  shared-whitelist-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Compile and test central expiry/zero-user gating
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_NAME: TwinPanel-CI
          APP_ENV: test
          APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
          DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/test
          NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
        run: |
          python -m py_compile scripts/twinpanel_central_node_stage_v1.py scripts/twinpanel_central_sudoku_shared_v2.py app/central_sudoku_shared_runtime_v2.py
          python tests/sudoku_central_whitelist_revocation_v1_smoke.py
