name: TwinPanel System Update Dialog V77 Regression

on:
  pull_request:
    paths:
      - "app/layout.tsx"
      - "app/system-release.css"
      - "app/system-release-theme.css"
      - "app/system-release-dialog-v76.css"
      - "components/system-release-footer.tsx"
      - "components/system-update-recovery-bootstrap.tsx"
      - ".github/workflows/system-update-dialog-v76.yml"
  push:
    branches: [main]
    paths:
      - "app/layout.tsx"
      - "app/system-release.css"
      - "app/system-release-theme.css"
      - "app/system-release-dialog-v76.css"
      - "components/system-release-footer.tsx"
      - "components/system-update-recovery-bootstrap.tsx"
      - ".github/workflows/system-update-dialog-v76.yml"

jobs:
  lifecycle-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify authoritative recovery and border-box viewport containment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          footer = Path("components/system-release-footer.tsx").read_text()
          bootstrap = Path("components/system-update-recovery-bootstrap.tsx").read_text()
          css = Path("app/system-release-dialog-v76.css").read_text()
          layout = Path("app/layout.tsx").read_text()

          footer_key = re.search(r'UPDATE_RELOAD_KEY="([^"]+)"', footer)
          bootstrap_key = re.search(r'UPDATE_RELOAD_KEY="([^"]+)"', bootstrap)
          assert footer_key and bootstrap_key
          assert footer_key.group(1) == bootstrap_key.group(1), "recovery key drift"

          # A full document load must discard the stale client marker. The
          # backend release/status state is authoritative and reopens progress
          # when an update is actually still active.
          assert "sessionStorage.removeItem" in bootstrap
          assert "JSON.parse" not in bootstrap
          assert "marker.reload_from" not in bootstrap
          assert "authoritative update" in bootstrap

          assert 'import "./system-release-theme.css";' in layout
          assert 'import "./system-release-dialog-v76.css";' in layout
          assert layout.index('import "./system-release-theme.css";') < layout.index('import "./system-release-dialog-v76.css";')
          assert "<SystemUpdateRecoveryBootstrap/><ThemeProvider>" in layout

          # The complete card border-box, including padding and borders from
          # the legacy component stylesheet, must fit inside the live viewport.
          assert "box-sizing:border-box" in css
          assert "100dvh" in css
          assert "overflow:hidden" in css
          assert "overflow-y:auto" in css
          assert "overflow-x:hidden" in css
          assert "calc(100dvh - var(--system-update-gutter) - var(--system-update-gutter))" in css
          assert "overflow-wrap:anywhere" in css
          assert ".system-update-modal" in css
          assert ".system-update-card" in css
          assert "!important" not in css

          modal = css.split(".system-update-modal{",1)[1].split("}",1)[0]
          card = css.split(".system-update-card{",1)[1].split("}",1)[0]
          assert "overflow:hidden" in modal, "modal shell must never become the scroll container"
          assert "overflow:auto" not in modal, "rc.76 outer-scroll regression returned"
          assert "box-sizing:border-box" in card
          assert "overflow-y:auto" in card, "card must own vertical scrolling"

          print("System Update Dialog V77 regression contract: OK")
          PY
