name: Public Connect Presentation V29 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_presentation_v29.py'
      - 'backend/app/routers/public_connection_canonical_mobile_v26.py'
      - 'backend/scripts/public_connection_presentation_v29_smoke.py'
      - '.github/workflows/public-connect-presentation-v29-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/routers/public_connection_presentation_v29.py'
      - 'backend/app/routers/public_connection_canonical_mobile_v26.py'
      - 'backend/scripts/public_connection_presentation_v29_smoke.py'
      - '.github/workflows/public-connect-presentation-v29-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V29 presentation modules
        run: |
          python -m py_compile \
            app/routers/public_connection_presentation_v29.py \
            app/routers/public_connection_canonical_mobile_v26.py \
            scripts/public_connection_presentation_v29_smoke.py
      - name: Run V29 presentation contract
        env:
          PYTHONPATH: .
        run: python scripts/public_connection_presentation_v29_smoke.py
