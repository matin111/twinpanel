name: TwinPanel Security Overview Null Plan V99

on:
  pull_request:
    paths:
      - "backend/app/routers/admin.py"
      - "backend/tests/integration/test_security_overview_null_plan_v99.py"
      - ".github/workflows/security-overview-null-plan-v99.yml"

jobs:
  regression:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      DATABASE_URL: sqlite+pysqlite:///:memory:
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile security router
        run: python -m py_compile backend/app/routers/admin.py

      - name: Run NULL-plan regression
        working-directory: backend
        run: python tests/integration/test_security_overview_null_plan_v99.py
