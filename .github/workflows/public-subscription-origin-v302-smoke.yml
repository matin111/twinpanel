name: Public Subscription Origin V302 Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/config.py'
      - 'backend/app/services/public_urls.py'
      - 'backend/tests/integration/test_public_subscription_origin_v302.py'
      - '.github/workflows/public-subscription-origin-v302-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/config.py'
      - 'backend/app/services/public_urls.py'
      - 'backend/tests/integration/test_public_subscription_origin_v302.py'
      - '.github/workflows/public-subscription-origin-v302-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      DATABASE_URL: sqlite:///./public-subscription-origin-v302.db
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://198.51.100.10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest==8.3.5

      - name: Compile public URL runtime
        run: python -m compileall -q backend/app/config.py backend/app/services/public_urls.py

      - name: Verify dedicated subscription origin contract
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/integration/test_public_subscription_origin_v302.py
