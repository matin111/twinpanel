name: Telegram Local API Performance Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/plans.py"
      - "backend/app/telegram_runtime_custom.py"
      - "backend/app/telegram_purchase_bot.py"
      - "backend/tests/test_bot_internal_api_performance_v1.py"
      - ".github/workflows/bot-internal-api-perf-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/tests/test_bot_internal_api_performance_v1.py"
      - ".github/workflows/bot-internal-api-perf-smoke.yml"

jobs:
  perf-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile affected modules
        run: python -m py_compile backend/app/routers/plans.py backend/app/telegram_runtime_custom.py backend/app/telegram_purchase_bot.py
      - name: Run performance safety contracts
        run: python -m pytest -q backend/tests/test_bot_internal_api_performance_v1.py
