name: Reseller Bot Account Sublink Smoke

on:
  pull_request:
    paths:
      - 'backend/app/reseller_bot_subscription_link_runtime.py'
      - 'backend/app/reseller_bot_runtime_owned.py'
      - 'backend/scripts/reseller_bot_account_sublink_smoke.py'
      - '.github/workflows/reseller-bot-account-sublink-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/reseller_bot_subscription_link_runtime.py'
      - 'backend/app/reseller_bot_runtime_owned.py'
      - 'backend/scripts/reseller_bot_account_sublink_smoke.py'
      - '.github/workflows/reseller-bot-account-sublink-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed bot runtime
        run: |
          python -m py_compile \
            backend/app/reseller_bot_subscription_link_runtime.py \
            backend/app/reseller_bot_runtime_owned.py \
            backend/scripts/reseller_bot_account_sublink_smoke.py
      - name: Verify owned sublink lookup contract
        run: python backend/scripts/reseller_bot_account_sublink_smoke.py
