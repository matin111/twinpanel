name: TwinPanel Public Updater Fast Path Smoke

on:
  pull_request:
    paths:
      - 'backend/scripts/twinpanel_public_updater.py'
      - '.github/workflows/public-updater-fast-path-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify updater fast-path helpers
        run: |
          python3 - <<'PY'
          import importlib.util
          import os
          import tempfile
          from pathlib import Path

          path = Path('backend/scripts/twinpanel_public_updater.py')
          spec = importlib.util.spec_from_file_location('tp_updater', path)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              left = root / 'left.txt'
              right = root / 'right.txt'
              left.write_text('same\n', encoding='utf-8')
              right.write_text('same\n', encoding='utf-8')
              assert mod.same_file(left, right) is True
              right.write_text('changed\n', encoding='utf-8')
              assert mod.same_file(left, right) is False

              source = root / 'source'
              target = root / 'target'
              source.mkdir()
              (source / 'a.txt').write_text('cached\n', encoding='utf-8')
              assert mod.hardlink_tree(source, target) is True
              assert (target / 'a.txt').read_text(encoding='utf-8') == 'cached\n'
              assert os.stat(source / 'a.txt').st_ino == os.stat(target / 'a.txt').st_ino

          text = path.read_text(encoding='utf-8')
          for marker in (
              'requirements_reused',
              'node_dependencies_reused',
              'frontend_build_reused',
              '--prefer-offline',
              'FRONTEND_ARTIFACTS_MISSING',
              'twinpanel-bot.service',
          ):
              assert marker in text, marker

          print('FAST_PATH_SMOKE_OK')
          PY
