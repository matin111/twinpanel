name: TwinPanel Public Updater Prebuilt Smoke

on:
  pull_request:
    paths:
      - 'backend/scripts/twinpanel_public_updater.py'
      - 'next.config.ts'
      - 'package.json'
      - 'scripts/prepare-standalone.mjs'
      - 'deploy/systemd/twinpanel-web.service.tpl'
      - '.github/workflows/public-updater-fast-path-smoke.yml'
      - '.github/workflows/publish-prebuilt-release.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify prebuilt updater contract
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import tarfile
          import tempfile
          from pathlib import Path

          path=Path('backend/scripts/twinpanel_public_updater.py')
          spec=importlib.util.spec_from_file_location('tp_updater',path)
          mod=importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)

          version='1.2.3-rc.4'
          source_sha='a'*40
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              package=root/'payload'/'twinpanel'
              (package/'.next/standalone').mkdir(parents=True)
              (package/'backend/app').mkdir(parents=True)
              (package/'VERSION').write_text(version,encoding='utf-8')
              (package/'.next/standalone/server.js').write_text('console.log("ok")\n',encoding='utf-8')
              (package/'backend/app/main.py').write_text('app=None\n',encoding='utf-8')
              (package/'.twinpanel-release.json').write_text(json.dumps({
                  'format':mod.ARTIFACT_FORMAT,
                  'version':version,
                  'source_sha':source_sha,
                  'arch':'x86_64',
              }),encoding='utf-8')
              archive=root/'release.tar.gz'
              with tarfile.open(archive,'w:gz') as bundle:
                  bundle.add(package,arcname='twinpanel')
              extracted=mod.extract_prebuilt(archive,root/'out',version,source_sha)
              assert (extracted/'.next/standalone/server.js').is_file()

          text=path.read_text(encoding='utf-8')
          for marker in (
              'twinpanel-prebuilt-v1',
              'download_verified_artifact',
              'RELEASE_ARTIFACT_SHA256_MISMATCH',
              'verify_activation',
              'ACTIVATION_VERSION_MISMATCH',
              'healthy_version',
              "delivery='prebuilt' if prebuilt else 'source-build-fallback'",
          ):
              assert marker in text,marker

          service=Path('deploy/systemd/twinpanel-web.service.tpl').read_text(encoding='utf-8')
          assert '.next/standalone/server.js' in service
          assert 'node_modules/next/dist/bin/next' in service  # rollback compatibility

          config=Path('next.config.ts').read_text(encoding='utf-8')
          assert 'output:"standalone"' in config.replace(' ','')
          print('PREBUILT_UPDATER_SMOKE_OK')
          PY

      - name: Validate shell and workflow syntax basics
        run: |
          bash -n installer/install.sh
          python3 -m py_compile backend/scripts/twinpanel_public_updater.py
