name: TwinPanel API Socket Handoff V1 Smoke

on:
  pull_request:
    paths:
      - 'backend/scripts/twinpanel_api_socket_handoff_v1.py'
      - 'backend/tests/test_api_socket_handoff_v1.py'
      - '.github/workflows/api-socket-handoff-v1-smoke.yml'
  workflow_dispatch:

jobs:
  isolated-socket-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated ASGI test dependency
        run: python -m pip install 'uvicorn==0.34.3'
      - name: Compile cutover helper and tests
        run: |
          python -m py_compile backend/scripts/twinpanel_api_socket_handoff_v1.py
          python -m py_compile backend/tests/test_api_socket_handoff_v1.py
      - name: Exercise read-only defaults, rollback and inherited listener
        run: python -m unittest discover -s backend/tests -p test_api_socket_handoff_v1.py -v
