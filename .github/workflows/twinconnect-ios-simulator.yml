name: TwinConnect iOS Simulator Foundation

on:
  pull_request:
    paths:
      - 'clients/twinconnect/**'
      - '.github/workflows/twinconnect-ios-simulator.yml'
  push:
    branches:
      - 'feat/twinconnect-ios-simulator-foundation-20261115'
    paths:
      - 'clients/twinconnect/**'
      - '.github/workflows/twinconnect-ios-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twinconnect-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: iOS simulator build and launch smoke
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/twinconnect
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Generate native iOS Runner project
        run: flutter create --platforms=ios --org com.twinpanel --project-name twinconnect .
      - name: Install iOS native capability bridge into generated Runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("ios/Runner/AppDelegate.swift")
          bridge = Path("ios_native/TwinConnectIOSVpnBridge.swift")
          source = app.read_text()
          native = bridge.read_text()
          for declaration in ("import Foundation", "import Flutter", "import NetworkExtension"):
              native = native.replace(declaration + "\\n", "")
          # Flutter has two supported iOS templates:
          # legacy AppDelegate registers against self; modern scene-based
          # AppDelegate registers on FlutterImplicitEngineBridge.pluginRegistry.
          import re
          legacy = re.search(
              r"GeneratedPluginRegistrant\\.register\\(with:\\s*self\\)",
              source)
          modern = re.search(
              r"GeneratedPluginRegistrant\\.register\\(with:\\s*engineBridge\\.pluginRegistry\\)",
              source)
          if legacy and not modern:
              registration = """
                  if let controller = window?.rootViewController as? FlutterViewController {
                      TwinConnectIOSVpnBridge.register(binaryMessenger: controller.binaryMessenger)
                  }
              """
              anchor = legacy
          elif modern and not legacy:
              registration = """
                  if let registrar = engineBridge.pluginRegistry.registrar(forPlugin: "TwinConnectIOSVpnBridge") {
                      TwinConnectIOSVpnBridge.register(binaryMessenger: registrar.messenger())
                  }
              """
              anchor = modern
          else:
              raise SystemExit(
                  "Unsupported AppDelegate template; inspect ios/Runner/AppDelegate.swift:\\n"
                  + source[:5000])
          source = (
              source[:anchor.end()] + "\\n" + registration +
              source[anchor.end():])
          app.write_text("import NetworkExtension\\n" + source + "\\n" + native)
          PY
      - name: Type-check packet tunnel provider against iOS Simulator SDK
        shell: bash
        run: |
          xcrun swiftc -typecheck -target arm64-apple-ios17.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            ios_native/PacketTunnelProvider.swift
      - name: Fetch Flutter packages
        run: flutter pub get
      - name: Check static analysis and Flutter tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded
      - name: Build unsigned iOS simulator app
        env:
          TWINCONNECT_DIRECTORY_URL: ${{ vars.TWINCONNECT_DIRECTORY_URL || 'https://panel.matindnspro.sbs' }}
        run: |
          flutter build ios --simulator --debug --no-codesign \
            --target lib/ios_preview_main.dart \
            --dart-define=TWINCONNECT_DIRECTORY_URL="$TWINCONNECT_DIRECTORY_URL"
          test -d build/ios/iphonesimulator/Runner.app
      - name: Verify iPhone simulator boots and launches TwinConnect
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((item["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for item in devices if item["name"].startswith("iPhone") and item["state"] in ("Shutdown", "Booted")), ""))')"
          if [ -z "$device" ]; then
            echo "::error::No available iPhone Simulator runtime on this GitHub macOS runner."
            exit 1
          fi
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$device" com.twinpanel.twinconnect
          xcrun simctl spawn "$device" launchctl print system >/dev/null
          # The isolated preview automatically tours the four real iOS UI
          # screens every 12 seconds. Capture all four on a cloud Mac so the
          # developer can inspect them from a Windows PC, without an iPhone.
          sleep 4
          xcrun simctl io "$device" screenshot TwinConnect-iOS-01-Connect.png
          sleep 12
          xcrun simctl io "$device" screenshot TwinConnect-iOS-02-Locations.png
          sleep 12
          xcrun simctl io "$device" screenshot TwinConnect-iOS-03-Settings.png
          sleep 12
          xcrun simctl io "$device" screenshot TwinConnect-iOS-04-Account.png
      - name: Package Appetize iOS simulator build
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphonesimulator/Runner.app
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app \
            ../../../TwinConnect-iOS-Appetize-v0.1.0.zip
          cd ../../..
          shasum -a 256 TwinConnect-iOS-Appetize-v0.1.0.zip \
            > TwinConnect-iOS-Appetize-SHA256.txt
      - name: Upload installable Appetize simulator app separately
        uses: actions/upload-artifact@v4
        with:
          name: TwinConnect-iOS-Appetize-v0.1.0
          path: |
            clients/twinconnect/TwinConnect-iOS-Appetize-v0.1.0.zip
            clients/twinconnect/TwinConnect-iOS-Appetize-SHA256.txt
          if-no-files-found: error
          retention-days: 14
      # Only screenshots are distributed for visual review. Bundling an
      # executable Runner.app inside the artifact made Chrome flag the
      # entire archive as a dangerous download, although the reviewer needs
      # only images, not an executable for Windows.
      - name: Upload four iPhone screen screenshots (no executable)
        uses: actions/upload-artifact@v4
        with:
          name: TwinConnect-iPhone-Screenshots-v0.1.0
          path: |
            clients/twinconnect/TwinConnect-iOS-01-Connect.png
            clients/twinconnect/TwinConnect-iOS-02-Locations.png
            clients/twinconnect/TwinConnect-iOS-03-Settings.png
            clients/twinconnect/TwinConnect-iOS-04-Account.png
          if-no-files-found: error
          retention-days: 14
