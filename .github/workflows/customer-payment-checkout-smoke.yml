name: TwinPanel Customer Payment Checkout Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/store.py"
      - "components/customer-payments-runtime.tsx"
      - ".github/workflows/customer-payment-checkout-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routers/store.py"
      - "components/customer-payments-runtime.tsx"
      - ".github/workflows/customer-payment-checkout-smoke.yml"

jobs:
  checkout-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify backend free-order activation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("backend/app/routers/store.py").read_text()
          required = [
              '@router.post("/orders/{order_id}/activate-free")',
              'StoreOrder.user_id == user.id',
              'if int(order.amount_toman or 0) > 0:',
              'order.payment_method = "free"',
              'order.status = "provisioning"',
              '.with_for_update()',
              'return await _fulfill_paid_order(',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"missing backend free-order contract: {missing}")
          compile(source, "backend/app/routers/store.py", "exec")
          print("backend free-order activation contract OK")
          PY

      - name: Verify customer checkout UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("components/customer-payments-runtime.tsx").read_text()
          required = [
              'Number(order.amount_toman||0)<=0',
              '/activate-free',
              'فعال‌سازی اشتراک رایگان',
              'روش پرداخت فعالی وجود ندارد',
              'if(!method){setError(',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"missing frontend checkout contract: {missing}")
          print("frontend checkout contract OK")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Build frontend
        run: npm run build
