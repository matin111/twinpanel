name: Smart Candidate Install Guard V167 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/smart_transport_auto_v21.py'
      - 'backend/app/smart_candidate_install_guard_v167.py'
      - 'backend/app/tunnel_transport_manager_v12.py'
      - '.github/workflows/smart-candidate-install-guard-v167-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/smart_transport_auto_v21.py'
      - 'backend/app/smart_candidate_install_guard_v167.py'
      - 'backend/app/tunnel_transport_manager_v12.py'
      - '.github/workflows/smart-candidate-install-guard-v167-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile lifecycle guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            backend/app/smart_candidate_install_guard_v167.py \
            backend/app/tunnel_transport_manager_v12.py

      - name: Verify installing lifecycle contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          guard = Path('backend/app/smart_candidate_install_guard_v167.py').read_text(encoding='utf-8')
          manager = Path('backend/app/tunnel_transport_manager_v12.py').read_text(encoding='utf-8')

          for token in (
              'TWINPANEL_SMART_CANDIDATE_INSTALL_GUARD_V167',
              'def _candidate_is_installing(',
              '_status(row.status) == "installing"',
              '"error": "candidate_install_in_progress"',
              '"skip_persist": True',
              'if _status(row.status) != "installing"',
              'smart.candidate_health_remote_v21 = candidate_health_remote_install_guard_v167',
              'v7.overlay_health_remote = candidate_health_remote_install_guard_v167',
              'v7.write_overlay_rows = write_overlay_rows_install_guard_v167',
              'installer=authoritative',
          ):
              assert token in guard, token

          assert 'apply_smart_candidate_install_guard_v167()' in manager
          assert manager.index('install_smart_transport_auto_v21()') < manager.index(
              'apply_adaptive_multilane_v165()'
          ) < manager.index('apply_smart_candidate_install_guard_v167()')
          assert manager.index('apply_smart_candidate_install_guard_v167()') < manager.index(
              'apply_adaptive_candidate_qualification_v155()'
          )

          # The guard must be additive only: no existing candidate names are removed.
          for name in (
              'tp27_fast',
              'tp27_masque',
              'tp27_mieru_tcp',
              'tp27_tcp_direct',
          ):
              assert name in manager, name

          print('SMART_CANDIDATE_INSTALL_GUARD_V167_SMOKE_OK')
          PY
