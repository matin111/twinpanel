name: TwinPanel Node Subscription Convergence V114

on:
  pull_request:
    paths:
      - 'backend/app/node_subscription_convergence_v114.py'
      - 'backend/app/self_hosted_runtime.py'
      - 'backend/app/routers/provision.py'
      - 'backend/app/routers/account_delivery.py'
      - 'backend/app/l2tp_ppp_convergence_v111.py'
      - 'backend/app/protocol_dataplane_desired_state_v87.py'
      - 'backend/app/main.py'
      - 'backend/tests/integration/test_node_subscription_convergence_v114.py'
      - '.github/workflows/node-subscription-convergence-v114.yml'
  workflow_dispatch:

jobs:
  convergence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile convergence runtime
        run: |
          python -m py_compile \
            backend/app/node_subscription_convergence_v114.py \
            backend/app/self_hosted_runtime.py \
            backend/app/l2tp_ppp_convergence_v111.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Verify fresh-node and historical-subscription contracts
        run: |
          python -m pytest -q \
            backend/tests/integration/test_node_subscription_convergence_v114.py
