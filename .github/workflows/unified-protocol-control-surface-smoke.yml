name: Unified Protocol Control Surface Smoke

on:
  pull_request:
    paths:
      - "components/legacy-nodes-runtime-v2.tsx"
      - "components/routed-page-client-v2.tsx"
      - "components/modern-protocols-admin.tsx"
      - "components/legacy-protocols-studio.tsx"
      - "app/[...path]/page.tsx"
      - ".github/workflows/unified-protocol-control-surface-smoke.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical protocol management surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          node = Path("components/legacy-nodes-runtime-v2.tsx").read_text()
          router = Path("components/routed-page-client-v2.tsx").read_text()
          page = Path("app/[...path]/page.tsx").read_text()
          studio = Path("components/modern-protocols-admin.tsx").read_text()
          classic = Path("components/legacy-protocols-studio.tsx").read_text()

          assert 'href={`/admin/modern-protocols?node=${selected.id}`}' in node
          assert 'مدیریت پروتکل‌ها' in node
          assert 'protocolHealth(' not in node
          assert 'restartProtocol' not in node
          assert 'xrayDomain(' not in node
          assert 'saveXrayDomain' not in node
          assert 'modal==="protocols"' not in node
          assert 'modal==="xray-domain"' not in node

          assert 'routeKey==="admin/nodes"||routeKey==="admin/network"' in router
          assert 'legacy-nodes-runtime-v2' in router
          assert 'routed-page-client-v2' in page

          assert 'LegacyProtocolsStudio' in studio
          for protocol in ('cisco', 'openvpn', 'wireguard', 'l2tp', 'v2ray'):
              assert f'key: "{protocol}"' in classic

          print("UNIFIED_PROTOCOL_CONTROL_SURFACE_OK")
          PY
