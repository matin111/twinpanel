name: Public Connection Live Ping and Reference V78

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_*.py'
      - 'backend/tests/test_public_connection_live_reference_v78.py'
      - '.github/workflows/public-connection-live-reference-v78.yml'

jobs:
  live-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Check route and scripts, then exercise entitlement and live response
        env:
          APP_NAME: TwinPanel-CI
          APP_ENV: test
          APP_SECRET_KEY: ci-only-key-ci-only-key-ci-only-key
          DATABASE_URL: sqlite:///./public-connect-v78-ci.sqlite3
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_hub_v5.py \
            backend/app/routers/public_connection_ping_v78.py \
            backend/app/routers/public_connection_live_reference_v78.py \
            backend/app/routers/public_connection_canonical_mobile_v26.py \
            backend/app/routers/public_connection_v2ray_mobile_restore_v54.py
          PYTHONPATH=backend python -m pytest -q backend/tests/test_public_connection_live_reference_v78.py
