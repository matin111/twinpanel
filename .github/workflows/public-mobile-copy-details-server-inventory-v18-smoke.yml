name: Public Mobile Copy Details Server Inventory V18 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/routers/public_connection_device_actions_v11.py'
      - 'backend/app/routers/public_connection_mobile_server_inventory_v18.py'
      - 'scripts/public-mobile-copy-details-server-inventory-v18-smoke.py'
      - '.github/workflows/public-mobile-copy-details-server-inventory-v18-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/routers/public_connection_device_actions_v11.py'
      - 'backend/app/routers/public_connection_mobile_server_inventory_v18.py'
      - 'scripts/public-mobile-copy-details-server-inventory-v18-smoke.py'
      - '.github/workflows/public-mobile-copy-details-server-inventory-v18-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile refinements
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_device_actions_v11.py \
            backend/app/routers/public_connection_mobile_server_inventory_v18.py \
            scripts/public-mobile-copy-details-server-inventory-v18-smoke.py
      - name: Run V18 smoke
        run: python scripts/public-mobile-copy-details-server-inventory-v18-smoke.py
