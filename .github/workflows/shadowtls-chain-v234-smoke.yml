name: ShadowTLS Chain V234 Smoke

on:
  pull_request:
    paths:
      - "backend/app/modern_protocol_runtime_v2.py"
      - "backend/app/singbox_subscription_accounts.py"
      - "backend/tests/shadowtls_chain_v234_smoke.py"
      - ".github/workflows/shadowtls-chain-v234-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/modern_protocol_runtime_v2.py"
      - "backend/app/singbox_subscription_accounts.py"
      - "backend/tests/shadowtls_chain_v234_smoke.py"
      - ".github/workflows/shadowtls-chain-v234-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python
        run: |
          python -m py_compile \
            backend/app/modern_protocol_runtime_v2.py \
            backend/app/singbox_subscription_accounts.py \
            backend/tests/shadowtls_chain_v234_smoke.py
      - name: Run ShadowTLS chain smoke
        run: python backend/tests/shadowtls_chain_v234_smoke.py
