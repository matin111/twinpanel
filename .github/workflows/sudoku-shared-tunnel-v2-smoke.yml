name: Sudoku Shared Tunnel V2 Smoke

on:
  pull_request:
    paths:
      - "backend/app/modern_protocol_tunnel_binding_v251.py"
      - "backend/tests/sudoku_shared_tunnel_v2_smoke.py"
      - "backend/tests/modern_protocol_tunnel_binding_v251_smoke.py"
      - ".github/workflows/sudoku-shared-tunnel-v2-smoke.yml"
  workflow_dispatch:

jobs:
  sudoku-shared-tunnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile touched files
        run: |
          python -m py_compile backend/app/modern_protocol_tunnel_binding_v251.py
          python -m py_compile backend/tests/sudoku_shared_tunnel_v2_smoke.py
      - name: Run shared-v2 and legacy-v251 tunnel regression
        working-directory: backend
        env:
          APP_NAME: TwinPanel-CI
          APP_ENV: test
          APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
          DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/test
          NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
        run: |
          python tests/sudoku_shared_tunnel_v2_smoke.py
          python tests/modern_protocol_tunnel_binding_v251_smoke.py
