name: Outbound Performance v261-v268 Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/outbound_performance_v261.py"
      - "backend/app/routers/outbound_performance_v262.py"
      - "backend/app/routers/outbound_performance_v262_runtime.py"
      - "backend/app/routers/outbound_performance_v265.py"
      - "backend/app/routers/outbound_performance_v268.py"
      - "backend/app/routers/outbound_performance_v268_guard.py"
      - "backend/app/routers/__init__.py"
      - "backend/tests/outbound_performance_v261_smoke.py"
      - "backend/tests/outbound_performance_v262_smoke.py"
      - "backend/tests/outbound_performance_v265_smoke.py"
      - "backend/tests/outbound_performance_v268_smoke.py"
      - "components/outbound-performance-inline.tsx"
      - "components/outbound-performance-v4.tsx"
      - "components/outbound-performance-v4.module.css"
      - "components/outbound-performance-lab.module.css"
      - "components/ui.tsx"
      - "app/admin/outbounds/page.tsx"
      - "app/admin/outbound-performance/page.tsx"
      - ".github/workflows/outbound-performance-v261-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/routers/outbound_performance_v261.py"
      - "backend/app/routers/outbound_performance_v262.py"
      - "backend/app/routers/outbound_performance_v262_runtime.py"
      - "backend/app/routers/outbound_performance_v265.py"
      - "backend/app/routers/outbound_performance_v268.py"
      - "backend/app/routers/outbound_performance_v268_guard.py"
      - "backend/app/routers/__init__.py"
      - "backend/tests/outbound_performance_v261_smoke.py"
      - "backend/tests/outbound_performance_v262_smoke.py"
      - "backend/tests/outbound_performance_v265_smoke.py"
      - "backend/tests/outbound_performance_v268_smoke.py"
      - "components/outbound-performance-inline.tsx"
      - "components/outbound-performance-v4.tsx"
      - "components/outbound-performance-v4.module.css"
      - "components/outbound-performance-lab.module.css"
      - "components/ui.tsx"
      - "app/admin/outbounds/page.tsx"
      - "app/admin/outbound-performance/page.tsx"
      - ".github/workflows/outbound-performance-v261-smoke.yml"

permissions:
  contents: read

jobs:
  performance-and-admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: |
          python -m py_compile \
            backend/app/routers/outbound_performance_v261.py \
            backend/app/routers/outbound_performance_v262.py \
            backend/app/routers/outbound_performance_v262_runtime.py \
            backend/app/routers/outbound_performance_v265.py \
            backend/app/routers/outbound_performance_v268.py \
            backend/app/routers/outbound_performance_v268_guard.py \
            backend/app/routers/__init__.py \
            backend/tests/outbound_performance_v261_smoke.py \
            backend/tests/outbound_performance_v262_smoke.py \
            backend/tests/outbound_performance_v265_smoke.py \
            backend/tests/outbound_performance_v268_smoke.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Route-bound benchmark smoke
        env:
          APP_SECRET_KEY: "ci-outbound-performance-v261"
          DATABASE_URL: "sqlite:////tmp/twinpanel-outbound-performance-ci.db"
          NODE_AGENT_SHARED_SECRET: "ci-outbound-performance-agent-v261"
        run: PYTHONPATH=backend python backend/tests/outbound_performance_v261_smoke.py

      - name: Advanced benchmark and tuning safety smoke
        env:
          APP_SECRET_KEY: "ci-outbound-performance-v262"
          DATABASE_URL: "sqlite:////tmp/twinpanel-outbound-performance-v262.db"
          NODE_AGENT_SHARED_SECRET: "ci-outbound-performance-agent-v262"
        run: PYTHONPATH=backend python backend/tests/outbound_performance_v262_smoke.py

      - name: Performance analytics v3 plus v4 guard smoke
        env:
          APP_SECRET_KEY: "ci-outbound-performance-v265"
          DATABASE_URL: "sqlite:////tmp/twinpanel-outbound-performance-v265.db"
          NODE_AGENT_SHARED_SECRET: "ci-outbound-performance-agent-v265"
        run: PYTHONPATH=backend python backend/tests/outbound_performance_v265_smoke.py

      - name: Performance v4 optimizer safety smoke
        env:
          APP_SECRET_KEY: "ci-outbound-performance-v268"
          DATABASE_URL: "sqlite:////tmp/twinpanel-outbound-performance-v268.db"
          NODE_AGENT_SHARED_SECRET: "ci-outbound-performance-agent-v268"
        run: PYTHONPATH=backend python backend/tests/outbound_performance_v268_smoke.py

      - name: Import Outbound Performance routers
        env:
          APP_SECRET_KEY: "ci-outbound-performance-v268-import"
          DATABASE_URL: "sqlite:////tmp/twinpanel-outbound-performance-v268-import.db"
          NODE_AGENT_SHARED_SECRET: "ci-outbound-performance-agent-v268-import"
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.routers.outbound_performance_v268 import router as v4_router
          from app.routers.outbound_performance_v268_guard import router as guard_router

          assert v4_router.routes
          assert guard_router.routes
          print("OUTBOUND_PERFORMANCE_V4_IMPORT_OK")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --include=optional --no-audit --no-fund
          fi

      - name: Build admin frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
