name: Fast Nonblocking Node Publish V1

on:
  pull_request:
    paths:
      - "backend/app/routers/nodes.py"
      - "backend/app/routers/node_snapshot_policy_v1.py"
      - "backend/app/routers/publish_node_all_users_v1.py"
      - "backend/app/routers/publish_node_all_users_v2.py"
      - "backend/app/routers/node_overview_v1.py"
      - "backend/app/routers/node_install_progress_v1.py"
      - "backend/app/node_install_progress_models_v1.py"
      - "backend/app/services/node_install_progress_v1.py"
      - "backend/tests/test_node_observability_v1.py"
      - "components/legacy-nodes-runtime-v2.tsx"
      - "components/node-add-modal-bridge.tsx"
      - "backend/tests/test_fast_node_publishing_v1.py"
      - ".github/workflows/fast-node-publish-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      APP_SECRET_KEY: node-publish-contract-test-only
      DATABASE_URL: sqlite:///./node-publish-ci.sqlite3
      NODE_AGENT_SHARED_SECRET: node-publish-agent-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Compile changed Python routes
        run: |
          python -m py_compile backend/app/routers/nodes.py \
            backend/app/routers/node_snapshot_policy_v1.py \
            backend/app/routers/publish_node_all_users_v1.py \
            backend/app/routers/publish_node_all_users_v2.py \
            backend/app/routers/node_overview_v1.py \
            backend/app/routers/node_install_progress_v1.py \
            backend/app/services/node_install_progress_v1.py
      - name: Test node publishing, no bulk churn, safe direct entitlements
        run: |
          python -m pytest -q \
            backend/tests/test_fast_node_publishing_v1.py \
            backend/tests/test_node_observability_v1.py
      - name: Existing legacy publish + retirement safety contracts
        run: |
          python backend/tests/nonblocking_node_publish_v601_smoke.py
          python backend/tests/strict_node_delete_owned_state_v600_smoke.py
