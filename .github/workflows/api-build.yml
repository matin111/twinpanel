name: TwinPanel API Build

on:
  push:
    branches:
      - product/self-hosted-v1
  pull_request:
    paths:
      - "backend/**"
      - "VERSION"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "installer/**"
      - "scripts/deploy-cly871416-preview.sh"
      - "scripts/smoke-cly871416-runtime.sh"
      - "scripts/install-reseller-bot-supervisor.sh"
      - "deploy/systemd/twinpanel-api.service.tpl"
      - "deploy/systemd/twinpanel-reseller-bots.service.tpl"
      - "deploy/nginx/twinpanel.conf.tpl"
      - ".github/workflows/api-build.yml"

jobs:
  api:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twinpanel
          POSTGRES_PASSWORD: twinpanel_test
          POSTGRES_DB: twinpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twinpanel -d twinpanel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: postgresql+psycopg2://twinpanel:twinpanel_test@127.0.0.1:5432/twinpanel
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095
      TWINPANEL_ADMIN_EMAIL: admin-ci@example.com
      TWINPANEL_ADMIN_PASSWORD: TwinPanel-CI-Admin-2026!
      TWINPANEL_ADMIN_NAME: TwinPanel CI Admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer and deployment shell
        run: |
          bash -n installer/install.sh
          bash -n scripts/deploy-cly871416-preview.sh
          bash -n scripts/smoke-cly871416-runtime.sh
          bash -n scripts/install-reseller-bot-supervisor.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Prepare runtime directories
        run: |
          sudo install -d -m 700 /etc/twinpanel
          sudo install -d -m 700 /var/lib/twinpanel-backups
          sudo chown -R "$(id -u):$(id -g)" /etc/twinpanel /var/lib/twinpanel-backups

      - name: Compile backend
        run: python -m compileall -q backend/app backend/scripts

      # The generic API gate keeps the fast resolver regression only. The pinned
      # static BadVPN build is owned by the dedicated NetMod workflow and by the
      # release publisher so unrelated backend PRs do not depend on a live clone
      # of an external repository.
      - name: Enforce shared-only Sudoku source contract
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/test_central_sudoku_bulk_v1.py -v
          PYTHONPATH=. python tests/test_central_sudoku_node_bulk_v1.py -v
          PYTHONPATH=. python tests/sudoku_legacy_retired_v1_smoke.py

      - name: Verify updater restart dispatch and rollback safety
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/test_updater_restart_dispatch_v1.py -v
          PYTHONPATH=. python tests/updater_single_api_restart_v279_smoke.py

      - name: Verify Telegram account link and QR photo navigation
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/test_telegram_link_photo_navigation_v1.py -v
          PYTHONPATH=. python tests/test_telegram_navigation_fast_ack_v1.py

      - name: Protect subscription usage and date reset semantics
        working-directory: backend
        run: PYTHONPATH=. python tests/subscription_admin_cycle_reset_smoke.py

      - name: Prevent stale release manifest hiding new updates
        working-directory: backend
        run: PYTHONPATH=. python tests/test_release_manifest_freshness_v1.py -v

      - name: Verify reversible API socket handoff in isolated loopback
        working-directory: backend
        run: PYTHONPATH=. python tests/test_api_socket_handoff_v1.py -v

      - name: Verify admin edit database lock conflict safety
        working-directory: backend
        run: PYTHONPATH=. python tests/test_admin_edit_lock_conflict_v1.py -v

      - name: Check PostgreSQL source attribution and read-only lock audit
        working-directory: backend
        run: PYTHONPATH=. python tests/test_db_pool_attribution_lock_audit_v1.py -v

      - name: Verify central hidden Exit has no read transaction across SSH install
        working-directory: backend
        run: PYTHONPATH=. python tests/test_central_first_exit_bootstrap_v1.py -v

      - name: Verify fast-presence read transactions close before remote SSH
        working-directory: backend
        run: PYTHONPATH=. python tests/test_fast_presence_read_txn_before_ssh_v1.py -v

      - name: Run NetMod UDPGW V231 regression
        working-directory: backend
        run: PYTHONPATH=. python tests/test_netmod_udpgw_v231.py

      - name: Run reseller receipt review smoke
        working-directory: backend
        run: python scripts/reseller_receipt_review_smoke.py

      - name: Verify reseller owned-plan runtime import
        working-directory: backend
        run: |
          python - <<'PY'
          from app.reseller_bot_runtime import supervisor
          from app.reseller_bot_runtime_owned import build_router, install_runtime_overrides
          from app.reseller_bot_owned_runtime import build_owned_plan_router
          from app.reseller_bot_review import register_reseller_review_handlers
          from app.reseller_owned_plans import create_subscription_from_owned_plan
          from app.routers.reseller_bot_orders_owned_v3 import approve_order_owned_v3
          from app.services.reseller_traffic_pool import apply_usage_event, open_session, restore_reseller_pool_subscriptions

          for value in (
              supervisor,
              build_router,
              install_runtime_overrides,
              build_owned_plan_router,
              register_reseller_review_handlers,
              create_subscription_from_owned_plan,
              approve_order_owned_v3,
              apply_usage_event,
              open_session,
              restore_reseller_pool_subscriptions,
          ):
              assert callable(value)
          print("RESELLER_OWNED_USAGE_POOL_IMPORT_OK")
          PY

      - name: Validate reseller bot systemd template
        run: |
          grep -q 'ExecStart=/opt/twinpanel/venv/bin/python -m app.reseller_bot_runtime_owned' deploy/systemd/twinpanel-reseller-bots.service.tpl
          grep -q 'Restart=always' deploy/systemd/twinpanel-reseller-bots.service.tpl

      - name: Import application and create schema
        working-directory: backend
        run: python -c 'from app.main import app; print("API_IMPORT_OK", app.title)'

      - name: Run Outbound Performance v265 analytics smoke
        working-directory: backend
        run: PYTHONPATH=. python tests/outbound_performance_v265_smoke.py

      - name: Verify reseller owned plan schema and routes
        working-directory: backend
        run: |
          python - <<'PY'
          from app.database import SessionLocal
          from app.models import User, Node, NodeType, Plan
          from app.plan_category_models import PlanCategoryAssignment
          from app.plan_node_models import PlanNode
          from app.plan_protocol_models import PlanProtocol
          from app.models_reseller import Reseller, ResellerPlanPrice
          from app.reseller_owned_plan_models import ResellerBotPlan
          from app.reseller_owned_plans import INTERNAL_PLAN_PREFIX, create_owned_plan, plan_out
          from app.security import hash_password

          db = SessionLocal()
          try:
              user = User(
                  email="reseller-owned-ci@example.com",
                  password_hash=hash_password("TwinPanel-CI-Reseller-2026!"),
                  full_name="CI Reseller",
                  is_active=True,
              )
              db.add(user)
              db.flush()
              reseller = Reseller(
                  owner_user_id=user.id,
                  code="ci-owned-plan",
                  name="CI Owned Plans",
                  traffic_balance_bytes=10 * 1024**3,
                  traffic_credit_bytes=0,
                  is_active=True,
              )
              db.add(reseller)
              db.flush()
              # The new tier policy requires a canonical public-plan allowlist.
              # Use a real category/exit/protocol template in this CI database.
              node = Node(
                  name="ci-owned-premium-exit", node_type=NodeType.EXIT,
                  country_code="DE", public_ip="198.51.100.61",
                  agent_url="http://127.0.0.1:65534",
              )
              plan = Plan(
                  name="ci-owned-premium-template", duration_days=30,
                  traffic_gb=50, device_limit=1, price_toman=1000,
                  is_active=True,
              )
              db.add_all([node,plan]); db.flush()
              db.add(PlanCategoryAssignment(
                  plan_id=plan.id, category="CI",
                  subscription_type="اشتراک ویژه آی پی ثابت",
              ))
              db.add(PlanNode(plan_id=plan.id,node_id=node.id))
              db.add_all([
                  PlanProtocol(plan_id=plan.id,protocol=key)
                  for key in ("cisco","openvpn","wireguard","l2tp","v2ray")
              ])
              db.flush()
              before = int(reseller.traffic_balance_bytes or 0)
              row = create_owned_plan(
                  db,
                  reseller=reseller,
                  title="50 GB / 30 Days",
                  traffic_gb=50,
                  duration_days=30,
                  device_limit=2,
                  sell_price_toman=100000,
                  enable_cisco=True,
                  enable_openvpn=True,
                  enable_wireguard=True,
                  enable_l2tp=True,
                  enable_v2ray=True,
                  sort_order=10,
                  is_active=True,
              )
              db.flush()
              out = plan_out(row)
              assert out["reseller_plan_id"] == row.id
              assert out["plan_id"] == row.backing_plan_id
              assert out["traffic_reserved_on_sale"] is False
              assert int(reseller.traffic_balance_bytes or 0) == before
              price = (
                  db.query(ResellerPlanPrice)
                  .filter(
                      ResellerPlanPrice.reseller_id == reseller.id,
                      ResellerPlanPrice.plan_id == row.backing_plan_id,
                  )
                  .one()
              )
              assert price.buy_price_toman == 0
              assert price.sell_price_toman == 100000
              assert row.backing_plan_id > 0
              assert INTERNAL_PLAN_PREFIX.startswith("__tp_")
              assert (
                  db.query(ResellerBotPlan)
                  .filter(ResellerBotPlan.reseller_id == reseller.id)
                  .count()
                  == 1
              )
              print("RESELLER_OWNED_PLAN_SCHEMA_OK")
          finally:
              db.rollback()
              db.close()
          PY

      - name: Verify self-hosted runtime hooks
        working-directory: backend
        run: |
          python - <<'PY'
          from app.main import app
          from app.routers import nodes, tunnels

          assert tunnels._install_or_upgrade_agent.__module__ == "app.self_hosted_runtime"
          assert hasattr(nodes, "Path")
          print("SELF_HOSTED_RUNTIME_OK", app.title)
          PY

      - name: Bootstrap admin
        working-directory: backend
        run: python scripts/bootstrap_admin.py

      # Uvicorn is owned by the Python supervisor in a non-daemon thread. This
      # avoids GitHub runner cleanup of shell-background children while still
      # exercising a real localhost HTTP server, readiness, OpenAPI and API
      # core smoke tests.
      - name: Run API integration smoke
        working-directory: backend
        run: python scripts/ci_api_integration_supervisor.py

      - name: Setup Node for admin UI verification
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install admin UI dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build admin UI
        run: npm run build