name: Xray Customer XHTTP V46 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/xray_customer_xhttp_v46.py'
      - 'backend/app/service_connections_jobs_v28.py'
      - 'backend/app/self_hosted_runtime.py'
      - 'backend/app/xray_modern_runtime.py'
      - 'backend/app/xray_customer_profile_policy_v30.py'
      - 'scripts/xray-customer-xhttp-v46-smoke.py'
      - '.github/workflows/xray-customer-xhttp-v46-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/xray_customer_xhttp_v46.py'
      - 'backend/app/service_connections_jobs_v28.py'
      - 'backend/app/self_hosted_runtime.py'
      - 'backend/app/xray_modern_runtime.py'
      - 'backend/app/xray_customer_profile_policy_v30.py'
      - 'scripts/xray-customer-xhttp-v46-smoke.py'
      - '.github/workflows/xray-customer-xhttp-v46-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Xray V46 refinement
        run: |
          python -m py_compile \
            backend/app/xray_customer_xhttp_v46.py \
            backend/app/service_connections_jobs_v28.py \
            scripts/xray-customer-xhttp-v46-smoke.py
      - name: Run Xray V46 smoke
        run: python scripts/xray-customer-xhttp-v46-smoke.py
