name: NetMod UDPGW Resolver V233 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/netmod_udpgw.py'
      - 'backend/app/netmod_udpgw_artifact.py'
      - 'backend/app/dnstt_artifact.py'
      - 'backend/tests/test_netmod_udpgw_v231.py'
      - 'scripts/build-netmod-udpgw.sh'
      - '.github/workflows/netmod-udpgw-v231-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run NetMod UDPGW resolver regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest
          PYTHONPATH=backend python -m pytest -q backend/tests/test_netmod_udpgw_v231.py

      - name: Build and verify pinned BadVPN UDPGW resolver
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake file libc6-dev

          OUT="$(mktemp)"
          LICENSE="$(mktemp)"
          trap 'rm -f "$OUT" "$OUT.sha256" "$LICENSE"' EXIT

          NETMOD_UDPGW_TEST_PORT=17300 \
            bash scripts/build-netmod-udpgw.sh "$OUT" "$LICENSE"

          test -x "$OUT"
          "$OUT" --version | grep -q 'BadVPN udpgw'
          file "$OUT" | grep -q 'statically linked'
          grep -Eq "^[0-9a-f]{64}  ${OUT}$" "$OUT.sha256"
          test -s "$LICENSE"
