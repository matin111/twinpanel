name: NetMod UDPGW V231 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/netmod_udpgw.py'
      - 'backend/app/netmod_udpgw_artifact.py'
      - 'backend/app/dnstt_artifact.py'
      - 'backend/tests/test_netmod_udpgw_v231.py'
      - '.github/workflows/netmod-udpgw-v231-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run NetMod UDPGW regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest
          PYTHONPATH=backend python -m pytest -q backend/tests/test_netmod_udpgw_v231.py

      - name: Build pinned BadVPN UDPGW statically
        shell: bash
        run: |
          set -Eeuo pipefail
          BADVPN_COMMIT='07268f02706e78e282e19641b5d1d41e8e89bf31'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake musl-tools

          SRC="$(mktemp -d)"
          BUILD="$(mktemp -d)"
          trap 'rm -rf "$SRC" "$BUILD"' EXIT

          git -C "$SRC" init -q
          git -C "$SRC" remote add origin https://github.com/ambrop72/badvpn.git
          git -C "$SRC" fetch -q --depth=1 origin "$BADVPN_COMMIT"
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$BADVPN_COMMIT"

          CC=musl-gcc cmake -S "$SRC" -B "$BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NOTHING_BY_DEFAULT=1 \
            -DBUILD_UDPGW=1 \
            -DCMAKE_EXE_LINKER_FLAGS='-static'
          cmake --build "$BUILD" --target badvpn-udpgw --parallel 2

          BIN="$BUILD/udpgw/badvpn-udpgw"
          test -x "$BIN"
          "$BIN" --version | grep -q 'BadVPN udpgw'
          file "$BIN" | grep -q 'statically linked'
          sha256sum "$BIN"

          "$BIN" --loglevel warning --listen-addr 127.0.0.1:17300 \
            --max-clients 8 --max-connections-for-client 32 \
            >/tmp/netmod-udpgw-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true; rm -rf "$SRC" "$BUILD"' EXIT
          for _ in $(seq 1 30); do
            if ss -H -ltn | grep -F '127.0.0.1:17300 ' >/dev/null; then
              break
            fi
            sleep 0.1
          done
          ss -H -ltn | grep -F '127.0.0.1:17300 '
          kill "$PID"
          wait "$PID" || true
