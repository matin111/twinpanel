name: TMP Bootstrap Callers V358

on:
  push:
    branches:
      - feature/selected-initial-transport-v358

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print bootstrap caller contexts
        shell: bash
        run: |
          set -euo pipefail
          echo '===== 1900-2025 ====='
          sed -n '1900,2025p' backend/app/routers/tunnels.py
          echo '===== 5240-5345 ====='
          sed -n '5240,5345p' backend/app/routers/tunnels.py
          echo '===== 5540-5650 ====='
          sed -n '5540,5650p' backend/app/routers/tunnels.py
          echo '===== 4540-4610 ====='
          sed -n '4540,4610p' backend/app/routers/tunnels.py
