name: Quota Offline Node Guard
on:
  pull_request:
    paths:
      - backend/app/services/modern_quota_runtime_v314.py
      - backend/app/services/singbox_native_accounting_v265.py
      - backend/tests/test_quota_offline_node_scan_remaining_v1.py
      - .github/workflows/quota-offline-node-scan-v1.yml
permissions:
  contents: read
jobs:
  offline-node-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile backend/app/services/modern_quota_runtime_v314.py backend/app/services/singbox_native_accounting_v265.py backend/tests/test_quota_offline_node_scan_remaining_v1.py
      - run: python backend/tests/test_quota_offline_node_scan_remaining_v1.py -v
