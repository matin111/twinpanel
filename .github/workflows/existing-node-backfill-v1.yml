name: Scoped Existing Node Credential Backfill V1

on:
  pull_request:
    paths:
      - "backend/scripts/twinpanel_existing_node_backfill_v1.py"
      - "backend/scripts/twinpanel_migration_singbox_batch.py"
      - "backend/scripts/twinpanel_migration_classic_sequential_v3.py"
      - "backend/tests/test_existing_node_backfill_v1.py"
      - ".github/workflows/existing-node-backfill-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_SECRET_KEY: dummy-ci-secret
      NODE_AGENT_SHARED_SECRET: dummy-ci-agent-secret
      DATABASE_URL: sqlite:///./existing-node-ci.sqlite3
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test runtime dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Compile all changed backfill scripts
        run: |
          python -m py_compile backend/scripts/twinpanel_existing_node_backfill_v1.py
          python -m py_compile backend/scripts/twinpanel_migration_singbox_batch.py
          python -m py_compile backend/scripts/twinpanel_migration_classic_sequential_v3.py
      - name: Dry-run, eligibility and safety tests
        run: python -m pytest -q backend/tests/test_existing_node_backfill_v1.py
