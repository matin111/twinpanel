name: Temporary SSH logo no-wrap patch

on:
  push:
    branches:
      - fix/ssh-logo-no-wrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ssh-logo-no-wrap
          fetch-depth: 0
      - name: Patch logo renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/twinpanel-menu.sh')
          s = p.read_text()
          start = s.index('brand_row(){')
          end = s.index('\nseparator(){', start)
          new = r'''brand_row(){
            local glyph cell i gap
            gap=' '

            printf '  '
            for glyph in "$@"; do
              for ((i=0; i<${#glyph}; i++)); do
                cell="${glyph:i:1}"
                if [[ "$cell" == "1" ]]; then
                  if [[ -n "$C_WHITE_BG" ]]; then
                    printf '%b %b' "$C_WHITE_BG" "$C_RESET"
                  else
                    printf '#'
                  fi
                else
                  printf ' '
                fi
              done
              printf '%s' "$gap"
            done
            printf '\n'
          }

          brand(){
            printf '\n'
            brand_row '1111111' '1000001' '1111111' '1000001' '1111110' '0111110' '1000001' '1111111' '1000000'
            brand_row '0001000' '1000001' '0001000' '1100001' '1000001' '1000001' '1100001' '1000000' '1000000'
            brand_row '0001000' '1000001' '0001000' '1010001' '1000001' '1000001' '1010001' '1000000' '1000000'
            brand_row '0001000' '1010101' '0001000' '1001001' '1111110' '1111111' '1001001' '1111110' '1000000'
            brand_row '0001000' '1010101' '0001000' '1000101' '1000000' '1000001' '1000101' '1000000' '1000000'
            brand_row '0001000' '1101011' '0001000' '1000011' '1000000' '1000001' '1000011' '1000000' '1000000'
            brand_row '0001000' '1000001' '1111111' '1000001' '1000000' '1000001' '1000001' '1111111' '1111111'
            printf '\n'
          }
          '''
          p.write_text(s[:start] + new + s[end:])
          PY
          rm -f .github/workflows/tmp-fix-ssh-logo-no-wrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/twinpanel-menu.sh .github/workflows/tmp-fix-ssh-logo-no-wrap.yml
          git commit -m 'Fix SSH logo width without terminal wrapping'
          git push origin HEAD:fix/ssh-logo-no-wrap
