name: VPN Access Performance V57 Runtime Smoke

on:
  pull_request:
    paths:
      - "backend/app/vpn_access_performance_v51.py"
      - "backend/app/vpn_access_performance_v51_runtime_guard_v57.py"
      - ".github/workflows/vpn-access-performance-v57-runtime-smoke.yml"
  workflow_dispatch:

jobs:
  runtime-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile V51 and V57 guard
        run: |
          python -m py_compile \
            backend/app/vpn_access_performance_v51.py \
            backend/app/vpn_access_performance_v51_runtime_guard_v57.py

      - name: Render the actual V51 remote script
        run: |
          python backend/app/vpn_access_performance_v51_runtime_guard_v57.py

      - name: Verify escaped remote MSS variable remains in rendered payload
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("backend/app/vpn_access_performance_v51_runtime_guard_v57.py")
          spec = importlib.util.spec_from_file_location("v57_guard", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          rendered = module.validate_v51_performance_script()
          assert 'f"mssfix {ACCESS_MSS}"' in rendered
          assert "ACCESS_MSS=1160" in rendered
          print("VPN_ACCESS_PERFORMANCE_V57_RUNTIME_SMOKE=PASS")
          PY
