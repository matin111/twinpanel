name: TMP Apply Selected Initial Transport V358

on:
  push:
    branches:
      - feature/selected-initial-transport-v358

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V358 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"ANCHOR_MISSING:{path}:{old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"ANCHOR_NOT_UNIQUE:{path}:{text.count(old)}:{old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Register the isolated V358 router without changing legacy route order.
          replace_once(
              "backend/app/main.py",
              'from .routers.modern_transports import router as modern_transports_router\n',
              'from .routers.modern_transports import router as modern_transports_router\nfrom .routers.tunnel_selected_v358 import router as tunnel_selected_v358_router  # TWINPANEL_SELECTED_INITIAL_TRANSPORT_V358\n',
          )
          replace_once(
              "backend/app/main.py",
              'app.include_router(modern_transports_router)\n',
              'app.include_router(modern_transports_router)\napp.include_router(tunnel_selected_v358_router)\n',
          )

          # Add a typed client call for the new selected-create endpoint.
          replace_once(
              "lib/legacy-control-api.ts",
              'export type ManagedTunnelCreateResponse={\n',
              'export type SelectedTunnelCreateResponse={\n  ok:boolean;\n  operational:boolean;\n  tunnel:{id:number;iran_node_id:number;exit_node_id:number;priority:number;mode:string;status:string;active_transport:string|null;preferred_transport:string|null};\n  initial_transport:"tp27_fast"|"spoof_wg";\n  installed:string[];\n  other_transports:string;\n  spoof_configuration?:unknown;\n  bootstrap?:RuntimeRow;\n  install?:unknown;\n  selection?:unknown;\n};\n\nexport type ManagedTunnelCreateResponse={\n',
          )
          anchor = '''  createManagedTunnel:async(payload:{iran_node_id:number;exit_node_id:number;transport:string;priority:number;is_active:boolean})=>{\n    const body=JSON.stringify({...payload,is_active:true});\n    try{\n      return await requestWithTimeout<ManagedTunnelCreateResponse>("/v1/tunnels/create-managed",{method:"POST",body},360000);\n    }catch(error){\n      if(!routeMissing(error))throw error;\n      return null;\n    }\n  },\n'''
          addition = anchor + '''  createSelectedTunnel:(payload:{iran_node_id:number;exit_node_id:number;priority:number;initial_transport:"tp27_fast"|"spoof_wg";iran_spoof_ip?:string;exit_spoof_ip?:string})=>\n    requestWithTimeout<SelectedTunnelCreateResponse>("/v1/tunnels/create-selected",{method:"POST",body:JSON.stringify(payload)},360000),\n'''
          replace_once("lib/legacy-control-api.ts", anchor, addition)

          # Update the active /admin/tunnels creation form.
          replace_once(
              "components/tunnel-protocol-runtime-v307.tsx",
              'type Draft={iran_node_id:number;exit_node_id:number;priority:number};',
              'type InitialTransport="tp27_fast"|"spoof_wg";\ntype Draft={iran_node_id:number;exit_node_id:number;priority:number;initial_transport:InitialTransport;iran_spoof_ip:string;exit_spoof_ip:string};',
          )
          replace_once(
              "components/tunnel-protocol-runtime-v307.tsx",
              'const [draft,setDraft]=useState<Draft>({iran_node_id:0,exit_node_id:0,priority:100});',
              'const [draft,setDraft]=useState<Draft>({iran_node_id:0,exit_node_id:0,priority:100,initial_transport:"tp27_fast",iran_spoof_ip:"",exit_spoof_ip:""});',
          )
          old_create = '''  const createTunnel=async(event:FormEvent)=>{\n    event.preventDefault();if(busy||!draft.iran_node_id||!draft.exit_node_id)return;\n    if(!readyIranNodes.some(node=>node.id===draft.iran_node_id)||!readyExitNodes.some(node=>node.id===draft.exit_node_id)){\n      setError(pick("برای ساخت Tunnel هر دو نود ایران و خارج باید Online و آماده باشند.","Both Iran and Exit nodes must be online and ready before creating a tunnel."));\n      return;\n    }\n    setBusy("create");setError("");setNotice("");\n    try{\n      const result=await legacyControlApi.createManagedTunnel({...draft,transport:"auto",is_active:true});\n      const id=Number(result?.tunnel?.id||0);if(!id)throw new Error("INVALID_MANAGED_TUNNEL_RESPONSE");\n      setCreateOpen(false);await load(true,id);setSelectedId(id);setManageOpen(true);setNotice(pick(`Tunnel #${id} ساخته شد.`,`Tunnel #${id} was created.`));\n    }catch(reason){setError(reason instanceof Error?reason.message:String(reason));}finally{setBusy("");}\n  };\n'''
          new_create = '''  const createTunnel=async(event:FormEvent)=>{\n    event.preventDefault();if(busy||!draft.iran_node_id||!draft.exit_node_id)return;\n    if(!readyIranNodes.some(node=>node.id===draft.iran_node_id)||!readyExitNodes.some(node=>node.id===draft.exit_node_id)){\n      setError(pick("برای ساخت Tunnel هر دو نود ایران و خارج باید Online و آماده باشند.","Both Iran and Exit nodes must be online and ready before creating a tunnel."));\n      return;\n    }\n    if(draft.initial_transport==="spoof_wg"&&(!draft.iran_spoof_ip.trim()||!draft.exit_spoof_ip.trim())){\n      setError(pick("برای Spoof Tunnel هر دو IP Spoof ایران و خارج الزامی است.","Both Iran and Exit spoof IPs are required for Spoof Tunnel."));\n      return;\n    }\n    setBusy("create");setError("");setNotice("");\n    try{\n      const result=await legacyControlApi.createSelectedTunnel({\n        iran_node_id:draft.iran_node_id,exit_node_id:draft.exit_node_id,priority:draft.priority,initial_transport:draft.initial_transport,\n        ...(draft.initial_transport==="spoof_wg"?{iran_spoof_ip:draft.iran_spoof_ip.trim(),exit_spoof_ip:draft.exit_spoof_ip.trim()}:{}),\n      });\n      const id=Number(result?.tunnel?.id||0);if(!id)throw new Error("INVALID_SELECTED_TUNNEL_RESPONSE");\n      setCreateOpen(false);await load(true,id);setSelectedId(id);setManageOpen(true);setNotice(pick(`Tunnel #${id} با مسیر انتخابی ساخته شد.`,`Tunnel #${id} was created with the selected transport.`));\n    }catch(reason){setError(reason instanceof Error?reason.message:String(reason));}finally{setBusy("");}\n  };\n'''
          replace_once("components/tunnel-protocol-runtime-v307.tsx", old_create, new_create)
          replace_once(
              "components/tunnel-protocol-runtime-v307.tsx",
              'setDraft({iran_node_id:iran.id,exit_node_id:exit.id,priority:100});setCreateOpen(true);',
              'setDraft({iran_node_id:iran.id,exit_node_id:exit.id,priority:100,initial_transport:"tp27_fast",iran_spoof_ip:"",exit_spoof_ip:""});setCreateOpen(true);',
          )
          old_modal = '''{createOpen&&<Modal title={pick("Tunnel جدید","New tunnel")} onClose={()=>!busy&&setCreateOpen(false)}><form className="runtime-form" onSubmit={createTunnel}><label>{pick("نود ایران","Iran node")}<select value={draft.iran_node_id} onChange={event=>setDraft(value=>({...value,iran_node_id:Number(event.target.value)}))}>{readyIranNodes.map(node=><option key={node.id} value={node.id}>{node.name} · {node.public_ip}</option>)}</select></label><label>{pick("نود خارج","Exit node")}<select value={draft.exit_node_id} onChange={event=>setDraft(value=>({...value,exit_node_id:Number(event.target.value)}))}>{readyExitNodes.map(node=><option key={node.id} value={node.id}>{node.name} · {node.public_ip}</option>)}</select></label><label>{pick("اولویت","Priority")}<input type="number" value={draft.priority} onChange={event=>setDraft(value=>({...value,priority:Number(event.target.value)||100}))}/></label><div className="action-row"><button type="submit" className="primary" disabled={Boolean(busy)||!draft.iran_node_id||!draft.exit_node_id}>{busy==="create"?"…":pick("ساخت و آماده‌سازی","Create & provision")}</button></div></form></Modal>}'''
          new_modal = '''{createOpen&&<Modal title={pick("Tunnel جدید","New tunnel")} onClose={()=>!busy&&setCreateOpen(false)}><form className="runtime-form" onSubmit={createTunnel}><label>{pick("نود ایران","Iran node")}<select value={draft.iran_node_id} onChange={event=>setDraft(value=>({...value,iran_node_id:Number(event.target.value)}))}>{readyIranNodes.map(node=><option key={node.id} value={node.id}>{node.name} · {node.public_ip}</option>)}</select></label><label>{pick("نود خارج","Exit node")}<select value={draft.exit_node_id} onChange={event=>setDraft(value=>({...value,exit_node_id:Number(event.target.value)}))}>{readyExitNodes.map(node=><option key={node.id} value={node.id}>{node.name} · {node.public_ip}</option>)}</select></label><label>{pick("مسیر اولیه","Initial transport")}<select value={draft.initial_transport} onChange={event=>setDraft(value=>({...value,initial_transport:event.target.value as InitialTransport}))}><option value="tp27_fast">TP27 Fast</option><option value="spoof_wg">Spoof Tunnel</option></select></label>{draft.initial_transport==="spoof_wg"&&<><label>{pick("IP Spoof ایران","Iran spoof IP")}<input dir="ltr" value={draft.iran_spoof_ip} onChange={event=>setDraft(value=>({...value,iran_spoof_ip:event.target.value}))}/></label><label>{pick("IP Spoof خارج","Exit spoof IP")}<input dir="ltr" value={draft.exit_spoof_ip} onChange={event=>setDraft(value=>({...value,exit_spoof_ip:event.target.value}))}/></label></>}<label>{pick("اولویت","Priority")}<input type="number" value={draft.priority} onChange={event=>setDraft(value=>({...value,priority:Number(event.target.value)||100}))}/></label><div className="action-row"><button type="submit" className="primary" disabled={Boolean(busy)||!draft.iran_node_id||!draft.exit_node_id||(draft.initial_transport==="spoof_wg"&&(!draft.iran_spoof_ip.trim()||!draft.exit_spoof_ip.trim()))}>{busy==="create"?"…":pick("ساخت و نصب مسیر","Create & install")}</button></div></form></Modal>}'''
          replace_once("components/tunnel-protocol-runtime-v307.tsx", old_modal, new_modal)
          PY

          python3 -m py_compile backend/app/routers/tunnel_selected_v358.py backend/app/main.py
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('components/tunnel-protocol-runtime-v307.tsx').read_text()
          api=Path('lib/legacy-control-api.ts').read_text()
          main=Path('backend/app/main.py').read_text()
          assert 'initial_transport:InitialTransport' in ui
          assert '<option value="tp27_fast">TP27 Fast</option>' in ui
          assert '<option value="spoof_wg">Spoof Tunnel</option>' in ui
          assert 'createSelectedTunnel' in ui
          assert 'createManagedTunnel({...draft,transport:"auto"' not in ui
          assert '/v1/tunnels/create-selected' in api
          assert 'tunnel_selected_v358_router' in main
          print('V358_PATCH_SMOKE_OK')
          PY

      - name: Commit V358 source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/app/main.py lib/legacy-control-api.ts components/tunnel-protocol-runtime-v307.tsx; then
            echo 'No source diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py lib/legacy-control-api.ts components/tunnel-protocol-runtime-v307.tsx
          git commit -m 'Select initial tunnel transport during creation'
          git push origin HEAD:feature/selected-initial-transport-v358
