name: TP27 Direct TCP TUN FD Smoke

on:
  pull_request:
    paths:
      - 'tools/tp27-tcp-direct/main.go'
      - 'tools/tp27-tcp-direct/go.mod'
      - '.github/workflows/tp27-direct-tun-fd-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/tp27-tcp-direct/main.go'
      - 'tools/tp27-tcp-direct/go.mod'
      - '.github/workflows/tp27-direct-tun-fd-smoke.yml'

jobs:
  carrier:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Guard TUN fd lifecycle and bounded writes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('tools/tp27-tcp-direct/main.go').read_text(encoding='utf-8')

          open_start = source.index('func openTun(')
          write_start = source.index('\nfunc writeTunPacket(', open_start)
          configure_start = source.index('\nfunc configureTun(', write_start)
          open_body = source[open_start:write_start]
          write_body = source[write_start:configure_start]

          legacy = 'os.OpenFile("/dev/net/tun"'
          raw_open = 'syscall.Open("/dev/net/tun", syscall.O_RDWR|syscall.O_CLOEXEC, 0)'
          ioctl = 'syscall.SYS_IOCTL'
          nonblock = 'syscall.SetNonblock(fd, true)'
          wrap = 'os.NewFile(uintptr(fd), "/dev/net/tun")'
          cleanup = 'syscall.Close(fd)'

          assert legacy not in open_body, open_body
          for marker in (raw_open, ioctl, nonblock, wrap, cleanup):
              assert marker in open_body, marker

          assert open_body.index(raw_open) < open_body.index(ioctl)
          assert open_body.index(ioctl) < open_body.index(nonblock)
          assert open_body.index(nonblock) < open_body.index(wrap)

          for marker in (
              'syscall.Write(fd, packet)',
              'tunWriteTimeout',
              'tunWriteRetryInterval',
              'syscall.EAGAIN',
              'syscall.EWOULDBLOCK',
              'io.ErrShortWrite',
          ):
              assert marker in write_body, marker

          receive_start = source.index('func receiveFrames(')
          heartbeat_start = source.index('\nfunc heartbeatLoop(', receive_start)
          receive_body = source[receive_start:heartbeat_start]

          assert 'tunWriteMu' not in source
          assert 'tun.Write(packet)' not in receive_body
          assert 'writeTunPacket(tun, packet)' in receive_body
          assert 'func receiveFrames(lane *laneConn, tun *os.File) error' in receive_body

          print('TP27_DIRECT_TUN_FD_ORDER=PASS')
          print('TP27_DIRECT_TUN_WRITE_BOUND=PASS')
          print('TP27_DIRECT_GLOBAL_TUN_WRITE_HOL=ABSENT')
          PY

      - name: Verify gofmt
        run: |
          cp tools/tp27-tcp-direct/main.go /tmp/tp27-main.go.before
          gofmt -w tools/tp27-tcp-direct/main.go
          cmp /tmp/tp27-main.go.before tools/tp27-tcp-direct/main.go

      - name: Vet carrier
        working-directory: tools/tp27-tcp-direct
        run: go vet ./...

      - name: Build Linux x86_64 carrier
        working-directory: tools/tp27-tcp-direct
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w' -o /tmp/tp27-tcp-direct .

      - name: Verify CLI contract
        run: |
          /tmp/tp27-tcp-direct -h > /tmp/tp27-help.txt 2>&1 || true
          grep -F -- '-token-file' /tmp/tp27-help.txt
          grep -F -- '-lanes' /tmp/tp27-help.txt
          grep -F -- '-tun' /tmp/tp27-help.txt
