name: Public Connect Live V4 Smoke

on:
  pull_request:
    paths:
      - "backend/app/main.py"
      - "backend/app/routers/public_connection_live_v4.py"
      - "backend/app/routers/public_connection_hub_v5.py"
      - "backend/app/routers/public_connection_hub_live_v5.py"
      - "backend/app/routers/public_connection_hub_refine_v6.py"
      - "app/layout.tsx"
      - "app/panel-copy-density-final.css"
      - ".github/workflows/public-connect-live-v4-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/main.py"
      - "backend/app/routers/public_connection_live_v4.py"
      - "backend/app/routers/public_connection_hub_v5.py"
      - "backend/app/routers/public_connection_hub_live_v5.py"
      - "backend/app/routers/public_connection_hub_refine_v6.py"
      - "app/layout.tsx"
      - "app/panel-copy-density-final.css"
      - ".github/workflows/public-connect-live-v4-smoke.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile public connection routers
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_live_v4.py \
            backend/app/routers/public_connection_hub_v5.py \
            backend/app/routers/public_connection_hub_live_v5.py \
            backend/app/routers/public_connection_hub_refine_v6.py \
            backend/app/main.py

      - name: Verify live route precedence, polling and V6 refinement contract
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("backend/app/main.py").read_text()
          legacy_live = Path("backend/app/routers/public_connection_live_v4.py").read_text()
          hub = Path("backend/app/routers/public_connection_hub_v5.py").read_text()
          hub_live = Path("backend/app/routers/public_connection_hub_live_v5.py").read_text()
          refine = Path("backend/app/routers/public_connection_hub_refine_v6.py").read_text()
          layout = Path("app/layout.tsx").read_text()
          css = Path("app/panel-copy-density-final.css").read_text()

          # Exact public page is owned by Live V5 before V4/V3 compatibility fallbacks.
          assert "public_connection_hub_live_v5_router" in main
          assert main.index("app.include_router(public_connection_hub_live_v5_router)") < main.index("app.include_router(public_connection_live_v4_router)")
          assert main.index("app.include_router(public_connection_live_v4_router)") < main.index("app.include_router(public_connection_v3_router)")

          # V4 remains the telemetry source and retains the 3-second polling contract.
          assert '@router.get("/{token}/live")' in legacy_live
          assert "active_sessions" in legacy_live
          assert "starts_at" in legacy_live and "expires_at" in legacy_live

          # V5 keeps real account-delivery data and the live wrapper keeps existing IDs.
          assert '@router.get("/{token}", response_class=HTMLResponse)' in hub
          assert "_public_payload" in hub and "_usage_payload" in hub
          assert "setInterval(refresh,3000)" in hub_live
          assert "liveUsed" in hub_live and "liveStart" in hub_live and "liveStatus" in hub_live
          assert "refine_public_connection_hub_html(source)" in hub_live

          # V6 is presentation-only and scales the real cards already rendered by V5.
          assert "TWINPANEL_PUBLIC_CONNECT_HUB_REFINEMENT_V6" in refine
          assert 'data-hub-filter="recommended"' in refine
          assert 'data-hub-filter="classic"' in refine
          assert 'data-hub-filter="modern"' in refine
          assert 'data-hub-filter="all"' in refine
          assert "document.querySelectorAll('.protocol-choice')" in refine
          assert "smart-action .qr" in refine
          assert "hubQrModal" in refine
          assert "var(--p),var(--s)" in refine
          assert "!important" not in refine

          # V6 must not become another data/provisioning layer.
          forbidden = (
              "SessionLocal",
              "db.add(",
              "db.commit(",
              "subprocess",
              "asyncssh",
              "ProtocolCredential",
              "QuotaDevice",
          )
          assert all(token not in refine for token in forbidden)

          # Existing panel density contract remains available.
          assert "panel-copy-density-final.css" in layout
          assert ".page > .page-head > div > small" in css
          assert ".reseller-connection-modal .reseller-connection-card" in css
          assert "168px" in css
          PY
