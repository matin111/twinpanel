name: Public Connect Live V4 Smoke

on:
  pull_request:
    paths:
      - "backend/app/main.py"
      - "backend/app/routers/public_connection_live_v4.py"
      - "backend/app/routers/public_connection_hub_v5.py"
      - "backend/app/routers/public_connection_hub_live_v5.py"
      - "backend/app/routers/public_connection_hub_refine_v6.py"
      - "backend/app/routers/public_connection_mobile_v7.py"
      - "backend/app/routers/public_connection_multilink_v7.py"
      - "backend/app/routers/public_connection_hub_v8.py"
      - "backend/app/routers/public_connection_hub_v9.py"
      - "backend/app/routers/public_connection_device_actions_v11.py"
      - "backend/app/routers/public_connection_modern_delivery_v13.py"
      - "backend/app/routers/public_connection_protocol_subscriptions_v30.py"
      - "backend/app/routers/public_connection_canonical_mobile_v26.py"
      - "backend/app/routers/public_connection_forward_v34.py"
      - "backend/app/routers/public_connection_all_multilink_v34.py"
      - "backend/app/routers/public_connection_app_download_v34.py"
      - "backend/app/routers/public_connection_forward_mount_v34.py"
      - "backend/app/routers/public_connection_files_v9.py"
      - "app/layout.tsx"
      - "app/panel-copy-density-final.css"
      - ".github/workflows/public-connect-live-v4-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/main.py"
      - "backend/app/routers/public_connection_live_v4.py"
      - "backend/app/routers/public_connection_hub_v5.py"
      - "backend/app/routers/public_connection_hub_live_v5.py"
      - "backend/app/routers/public_connection_hub_refine_v6.py"
      - "backend/app/routers/public_connection_mobile_v7.py"
      - "backend/app/routers/public_connection_multilink_v7.py"
      - "backend/app/routers/public_connection_hub_v8.py"
      - "backend/app/routers/public_connection_hub_v9.py"
      - "backend/app/routers/public_connection_device_actions_v11.py"
      - "backend/app/routers/public_connection_modern_delivery_v13.py"
      - "backend/app/routers/public_connection_protocol_subscriptions_v30.py"
      - "backend/app/routers/public_connection_canonical_mobile_v26.py"
      - "backend/app/routers/public_connection_forward_v34.py"
      - "backend/app/routers/public_connection_all_multilink_v34.py"
      - "backend/app/routers/public_connection_app_download_v34.py"
      - "backend/app/routers/public_connection_forward_mount_v34.py"
      - "backend/app/routers/public_connection_files_v9.py"
      - "app/layout.tsx"
      - "app/panel-copy-density-final.css"
      - ".github/workflows/public-connect-live-v4-smoke.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile public connection routers
        run: |
          python -m py_compile \
            backend/app/routers/public_connection_live_v4.py \
            backend/app/routers/public_connection_hub_v5.py \
            backend/app/routers/public_connection_hub_live_v5.py \
            backend/app/routers/public_connection_hub_refine_v6.py \
            backend/app/routers/public_connection_mobile_v7.py \
            backend/app/routers/public_connection_multilink_v7.py \
            backend/app/routers/public_connection_hub_v8.py \
            backend/app/routers/public_connection_hub_v9.py \
            backend/app/routers/public_connection_device_actions_v11.py \
            backend/app/routers/public_connection_modern_delivery_v13.py \
            backend/app/routers/public_connection_protocol_subscriptions_v30.py \
            backend/app/routers/public_connection_canonical_mobile_v26.py \
            backend/app/routers/public_connection_forward_v34.py \
            backend/app/routers/public_connection_all_multilink_v34.py \
            backend/app/routers/public_connection_app_download_v34.py \
            backend/app/routers/public_connection_forward_mount_v34.py \
            backend/app/routers/public_connection_files_v9.py \
            backend/app/main.py

      - name: Parse V8, retired V9, V26 and V34 inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          specs = (
              ("backend/app/routers/public_connection_hub_v8.py", "_V8_SCRIPT", "/tmp/twinpanel-public-connect-v8.js"),
              ("backend/app/routers/public_connection_hub_v9.py", "_V9_SCRIPT_TEMPLATE", "/tmp/twinpanel-public-connect-v9.js"),
              ("backend/app/routers/public_connection_canonical_mobile_v26.py", "_SCRIPT", "/tmp/twinpanel-public-connect-v26.js"),
              ("backend/app/routers/public_connection_forward_v34.py", "_SCRIPT", "/tmp/twinpanel-public-connect-v34.js"),
          )
          for path, name, output in specs:
              source = Path(path).read_text()
              match = re.search(rf'{name}\s*=\s*r"""(.*?)"""', source, re.S)
              assert match, f"{name} script block not found"
              script = match.group(1).strip().replace("__TOKEN__", '"test-token"')
              script = re.sub(r'^<script[^>]*>\s*', '', script)
              script = re.sub(r'\s*</script>$', '', script)
              Path(output).write_text(script)
          PY
          node --check /tmp/twinpanel-public-connect-v8.js
          node --check /tmp/twinpanel-public-connect-v9.js
          node --check /tmp/twinpanel-public-connect-v26.js
          node --check /tmp/twinpanel-public-connect-v34.js

      - name: Verify live route precedence and V34 Public Connect contract
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("backend/app/main.py").read_text()
          legacy_live = Path("backend/app/routers/public_connection_live_v4.py").read_text()
          hub_live = Path("backend/app/routers/public_connection_hub_live_v5.py").read_text()
          refine = Path("backend/app/routers/public_connection_hub_refine_v6.py").read_text()
          mobile = Path("backend/app/routers/public_connection_mobile_v7.py").read_text()
          multilink = Path("backend/app/routers/public_connection_multilink_v7.py").read_text()
          v8 = Path("backend/app/routers/public_connection_hub_v8.py").read_text()
          v9 = Path("backend/app/routers/public_connection_hub_v9.py").read_text()
          v11 = Path("backend/app/routers/public_connection_device_actions_v11.py").read_text()
          v13 = Path("backend/app/routers/public_connection_modern_delivery_v13.py").read_text()
          v30 = Path("backend/app/routers/public_connection_protocol_subscriptions_v30.py").read_text()
          v26 = Path("backend/app/routers/public_connection_canonical_mobile_v26.py").read_text()
          v34 = Path("backend/app/routers/public_connection_forward_v34.py").read_text()
          multi34 = Path("backend/app/routers/public_connection_all_multilink_v34.py").read_text()
          app34 = Path("backend/app/routers/public_connection_app_download_v34.py").read_text()
          mount34 = Path("backend/app/routers/public_connection_forward_mount_v34.py").read_text()
          files = Path("backend/app/routers/public_connection_files_v9.py").read_text()
          layout = Path("app/layout.tsx").read_text()
          css = Path("app/panel-copy-density-final.css").read_text()

          assert "public_connection_hub_live_v5_router" in main
          assert main.index("app.include_router(public_connection_hub_live_v5_router)") < main.index("app.include_router(public_connection_live_v4_router)")
          assert main.index("app.include_router(public_connection_live_v4_router)") < main.index("app.include_router(public_connection_v3_router)")

          assert '@router.get("/{token}/live")' in legacy_live
          assert "active_sessions" in legacy_live
          assert "starts_at" in legacy_live and "expires_at" in legacy_live
          assert "setInterval(refresh,3000)" in hub_live

          assert "TWINPANEL_PUBLIC_CONNECT_HUB_REFINEMENT_V6" in refine
          assert "navigator.share" in mobile
          assert "new File" in mobile
          assert '"/{token}/subscription/v2ray"' in multilink
          assert "TWINPANEL_PUBLIC_CONNECT_HUB_V8" in v8

          assert "public_connection_files_v9_router" in hub_live
          assert "router.include_router(public_connection_files_v9_router)" in hub_live
          assert "refine_public_connection_hub_v9" not in hub_live
          assert "refine_public_connection_canonical_mobile_v26(source)" in hub_live
          assert '"/{token}/file/{protocol}/{item_index}"' in files
          assert '"Content-Disposition"' in files
          assert 'attachment; filename=' in files
          assert '"X-Content-Type-Options": "nosniff"' in files
          assert '"application/x-openvpn-profile"' in files
          assert '"openvpn"' in files and '"wireguard"' in files

          # V9 remains source-only and not part of active presentation.
          assert "TWINPANEL_PUBLIC_CONNECT_HUB_V9" in v9
          assert "High Availability Config" in v9
          assert "v9-config-card" in v9
          assert "v9-server-row" in v9
          assert "sendRealFile" in v9
          assert "response.arrayBuffer()" in v9
          assert "navigator.share" in v9
          assert "!important" not in v9

          # V11 owns platform detection and V34 consumes its data attribute.
          assert "navigator.userAgentData" in v11
          assert "body.dataset.tpPlatform=platform" in v11
          assert "navigator.userAgentData" not in v34
          assert "navigator.userAgent||" not in v34
          assert "dataset?.tpPlatform" in v34

          # V26 is phone cleanup only; V34 is the single final UI authority.
          assert "TWINPANEL_PUBLIC_CONNECT_CANONICAL_MOBILE_V26" in v26
          assert ".v9-mobile-stack" in v26
          assert ".v17-mobile-stack" in v26
          assert ".v8-app-launch" in v26
          assert "return refine_public_connection_forward_v34(source)" in v26
          assert "public_connection_forward_mount_v34" in v26
          assert "TWINPANEL_PUBLIC_CONNECT_FORWARD_V34" in v34
          assert "CLIENTS as V13_CLIENTS" in v34
          assert "const CLIENTS={" not in v34
          assert "کپی کانفیگ" not in v34
          assert "کپی لینک اتصال" in v34
          assert "دانلود کانفیگ" in v34

          # Customer-facing subscription UI is exactly the proven V30 cohort.
          assert 'SUPPORTED_PROTOCOLS = ("v2ray", "hysteria2", "tuic", "anytls")' in v30
          assert "const SUBSCRIPTIONS=new Set(['v2ray','hysteria2','tuic','anytls']);" in v34
          assert "+'/sub/'+" in v34
          assert "+'/multi/'+" not in v34
          assert "کپی لینک اشتراک" in v34
          assert "افزودن همه به " in v34

          # Canonical V13 mapping remains the source of client names.
          assert '"snell": {' in v13
          assert '("sing-box Desktop", "https://github.com/SagerNet/sing-box-for-desktop/releases/latest")' in v13
          assert '("TrustTunnel GUI", "https://github.com/blazuryk/TrustTunnel-GUI-Client/releases/latest")' in v13

          # Legacy V34 multi backend remains mounted for compatibility only.
          for protocol in (
              "openvpn", "wireguard", "v2ray", "hysteria2", "tuic", "anytls",
              "naive", "shadowtls", "snell", "mieru", "trusttunnel", "amneziawg", "sudoku",
          ):
              assert f'"{protocol}"' in multi34
          assert '"/{token}/multi/{protocol}"' in multi34
          assert '"/{token}/multi/{protocol}/meta"' in multi34
          assert "NATIVE_BUNDLE_PROTOCOLS" in multi34
          assert "public_connection_all_multilink_v34_router" in mount34
          assert "public_connection_app_download_v34_router" in mount34

          # Existing direct-download resolver remains backward compatible.
          assert '"/app-download/{app}/{platform}"' in app34
          assert 'GitHubAsset("KaringX/karing", r"_android_arm64-v8a\\.apk$")' in app34
          assert "_android_arm\\.apk$" not in app34
          assert 'GitHubAsset("amnezia-vpn/amneziawg-android", r"AmneziaWG-.*\\.apk$")' in app34
          assert "browser_download_url" in app34
          assert "karing.app/en/quickstart" not in app34
          assert "How-to-install-Hiddify-app" not in app34

          assert "MutationObserver" not in v34
          assert "setTimeout(apply" not in v34
          assert "while(row.children.length>2)" in v34

          forbidden = (
              "db.add(",
              "db.commit(",
              "subprocess",
              "asyncssh",
              "ProtocolCredential(",
              "QuotaDevice",
          )
          assert all(token not in mobile for token in forbidden)
          assert all(token not in multilink for token in forbidden)
          assert all(token not in v8 for token in forbidden)
          assert all(token not in v9 for token in forbidden)
          assert all(token not in v26 for token in forbidden)
          assert all(token not in v34 for token in forbidden)
          assert all(token not in files for token in forbidden)

          assert "panel-copy-density-final.css" in layout
          assert ".page > .page-head > div > small" in css
          assert ".reseller-connection-modal .reseller-connection-card" in css
          assert "168px" in css
          PY
