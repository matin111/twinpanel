name: TwinConnect Android WireGuard Native Build

on:
  pull_request:
    paths:
      - "clients/twinconnect/native/android/**"
      - "clients/twinconnect/tools/install_android_native.py"
      - "clients/twinconnect/lib/android_*.dart"
      - "clients/twinconnect/lib/main.dart"
      - "clients/twinconnect/lib/native_vpn_bridge.dart"
      - "clients/twinconnect/lib/vpn_policy.dart"
      - "clients/twinconnect/pubspec.yaml"
      - ".github/workflows/twinconnect-android-native.yml"

jobs:
  android-wireguard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Public license-center bootstrap; per-tenant panel domains resolve dynamically.
      TWINCONNECT_DIRECTORY_URLS: ${{ vars.TWINCONNECT_DIRECTORY_URLS || 'https://panel.matindnspro.sbs,https://167-104-219-168.sslip.io' }}
    defaults:
      run:
        working-directory: clients/twinconnect
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.twinpanel --project-name twinconnect .
      - name: Install native source and pinned WireGuard dependency
        run: python tools/install_android_native.py
      - name: Verify explicit VPN permission and native service
        shell: bash
        run: |
          grep -F 'GoBackend$VpnService' android/app/src/main/AndroidManifest.xml
          grep -F 'com.wireguard.android:tunnel:1.0.20260102' android/app/build.gradle.kts
          grep -F 'OPENCONNECT_CORE_NOT_INSTALLED' lib/android_tunnel.dart
      - name: Fetch packages
        run: flutter pub get
      - name: Dart static analysis
        run: flutter analyze --no-fatal-infos
      - name: Dart tests
        run: flutter test --reporter expanded
      - name: Verify redundant HTTPS directory mirrors before build
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from urllib.parse import urlsplit
          origins = [origin.strip().rstrip("/") for origin in
                     os.environ["TWINCONNECT_DIRECTORY_URLS"].split(",") if origin.strip()]
          if len(origins) < 2 or len(origins) > 8 or len(set(origins)) != len(origins):
              raise SystemExit("At least two unique license-directory mirrors are required")
          for origin in origins:
              url = urlsplit(origin)
              if (url.scheme != "https" or not url.hostname or url.username or
                  url.password or url.path or url.query or url.fragment):
                  raise SystemExit("Invalid license directory origin")
              with urllib.request.urlopen(origin + "/v1/app/resolve/TP934FE9", timeout=15) as response:
                  data = json.load(response)
              if data.get("namespace") != "TP934FE9" or not str(data.get("api_origin", "")).startswith("https://"):
                  raise SystemExit("License directory mirror failed identity validation")
          print("Verified %s HTTPS directory mirrors" % len(origins))
          PY
      - name: Compile native Kotlin and Android debug APK with failover
        run: flutter build apk --debug "--dart-define=TWINCONNECT_DIRECTORY_URLS=$TWINCONNECT_DIRECTORY_URLS"
      - name: Upload unsigned debugging APK
        uses: actions/upload-artifact@v4
        with:
          name: twinconnect-android-wireguard-debug
          path: clients/twinconnect/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
