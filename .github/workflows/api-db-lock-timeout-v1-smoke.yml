name: TwinPanel API DB Lock Timeout V1 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/database.py'
      - '.github/workflows/api-db-lock-timeout-v1-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DB smoke dependencies
        run: |
          python -m pip install \
            'SQLAlchemy==2.0.43' \
            'pydantic==2.11.7' \
            'pydantic-settings==2.10.1'

      - name: Verify bounded PostgreSQL lock waits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('backend/app/database.py').read_text()
          assert 'TWINPANEL_API_DB_LOCK_TIMEOUT_V2' in source
          assert 'lock_timeout=3000' in source
          assert 'postgresql://' in source
          assert 'postgresql+psycopg2://' in source
          assert 'else {}' in source
          assert 'connect_args=_DATABASE_CONNECT_ARGS' in source
          print('PostgreSQL-scoped API DB lock timeout contract OK')
          PY

      - name: Verify SQLite compatibility
        env:
          APP_NAME: TwinPanel-DB-Lock-CI
          APP_ENV: test
          APP_SECRET_KEY: db-lock-ci-secret-db-lock-ci-secret
          DATABASE_URL: sqlite:////tmp/twinpanel-db-lock-ci.db
          REDIS_URL: redis://127.0.0.1:6379/15
          NODE_AGENT_SHARED_SECRET: db-lock-ci-node-secret-db-lock-ci-node-secret
        run: |
          PYTHONPATH=backend python3 - <<'PY'
          from app.database import engine
          assert engine.dialect.name == 'sqlite'
          with engine.connect() as conn:
              assert conn.exec_driver_sql('SELECT 1').scalar() == 1
          print('SQLite compatibility OK')
          PY

      - name: Compile database module
        run: python3 -m py_compile backend/app/database.py
