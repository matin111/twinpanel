name: Temporary Reseller Request Flow Patch

on:
  push:
    branches:
      - fix/telegram-reseller-request-conditions
    paths:
      - .github/workflows/tmp-reseller-request-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-reseller-request-conditions
          fetch-depth: 0
      - name: Apply reseller request flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/telegram_account_link_bot.py')
          s = path.read_text()

          s = s.replace(
              'MAIN_HOME_CALLBACK = "main:home"\nDEFAULT_BRAND_NAME = "TwinPanel"',
              'MAIN_HOME_CALLBACK = "main:home"\nRESELLER_REQUEST_CALLBACK = "reseller:request"\nRESELLER_CONFIRM_CALLBACK = "reseller:confirm"\nDEFAULT_BRAND_NAME = "TwinPanel"',
          )

          s = s.replace(
              'class AccountLinkState(StatesGroup):\n    username = State()\n',
              'class AccountLinkState(StatesGroup):\n    username = State()\n\n\nclass ResellerRequestState(StatesGroup):\n    application = State()\n',
          )

          s = s.replace(
              'text="🤝 درخواست نمایندگی",\n                    callback_data="ts:send",',
              'text="🤝 درخواست نمایندگی",\n                    callback_data=RESELLER_REQUEST_CALLBACK,',
          )

          marker = 'def _connect_keyboard():\n'
          block = '''def _reseller_conditions_keyboard():
              return InlineKeyboardMarkup(
                  inline_keyboard=[
                      [
                          InlineKeyboardButton(
                              text="✅ شرایط را دارم — ثبت درخواست",
                              callback_data=RESELLER_CONFIRM_CALLBACK,
                              style="success",
                          )
                      ],
                      [
                          InlineKeyboardButton(
                              text="🏠 منوی اصلی",
                              callback_data=MAIN_HOME_CALLBACK,
                              style="primary",
                          )
                      ],
                  ],
              )


          def _connect_keyboard():
          '''
          if '_reseller_conditions_keyboard' not in s:
              s = s.replace(marker, block)

          marker = '    @router.callback_query(F.data == "main:dashboard")\n'
          handlers = '''    @router.callback_query(F.data == RESELLER_REQUEST_CALLBACK)
              async def reseller_request_conditions(
                  callback: CallbackQuery,
                  state: FSMContext,
              ):
                  await state.clear()
                  await callback.answer()

                  if callback.message is not None:
                      await callback.message.edit_text(
                          "🤝 <b>شرایط دریافت نمایندگی</b>\\n\\n"
                          "لطفاً قبل از ثبت درخواست شرایط زیر را مطالعه کنید:\\n\\n"
                          "• فعالیت واقعی در زمینه فروش VPN یا خدمات اینترنتی\\n"
                          "• داشتن مشتری فعال یا کانال/پیج فروش\\n"
                          "• توانایی پشتیبانی از کاربران خود\\n"
                          "• رعایت قیمت‌گذاری و قوانین مجموعه\\n"
                          "• عدم فروش با قیمت‌های مخرب و غیرمنطقی\\n"
                          "• مسئولیت پشتیبانی مشتریان نماینده بر عهده خود نماینده است\\n"
                          "• سوءاستفاده از پنل یا فعالیت مخرب باعث مسدودی نمایندگی می‌شود\\n"
                          "• شرایط و درصد همکاری بر اساس میزان فروش و سطح نمایندگی تعیین می‌شود\\n\\n"
                          "اگر شرایط بالا را دارید، دکمه زیر را بزنید.",
                          reply_markup=_reseller_conditions_keyboard(),
                      )

              @router.callback_query(F.data == RESELLER_CONFIRM_CALLBACK)
              async def reseller_request_confirm(
                  callback: CallbackQuery,
                  state: FSMContext,
              ):
                  await state.clear()
                  await state.set_state(ResellerRequestState.application)
                  await callback.answer()

                  if callback.message is not None:
                      await callback.message.edit_text(
                          "✅ <b>ثبت درخواست نمایندگی</b>\\n\\n"
                          "لطفاً اطلاعات زیر را در یک پیام ارسال کنید:\\n\\n"
                          "1. نام و نام خانوادگی\\n"
                          "2. سابقه فروش\\n"
                          "3. تعداد تقریبی مشتری فعال\\n"
                          "4. آدرس کانال یا پیج فروش (در صورت وجود)\\n"
                          "5. توضیح کوتاه درباره نحوه فعالیت شما\\n\\n"
                          "پس از ارسال، درخواست برای پشتیبانی ثبت می‌شود.",
                          reply_markup=_cancel_keyboard(),
                      )

              @router.message(ResellerRequestState.application)
              async def reseller_request_submit(
                  message: Message,
                  state: FSMContext,
              ):
                  application = str(message.text or "").strip()

                  if len(application) < 20:
                      await message.answer(
                          "❌ اطلاعات درخواست کامل نیست. لطفاً موارد خواسته‌شده را در یک پیام ارسال کنید.",
                          reply_markup=_cancel_keyboard(),
                      )
                      return

                  try:
                      from .telegram_support_bot import _user_token

                      token = await _user_token(
                          request_fn,
                          message.from_user.id,
                      )

                      await request_fn(
                          "POST",
                          "/v1/support/tickets",
                          token=token,
                          payload={
                              "category": "other",
                              "subject": "درخواست نمایندگی",
                              "message": (
                                  "🤝 درخواست نمایندگی\\n\\n"
                                  + application
                              ),
                              "source": "telegram",
                          },
                      )
                  except Exception as exc:
                      await message.answer(
                          "❌ ثبت درخواست انجام نشد.\\n\\n"
                          + escape(str(exc)),
                          reply_markup=_cancel_keyboard(),
                      )
                      return

                  await state.clear()
                  await message.answer(
                      "✅ <b>درخواست نمایندگی ثبت شد</b>\\n\\n"
                      "درخواست شما برای پشتیبانی ارسال شد و پس از بررسی پاسخ داده می‌شود.",
                      reply_markup=main_runtime.main_keyboard(),
                  )

              @router.callback_query(F.data == "main:dashboard")
          '''
          if 'async def reseller_request_conditions' not in s:
              s = s.replace(marker, handlers)

          path.write_text(s)

          # Contract smoke: keep this flow from regressing back to direct support.
          smoke = Path('backend/tests/test_telegram_reseller_request_flow.py')
          smoke.parent.mkdir(parents=True, exist_ok=True)
          smoke.write_text('''from pathlib import Path\n\n\ndef test_reseller_request_flow_contract():\n    source = Path("backend/app/telegram_account_link_bot.py").read_text()\n    assert 'callback_data=RESELLER_REQUEST_CALLBACK' in source\n    assert 'RESELLER_CONFIRM_CALLBACK = "reseller:confirm"' in source\n    assert 'شرایط دریافت نمایندگی' in source\n    assert 'شرایط را دارم — ثبت درخواست' in source\n    assert 'subject": "درخواست نمایندگی"' in source\n    assert 'ResellerRequestState.application' in source\n''')
          PY

          python -m py_compile backend/app/telegram_account_link_bot.py
          python -m pytest -q backend/tests/test_telegram_reseller_request_flow.py

          rm .github/workflows/tmp-reseller-request-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/telegram_account_link_bot.py backend/tests/test_telegram_reseller_request_flow.py .github/workflows/tmp-reseller-request-patch.yml
          git commit -m "feat(telegram): add reseller request conditions flow"
          git push origin HEAD:fix/telegram-reseller-request-conditions
