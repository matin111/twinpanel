      - name: Bundle verified Spoof Tunnel core
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION='v3.1.0-beta.0'
          EXPECTED='4ba5597568607e864fb6d5ba4f13bac91a50456da5696d99463d6375ce2a3697'
          # The browser download endpoint intermittently returns HTTP 504.
          # Fetch the SAME pinned GitHub Release asset using the official
          # GitHub Assets API, which redirects to the verified asset CDN.
          # Preserve the original SHA-256 pin, executable checks and release
          # verification; never accept a different asset or checksum.
          ASSET_API='https://api.github.com/repos/ParsaKSH/spoof-tunnel/releases/assets/426650450'
          TMP="$(mktemp)"
          trap 'rm -f "$TMP"' EXIT

          # Prefer the official browser asset, with the same pinned version.
          # The GitHub Assets API can return HTTP 403 for anonymous requests.
          # Both paths MUST pass the identical checksum below.
          ASSET_DIRECT='https://github.com/ParsaKSH/spoof-tunnel/releases/download/v3.1.0-beta.0/spoof-linux-amd64'
          if ! curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "$ASSET_DIRECT" -o "$TMP"; then
            curl --fail --location --silent --show-error \
              --retry 4 --retry-delay 3 --retry-all-errors \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'User-Agent: TwinPanel-Verified-Release-Builder' \
              "$ASSET_API" -o "$TMP"
          fi
          ACTUAL="$(sha256sum "$TMP" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          test -s "$TMP"
          chmod 0755 "$TMP"

          mkdir -p source/backend/artifacts
          install -m 0755 "$TMP" \
            source/backend/artifacts/spoof-tunnel-linux-x86_64
          printf '%s  %s\n' "$EXPECTED" 'spoof-tunnel-linux-x86_64' \
            > source/backend/artifacts/spoof-tunnel-linux-x86_64.sha256

          source/backend/artifacts/spoof-tunnel-linux-x86_64 --help \
            > /tmp/spoof-help.txt 2>&1 || true
          grep -q 'local' /tmp/spoof-help.txt
          grep -q 'remote' /tmp/spoof-help.txt
          grep -q 'tester' /tmp/spoof-help.txt

