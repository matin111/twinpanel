name: TwinPanel Publish Prebuilt Release

on:
  push:
    branches: [main]
    paths:
      - 'releases/candidate.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twinpanel-publish-prebuilt-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: publisher

      - name: Read release candidate
        id: candidate
        working-directory: publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data=json.loads(Path('releases/candidate.json').read_text(encoding='utf-8'))
          version=str(data.get('version') or '').strip()
          source_sha=str(data.get('source_sha') or '').strip().lower()
          if not version or len(source_sha)!=40 or any(c not in '0123456789abcdef' for c in source_sha):
              raise SystemExit('invalid releases/candidate.json')
          print(f'version={version}')
          print(f'source_sha={source_sha}')
          print(f'tag=v{version}')
          print(f'asset=twinpanel-{version}-linux-x86_64.tar.gz')
          PY

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Verify candidate source version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < source/VERSION)" = "${{ steps.candidate.outputs.version }}"
          test "$(git -C source rev-parse HEAD)" = "${{ steps.candidate.outputs.source_sha }}"

      - name: Prevent stale premium sales chart in pinned release source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 publisher/scripts/verify_release_ui_parity.py \
            --source source --main publisher

      - name: Preserve payment, wallet and Telegram delivery fixes in pinned release
        shell: bash
        run: |
          set -Eeuo pipefail
          # Only release the exact implementation that is present in main.
          # A release pinned to older source must not silently replace the
          # live fixes made for verified payments and account delivery.
          for path in \
            "backend/app/routers/payment_crypto_discount.py" \
            "backend/app/routers/payments.py" \
            "backend/app/routers/wallet_payment_v2.py" \
            "components/payments-review-runtime.tsx" \
            "components/admin-payments-wallet-topups.tsx" \
            "components/subscriptions-full-runtime.tsx" \
            "components/admin-wallet-v2.tsx" \
            "components/admin-resellers-management-runtime.tsx"; do
            test -s "source/$path" && test -s "publisher/$path" || {
              echo "::error file=$path::Missing payment outcome file in release source"
              exit 1
            }
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Pinned release would erase current payment account / wallet outcomes. Re-pin to the latest main."
              exit 1
            }
          done
          grep -q 'enriched_admin_payment_intents' source/backend/app/routers/payment_crypto_discount.py
          grep -q 'telegram_early_confirmation' source/backend/app/routers/payments.py
          grep -q 'wallet_credit_status' source/backend/app/routers/wallet_payment_v2.py
          grep -q 'subscriptionId:number|null' source/components/payments-review-runtime.tsx

      - name: Preserve customer and imported renewal coupon checkout in release
        shell: bash
        run: |
          set -Eeuo pipefail
          # A pinned candidate from before the coupon hotfix must not
          # overwrite the verified live Telegram renewal checkout.
          for path in \
            "backend/app/telegram_runtime_bot.py" \
            "backend/app/telegram_subscription_import_bot_v1.py" \
            "backend/app/telegram_renewal_catalog_main_v1.py" \
            "backend/app/telegram_checkout_copy_v1.py" \
            "backend/app/routers/discounts.py" \
            "backend/tests/test_telegram_renewal_discount_wiring_v1.py" \
            "backend/tests/test_imported_renewal_coupon_checkout_v1.py"; do
            test -s "source/$path" && test -s "publisher/$path" || {
              echo "::error file=$path::Renewal coupon protection is missing from release source"
              exit 1
            }
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Pinned release would revert renewal coupons for regular or imported accounts. Pin a newer candidate containing the fix."
              exit 1
            }
          done
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          for filename in (
              "test_telegram_renewal_discount_wiring_v1.py",
              "test_imported_renewal_coupon_checkout_v1.py",
          ):
              path = Path("source/backend/tests") / filename
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name in sorted(key for key in vars(module) if key.startswith("test_")):
                  getattr(module, name)()
          print("Renewal coupon release protection passed")
          PY

      - name: Protect nonblocking subscription creation in pinned release
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/app/routers/subscription_create_fast_v1.py" \
            "lib/subscription-create-fast-api.ts" \
            "backend/tests/test_admin_fast_create_threadpool_v1.py"; do
            test -s "source/$path" && test -s "publisher/$path"
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Candidate lacks latest nonblocking subscription-create fix"
              exit 1
            }
          done
          python3 source/backend/tests/test_admin_fast_create_threadpool_v1.py -v

      - name: Protect measured Sudoku per-user accounting in pinned release
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/app/services/sudoku_shared_native_presence_v1.py" \
            "backend/scripts/twinpanel_sudoku_fast_presence_worker.py" \
            "backend/tests/sudoku_shared_native_presence_v1_smoke.py" \
            "backend/tests/test_sudoku_shared_accounting_release_v1.py"; do
            test -s "source/$path" && test -s "publisher/$path"
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Pinned release lacks real Sudoku accounting fix"
              exit 1
            }
          done
          python3 source/backend/tests/test_sudoku_shared_accounting_release_v1.py -v

      - name: Protect complete Cisco and L2TP staging on new Exit nodes
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/scripts/twinpanel_central_l2tp_node_bulk_v1.py" \
            "backend/scripts/twinpanel_central_cisco_node_bulk_v1.py" \
            "backend/tests/test_central_l2tp_node_bulk_v1.py" \
            "backend/tests/test_central_cisco_node_bulk_v1.py"; do
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Pinned release would revert Cisco/L2TP new node accounts"
              exit 1
            }
          done
          grep -Fq 'if not USERNAME.fullmatch(name) or name in usernames:' source/backend/scripts/twinpanel_central_l2tp_node_bulk_v1.py
          grep -Fq 'existing_item["username"]=row["username"]' source/backend/scripts/twinpanel_central_cisco_node_bulk_v1.py
          grep -Fq 'existing_item["username"] = row["username"]' source/backend/scripts/twinpanel_central_l2tp_node_bulk_v1.py
          # This pre-dependency release guard executes just the pure identity
          # helper without requiring SQLAlchemy/other backend packages.
          python3 - <<'PY'
          import ast
          import re
          from pathlib import Path
          from types import SimpleNamespace
          source = Path("source/backend/scripts/twinpanel_central_l2tp_node_bulk_v1.py").read_text()
          tree = ast.parse(source)
          functions = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "account_rows"]
          assert len(functions) == 1
          scope = {"USERNAME": re.compile(r"^[A-Za-z0-9_.@-]{1,128}$"), "list": list, "dict": dict}
          exec(compile(ast.Module(body=functions, type_ignores=[]), "<release-account-guard>", "exec"), scope)
          make = lambda sid,name: SimpleNamespace(id=sid,account_username=name,account_password_encrypted="ok")
          result = scope["account_rows"]([make(4091,"non ascii/نام"),make(42,"valid"),make(43,"valid")])
          assert [x["username"] for x in result] == ["tp-sub-4091","valid","tp-sub-43"]
          assert len({x["username"] for x in result}) == len(result)
          assert result == scope["account_rows"]([make(4091,"non ascii/نام"),make(42,"valid"),make(43,"valid")])
          print("Cisco/L2TP account alias release preflight passed")
          PY

      - name: Preserve quota accounting and usage-display fixes in release
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/app/services/sudoku_shared_native_presence_v1.py" \
            "backend/app/services/modern_quota_runtime_v257.py" \
            "backend/app/routers/account_delivery.py" \
            "backend/app/routers/subscriptions.py" \
            "backend/app/routers/subscription_admin_v2.py" \
            "backend/app/routers/customer_subscription_management.py" \
            "backend/tests/test_sudoku_legacy_real_accounting_v1.py" \
            "components/customer-dashboard-pro.tsx" \
            "components/customer-subscriptions-runtime.tsx"; do
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Release would revert accounting or usage reporting"
              exit 1
            }
          done
          grep -Fq "if up>0 or down>0:" source/backend/app/services/sudoku_shared_native_presence_v1.py
          grep -Fq "ss -H -tn state established" source/backend/app/services/modern_quota_runtime_v257.py
          python3 source/backend/tests/test_sudoku_legacy_real_accounting_v1.py -q

      - name: Prevent releases from reverting reserved renewal activation and configurations
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/app/reserved_renewal_service.py" \
            "backend/app/renewal_service.py" \
            "backend/tests/test_reserved_renewal_v1.py"; do
            test -s "publisher/$path" && test -s "source/$path" || {
              echo "::error file=$path::Missing reserved-renewal implementation in candidate"
              exit 1
            }
            cmp -s "publisher/$path" "source/$path" || {
              echo "::error file=$path::Pinned release would revert scheduled or immediate renewal fixes. Re-pin candidate to current main."
              exit 1
            }
          done
          grep -Fq 'activate_due_renewals(db, subscription_id=int(sub.id))' source/backend/app/renewal_service.py
          grep -Fq 'subscription_id: int | None = None' source/backend/app/reserved_renewal_service.py
          grep -Fq 'test_cross_plan_provision_errors_cannot_block_paid_renewal' source/backend/tests/test_reserved_renewal_v1.py
          python3 -m py_compile source/backend/app/renewal_service.py source/backend/app/reserved_renewal_service.py source/backend/tests/test_reserved_renewal_v1.py

      - name: Protect admin manual renewal plan selection in published releases
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "components/legacy-subscriptions-exact.tsx" \
            "lib/legacy-admin-api.ts" \
            "backend/app/routers/reserved_renewal_v1.py" \
            "backend/tests/test_admin_manual_renewal_modes_v1.py"; do
            test -s "publisher/$path" && test -s "source/$path" || {
              echo "::error file=$path::Manual renewal plan selection missing in release"
              exit 1
            }
            cmp -s "publisher/$path" "source/$path" || {
              echo "::error file=$path::Stale release would erase manual renewal plan selection"
              exit 1
            }
          done
          grep -Fq 'انتخاب از پلن‌های موجود' source/components/legacy-subscriptions-exact.tsx
          grep -Fq 'mode: Literal["legacy", "custom", "plan"]' source/backend/app/routers/reserved_renewal_v1.py
          grep -Fq 'mode?:"legacy"|"custom"|"plan"' source/lib/legacy-admin-api.ts

      - name: Guard verified-payment account display and durable delivery completion
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/app/routers/payments.py" \
            "backend/app/services/payment_fulfillment_fast_path.py" \
            "components/payments-review-runtime.tsx" \
            "backend/tests/test_payment_ready_delivery_reconcile_v1.py" \
            "backend/app/telegram_runtime_bot.py" \
            "backend/tests/test_payment_account_dispatch_proof_v1.py" \
            "backend/tests/test_main_bot_early_account_delivery.py" \
            "backend/app/routers/modern_account_delivery_v1.py" \
            "backend/tests/test_progressive_first_credential_commit_v1.py"; do
            test -s "publisher/$path" && test -s "source/$path"
            cmp -s "publisher/$path" "source/$path" || {
              echo "::error file=$path::Pinned release would erase payment account display or recovery"
              exit 1
            }
          done
          grep -Fq 'PAYMENT_FIRST_VALID_CONFIG_COMMIT_V1' source/backend/app/routers/modern_account_delivery_v1.py
          grep -Fq 'publish_first_credential=True' source/backend/app/routers/modern_account_delivery_v1.py
          grep -Fq 'EARLY_DELIVERY_TIMEOUT_SECONDS = 240.0' source/backend/app/services/payment_fulfillment_fast_path.py
          grep -Fq 'order.status not in {"provisioning", "fulfilled"}' source/backend/app/services/payment_fulfillment_fast_path.py
          grep -Fq 'account_setup_in_progress' source/backend/app/telegram_runtime_bot.py
          grep -Fq 'reconcile_early_payment_account_delivery_once' source/backend/app/services/payment_fulfillment_fast_path.py
          grep -Fq 'account_delivery_sent' source/backend/app/telegram_runtime_bot.py
          grep -Fq 'payment_account_ready' source/backend/app/routers/payments.py
          grep -Fq 'reconcile_ready_payment_orders_once' source/backend/app/services/payment_fulfillment_fast_path.py
          grep -Fq 'created_pending_fulfillment' source/backend/app/routers/payments.py
          grep -Fq 'created_pending_fulfillment' source/components/payments-review-runtime.tsx
          python3 -m py_compile source/backend/app/routers/payments.py source/backend/app/services/payment_fulfillment_fast_path.py

      - name: Guard legacy Telegram audience safe migration
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/app/telegram_legacy_contacts_v1.py" \
            "backend/app/telegram_runtime_bot.py" \
            "backend/tests/test_telegram_legacy_contact_migration_v1.py"; do
            test -s "source/$path" && test -s "publisher/$path"
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Release lacks safe legacy audience onboarding"
              exit 1
            }
          done
          python3 source/backend/tests/test_telegram_legacy_contact_migration_v1.py -v

      - name: Guard Telegram start-only command menu on every installation
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/app/bot_text_middleware.py" \
            "backend/tests/test_main_bot_start_only_commands_v1.py"; do
            test -s "source/$path" && test -s "publisher/$path"
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Release lacks start-only command menu policy"
              exit 1
            }
          done
          python3 source/backend/tests/test_main_bot_start_only_commands_v1.py -v

      - name: Guard reseller subscription edit and renewal dialog visibility
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "components/reseller-subscriptions-parity.tsx" \
            "backend/tests/test_reseller_subscription_modal_visibility_v1.py"; do
            test -s "source/$path" && test -s "publisher/$path"
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Release missing visible reseller renewal/edit dialog fixes"
              exit 1
            }
          done
          python3 source/backend/tests/test_reseller_subscription_modal_visibility_v1.py -v

      - name: Protect live online-protocol badges in Connection and admin cards
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "components/legacy-subscriptions-exact.tsx" \
            "components/admin-subscription-live-table.tsx" \
            "backend/app/routers/public_connection_hub_live_v5.py" \
            "backend/tests/test_online_protocol_presentation_v1.py"; do
            test -s "source/$path" && test -s "publisher/$path"
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Pinned release lacks live protocol display restoration"
              exit 1
            }
          done
          python3 source/backend/tests/test_online_protocol_presentation_v1.py -v

      - name: Protect selected Tunnel and Iran Agent fixes in pinned release
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            "backend/app/node_bootstrap_control_v66.py" \
            "backend/app/routers/tunnels.py" \
            "backend/app/routers/tunnel_selected_jobs_v1.py" \
            "backend/app/provision_resilience_v278.py" \
            "backend/tests/test_tunnel_release_persistence_v1.py"; do
            test -s "source/$path" && test -s "publisher/$path"
            cmp -s "source/$path" "publisher/$path" || {
              echo "::error file=$path::Pinned release would lose tunnel bootstrap DB/Agent fixes."
              exit 1
            }
          done
          python3 source/backend/tests/test_tunnel_release_persistence_v1.py -v

      - name: Prevent stale Connection UI in published releases
        shell: bash
        run: |
          set -Eeuo pipefail
          # The candidate SHA is pinned and may predate fixes on main.
          # A prebuilt package must not overwrite a live Connection hotfix
          # with older copies of its presentation or quota telemetry files.
          for path in "backend/app/routers/public_connection_unified_surface_dates_v80.py" "backend/app/routers/public_connection_hub_live_v5.py"; do
            if ! cmp -s "source/$path" "publisher/$path"; then
              echo "::error file=$path::Release candidate is stale for Connection; create a new candidate from current main."
              exit 1
            fi
          done

      - name: Prevent regression of detached Xray node installer
        shell: bash
        run: |
          set -Eeuo pipefail
          # Release builds use a pinned source SHA; do not ship an earlier
          # detached installer that lacks TCP Reality + Vision composition.
          path="backend/scripts/twinpanel_hidden_node_install_finish_v1.py"
          test -s "publisher/$path"
          test -s "source/$path"
          if ! cmp -s "source/$path" "publisher/$path"; then
            echo "::error file=$path::Pinned release source differs from main. Recreate the candidate from current main to preserve the Xray 3-profile worker fix."
            exit 1
          fi
          grep -q 'HIDDEN_NODE_XRAY_THREE_PROFILE_RUNTIME_ACTIVE' "source/$path" || {
            echo "::error file=$path::Detached Xray worker runtime guard is missing."
            exit 1
          }
          test -s source/backend/tests/test_hidden_node_xray_runtime_composition_v1.py || {
            echo "::error::Release source is missing the detached Xray runtime regression test."
            exit 1
          }

      - name: Protect consolidated admin UI and account statistics in releases
        shell: bash
        run: |
          set -Eeuo pipefail
          # The publisher checks out an immutable candidate SHA. Guard against
          # shipping a stale artifact that replaces the combined live hotfixes.
          for path in \
            "components/legacy-subscriptions-exact.tsx" \
            "components/admin-users-runtime.tsx" \
            "components/admin-resellers-management-runtime.tsx" \
            "lib/admin-api.ts" \
            "backend/app/routers/admin_user_isolation.py"; do
            test -s "publisher/$path"
            test -s "source/$path"
            if ! cmp -s "source/$path" "publisher/$path"; then
              echo "::error file=$path::Pinned candidate differs from main; rebuild the release candidate from the latest merged source."
              exit 1
            fi
          done
          grep -Fq 'setResetTarget(item)' source/components/legacy-subscriptions-exact.tsx
          grep -Fq 'admin-user-account-count' source/components/admin-users-runtime.tsx
          grep -Fq 'reseller-admin-cards' source/components/admin-resellers-management-runtime.tsx
          grep -Fq 'reseller-management-modal{gap:10px' source/components/admin-resellers-management-runtime.tsx
          grep -Fq '"subscription_count": subscription_counts.get' source/backend/app/routers/admin_user_isolation.py
          echo "Consolidated admin UI release guard passed"

      - name: Prevent stale Add server and subscription light-mode UI
        shell: bash
        run: |
          set -Eeuo pipefail
          # A candidate is built from a pinned SHA, so reject a release that
          # would reintroduce dark Add server panels or dark subscription actions.
          for path in \
            "components/node-add-modal-bridge.tsx" \
            "app/subscription-light-actions.css" \
            "components/tunnel-protocol-runtime-v307.tsx" \
            "components/tunnel-protocol-runtime-v307.module.css" \
            "components/tunnel-server-pair-selector-v293.tsx" \
            "components/tunnel-control-center-v1.module.css" \
            "app/admin-manual-subscription-light.css" \
            "components/admin-manual-subscription-create.tsx" \
            "components/admin-subscription-create-unified.tsx"; do
            test -s "source/$path"
            test -s "publisher/$path"
            if ! cmp -s "source/$path" "publisher/$path"; then
              echo "::error file=$path::Pinned release would overwrite the latest light-mode fix. Recreate candidate from main."
              exit 1
            fi
          done
          grep -Fq 'import "./subscription-light-actions.css";' source/app/layout.tsx || {
            echo "::error file=app/layout.tsx::Subscription light-mode palette is not imported."
            exit 1
          }
          grep -Fq 'Light-only overrides for dark, low-contrast sections' source/components/node-add-modal-bridge.tsx
          grep -Fq 'html[data-theme="light"] .tp-add-node-modal .tp-add-node-card form .runtime-choice-section' source/components/node-add-modal-bridge.tsx
          grep -Fq 'html[data-theme="light"] .legacy-subscriptions-page .mobile-subscription-more-actions button' source/app/subscription-light-actions.css
          grep -Fq 'className={styles.createForm}' source/components/tunnel-protocol-runtime-v307.tsx
          grep -Fq 'className={styles.createPairGrid}' source/components/tunnel-protocol-runtime-v307.tsx
          grep -Fq '.createModalCard{' source/components/tunnel-protocol-runtime-v307.module.css
          grep -Fq ':global(html[data-theme="light"]) .createModalCard' source/components/tunnel-protocol-runtime-v307.module.css
          grep -Fq 'createPortal(<div className={styles.modal}' source/components/tunnel-server-pair-selector-v293.tsx
          grep -Fq 'z-index:6000!important' source/components/tunnel-control-center-v1.module.css
          grep -Fq 'import "./admin-manual-subscription-light.css";' source/app/layout.tsx
          grep -Fq 'body > .runtime-modal.manual-subscription-modal.tp-light-create' source/app/admin-manual-subscription-light.css
          grep -Fq 'resolved==="light"?" tp-light-create":""' source/components/admin-manual-subscription-create.tsx
          grep -Fq 'tp-unified-create-light' source/components/admin-subscription-create-unified.tsx
          grep -Fq '.runtime-modal.tp-unified-create-light form section' source/app/admin-manual-subscription-light.css
          echo "Light-mode and tunnel UI release guard passed"

      - name: Protect Telegram account link recovery in pinned releases
        shell: bash
        run: |
          set -Eeuo pipefail
          # The bot must recover URLs of suspended/expired accounts too.
          # Do not ship a pinned build reverting this to ACTIVE-only lookup.
          for path in \
            "backend/app/routers/telegram_account_link_lookup.py" \
            "backend/tests/test_telegram_account_link_inactive_recovery.py"; do
            test -s "source/$path"
            test -s "publisher/$path"
            if ! cmp -s "source/$path" "publisher/$path"; then
              echo "::error file=$path::Telegram link recovery differs from main. Re-pin the candidate."
              exit 1
            fi
          done
          grep -Fq '_lookup_single_recoverable_subscription(' source/backend/app/routers/telegram_account_link_lookup.py
          grep -Fq 'Subscription.status.in_(_LINK_RECOVERY_STATES)' source/backend/app/routers/telegram_account_link_lookup.py

      - name: Protect fast new-subscription quota validation in release source
        shell: bash
        run: |
          set -Eeuo pipefail
          # A pinned artifact must not regress to the full-fleet 20-second
          # quota inventory path that falsely suspends newly created accounts.
          for path in \
