name: TwinPanel Publish Prebuilt Release

on:
  push:
    branches: [main]
    paths:
      - 'releases/candidate.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twinpanel-publish-prebuilt-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: publisher

      - name: Read release candidate
        id: candidate
        working-directory: publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data=json.loads(Path('releases/candidate.json').read_text(encoding='utf-8'))
          version=str(data.get('version') or '').strip()
          source_sha=str(data.get('source_sha') or '').strip().lower()
          if not version or len(source_sha)!=40 or any(c not in '0123456789abcdef' for c in source_sha):
              raise SystemExit('invalid releases/candidate.json')
          print(f'version={version}')
          print(f'source_sha={source_sha}')
          print(f'tag=v{version}')
          print(f'asset=twinpanel-{version}-linux-x86_64.tar.gz')
          PY

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Verify candidate source version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < source/VERSION)" = "${{ steps.candidate.outputs.version }}"
          test "$(git -C source rev-parse HEAD)" = "${{ steps.candidate.outputs.source_sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install frontend dependencies
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --include=optional --no-audit --no-fund
          else
            npm install --include=optional --no-audit --no-fund
          fi

      - name: Build production standalone frontend
        working-directory: source
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE: ""
        run: npm run build

      - name: Setup Go for TP27 carriers
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: source/tools/tp27-masque/go.sum

      - name: Build verified TP27 MASQUE carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s source/tools/tp27-masque/go.sum
          BUILD_DIR="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DIR"' EXIT
          cp source/tools/tp27-masque/go.mod "$BUILD_DIR/go.mod"
          cp source/tools/tp27-masque/go.sum "$BUILD_DIR/go.sum"
          cp source/tools/tp27-masque/main.go "$BUILD_DIR/main.go"
          (
            cd "$BUILD_DIR"
            GOWORK=off go vet -mod=readonly ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOWORK=off \
              go build -mod=readonly -trimpath -ldflags='-s -w' \
              -o tp27-masque-linux-x86_64 .
          )
          mkdir -p source/backend/artifacts
          install -m 0755 \
            "$BUILD_DIR/tp27-masque-linux-x86_64" \
            source/backend/artifacts/tp27-masque-linux-x86_64
          (
            cd source/backend/artifacts
            sha256sum tp27-masque-linux-x86_64 \
              > tp27-masque-linux-x86_64.sha256
          )
          test -s source/backend/artifacts/tp27-masque-linux-x86_64
          grep -Eq '^[0-9a-f]{64}  tp27-masque-linux-x86_64$' \
            source/backend/artifacts/tp27-masque-linux-x86_64.sha256
          test -z "$(git -C source status --short -- tools/tp27-masque)"

      - name: Build verified TP27 Direct TCP carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DIR"' EXIT
          cp source/tools/tp27-tcp-direct/go.mod "$BUILD_DIR/go.mod"
          cp source/tools/tp27-tcp-direct/main.go "$BUILD_DIR/main.go"
          (
            cd "$BUILD_DIR"
            GOWORK=off go vet ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOWORK=off \
              go build -trimpath -ldflags='-s -w' \
              -o tp27-tcp-direct-linux-x86_64 .
            ./tp27-tcp-direct-linux-x86_64 -h >help.txt 2>&1 || true
            grep -q -- '-token-file' help.txt
            grep -q -- '-lanes' help.txt
          )
          mkdir -p source/backend/artifacts
          install -m 0755 \
            "$BUILD_DIR/tp27-tcp-direct-linux-x86_64" \
            source/backend/artifacts/tp27-tcp-direct-linux-x86_64
          (
            cd source/backend/artifacts
            sha256sum tp27-tcp-direct-linux-x86_64 \
              > tp27-tcp-direct-linux-x86_64.sha256
          )
          test -s source/backend/artifacts/tp27-tcp-direct-linux-x86_64
          grep -Eq '^[0-9a-f]{64}  tp27-tcp-direct-linux-x86_64$' \
            source/backend/artifacts/tp27-tcp-direct-linux-x86_64.sha256
          test -z "$(git -C source status --short -- tools/tp27-tcp-direct)"

      - name: Bundle verified Spoof Tunnel core
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION='v3.1.0-beta.0'
          EXPECTED='4ba5597568607e864fb6d5ba4f13bac91a50456da5696d99463d6375ce2a3697'
          URL="https://github.com/ParsaKSH/spoof-tunnel/releases/download/${VERSION}/spoof-linux-amd64"
          TMP="$(mktemp)"
          trap 'rm -f "$TMP"' EXIT

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            "$URL" -o "$TMP"
          ACTUAL="$(sha256sum "$TMP" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          test -s "$TMP"
          chmod 0755 "$TMP"

          mkdir -p source/backend/artifacts
          install -m 0755 "$TMP" \
            source/backend/artifacts/spoof-tunnel-linux-x86_64
          printf '%s  %s\n' "$EXPECTED" 'spoof-tunnel-linux-x86_64' \
            > source/backend/artifacts/spoof-tunnel-linux-x86_64.sha256

          source/backend/artifacts/spoof-tunnel-linux-x86_64 --help \
            > /tmp/spoof-help.txt 2>&1 || true
          grep -q 'local' /tmp/spoof-help.txt
          grep -q 'remote' /tmp/spoof-help.txt
          grep -q 'tester' /tmp/spoof-help.txt

      - name: Setup pinned Go for DNSTT
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false

      - name: Build verified DNSTT relay artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          DNSTT_COMMIT='e1af37b31a778cab0166788fe2549169f345d742'
          BUILD_DIR="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DIR"' EXIT

          git -C "$BUILD_DIR" init -q
          git -C "$BUILD_DIR" remote add origin https://github.com/OutlineFoundation/dnstt.git
          git -C "$BUILD_DIR" fetch -q --depth=1 origin "$DNSTT_COMMIT"
          git -C "$BUILD_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$BUILD_DIR" rev-parse HEAD)" = "$DNSTT_COMMIT"

          mkdir -p source/backend/artifacts
          for arch in amd64 arm64; do
            name="dnstt-server-linux-${arch}"
            (
              cd "$BUILD_DIR"
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOTOOLCHAIN=local \
                go build -trimpath -ldflags='-s -w' \
                -o "$name" ./dnstt-server
            )
            install -m 0755 "$BUILD_DIR/$name" "source/backend/artifacts/$name"
            (
              cd source/backend/artifacts
              sha256sum "$name" > "$name.sha256"
            )
            test -x "source/backend/artifacts/$name"
            grep -Eq "^[0-9a-f]{64}  ${name}$" \
              "source/backend/artifacts/$name.sha256"
          done

      - name: Build verified NetMod UDPGW artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake file libc6-dev
          mkdir -p source/backend/artifacts
          NETMOD_UDPGW_TEST_PORT=17300 \
            bash source/scripts/build-netmod-udpgw.sh \
              source/backend/artifacts/badvpn-udpgw-linux-amd64 \
              source/backend/artifacts/badvpn-COPYING
          grep -Eq '^[0-9a-f]{64}  source/backend/artifacts/badvpn-udpgw-linux-amd64$' \
            source/backend/artifacts/badvpn-udpgw-linux-amd64.sha256
          test -s source/backend/artifacts/badvpn-COPYING

      - name: Setup pinned Go for MasterDnsVPN
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Build verified MasterDnsVPN server artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          MASTERDNSVPN_COMMIT='acbf1c61f90786f41b975d2e2f616afbce292b29'
          BUILD_DIR="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DIR"' EXIT

          git -C "$BUILD_DIR" init -q
          git -C "$BUILD_DIR" remote add origin https://github.com/masterking32/MasterDnsVPN.git
          git -C "$BUILD_DIR" fetch -q --depth=1 origin "$MASTERDNSVPN_COMMIT"
          git -C "$BUILD_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$BUILD_DIR" rev-parse HEAD)" = "$MASTERDNSVPN_COMMIT"
          grep -q '^go 1\.25\.0$' "$BUILD_DIR/go.mod"

          mkdir -p source/backend/artifacts
          for arch in amd64 arm64; do
            name="masterdnsvpn-server-linux-${arch}"
            (
              cd "$BUILD_DIR"
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOTOOLCHAIN=local \
                go build -mod=readonly -trimpath -ldflags='-s -w' \
                -o "$name" ./cmd/server
            )
            install -m 0755 "$BUILD_DIR/$name" "source/backend/artifacts/$name"
            (
              cd source/backend/artifacts
              sha256sum "$name" > "$name.sha256"
            )
            test -x "source/backend/artifacts/$name"
            grep -Eq "^[0-9a-f]{64}  ${name}$" \
              "source/backend/artifacts/$name.sha256"
          done
          source/backend/artifacts/masterdnsvpn-server-linux-amd64 -version \
            | grep -q 'MasterDnsVPN Server Version:'

      - name: Build verified production package
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.candidate.outputs.version }}"
          SOURCE_SHA="${{ steps.candidate.outputs.source_sha }}"
          ASSET="${{ steps.candidate.outputs.asset }}"

          test -f source/.next/standalone/server.js
          test -d source/.next/standalone/.next/static
          test -n "$(find source/.next/standalone/.next/static -type f -print -quit)"
          test -x source/backend/artifacts/tp27-masque-linux-x86_64
          test -s source/backend/artifacts/tp27-masque-linux-x86_64.sha256
          test -x source/backend/artifacts/tp27-tcp-direct-linux-x86_64
          test -s source/backend/artifacts/tp27-tcp-direct-linux-x86_64.sha256
          test -x source/backend/artifacts/spoof-tunnel-linux-x86_64
          test -s source/backend/artifacts/spoof-tunnel-linux-x86_64.sha256
          test -x source/backend/artifacts/dnstt-server-linux-amd64
          test -s source/backend/artifacts/dnstt-server-linux-amd64.sha256
          test -x source/backend/artifacts/dnstt-server-linux-arm64
          test -s source/backend/artifacts/dnstt-server-linux-arm64.sha256
          test -x source/backend/artifacts/badvpn-udpgw-linux-amd64
          test -s source/backend/artifacts/badvpn-udpgw-linux-amd64.sha256
          test -s source/backend/artifacts/badvpn-COPYING
          test -x source/backend/artifacts/masterdnsvpn-server-linux-amd64
          test -s source/backend/artifacts/masterdnsvpn-server-linux-amd64.sha256
          test -x source/backend/artifacts/masterdnsvpn-server-linux-arm64
          test -s source/backend/artifacts/masterdnsvpn-server-linux-arm64.sha256
          grep -q '^4ba5597568607e864fb6d5ba4f13bac91a50456da5696d99463d6375ce2a3697  spoof-tunnel-linux-x86_64$' \
            source/backend/artifacts/spoof-tunnel-linux-x86_64.sha256

          rm -rf stage "$ASSET"
          mkdir -p stage/twinpanel/.next

          rsync -a \
            --exclude='.git' \
            --exclude='.next' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            source/ stage/twinpanel/

          cp -a source/.next/standalone stage/twinpanel/.next/standalone
          test -f stage/twinpanel/.next/standalone/server.js
          test -d stage/twinpanel/.next/standalone/.next/static
          test -n "$(find stage/twinpanel/.next/standalone/.next/static -type f -print -quit)"

          python3 - "$VERSION" "$SOURCE_SHA" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          version,source_sha=sys.argv[1:]
          payload={
              'format':'twinpanel-prebuilt-v1',
              'version':version,
              'source_sha':source_sha,
              'arch':'x86_64',
              'built_at':datetime.now(timezone.utc).isoformat(),
              'builder':'github-actions',
          }
          Path('stage/twinpanel/.twinpanel-release.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          PY

          chmod -R a+rX stage/twinpanel
          tar -C stage -czf "$ASSET" twinpanel
          SHA256="$(sha256sum "$ASSET" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$ASSET")"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${{ steps.candidate.outputs.tag }}"
          ASSET="${{ steps.candidate.outputs.asset }}"
          SOURCE_SHA="${{ steps.candidate.outputs.source_sha }}"
          VERSION="${{ steps.candidate.outputs.version }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "TwinPanel $VERSION" \
              --notes "Verified prebuilt TwinPanel production release $VERSION."
          fi

          gh release upload "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish stable manifest only after artifact exists
        working-directory: publisher
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
          ASSET: ${{ steps.candidate.outputs.asset }}
          ASSET_SHA256: ${{ steps.package.outputs.sha256 }}
          ASSET_SIZE: ${{ steps.package.outputs.size_bytes }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          candidate_path=Path('releases/candidate.json')
          candidate=json.loads(candidate_path.read_text(encoding='utf-8'))
          version=os.environ['VERSION']
          source_sha=os.environ['SOURCE_SHA'].lower()
          if str(candidate.get('version') or '').strip()!=version:
              raise SystemExit('candidate changed while release was building')
          if str(candidate.get('source_sha') or '').strip().lower()!=source_sha:
              raise SystemExit('candidate source changed while release was building')

          notes=candidate.get('notes') or {}
          manifest={
              'schema':3,
              'product':'TwinPanel',
              'channel':'stable',
              'version':version,
              'installable':True,
              'published':True,
              'released_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'repository_url':'https://github.com/matin111/twinpanel.git',
              'source_sha':source_sha,
              'github_url':'https://github.com/matin111/twinpanel',
              'license_required':False,
              'artifact':{
                  'format':'twinpanel-prebuilt-v1',
                  'arch':'x86_64',
                  'url':f"https://github.com/matin111/twinpanel/releases/download/{os.environ['TAG']}/{os.environ['ASSET']}",
                  'sha256':os.environ['ASSET_SHA256'].lower(),
                  'size_bytes':int(os.environ['ASSET_SIZE']),
              },
              'notes':notes,
          }
          Path('releases/stable.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/stable.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish TwinPanel $VERSION prebuilt release"
          git push origin HEAD:main
