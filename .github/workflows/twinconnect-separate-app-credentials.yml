name: TwinConnect Separate App Credentials V1

on:
  pull_request:
    paths:
      - "backend/app/central_app_credentials.py"
      - "backend/app/central_app_credential_models.py"
      - "backend/app/routers/central_app_credentials_v1.py"
      - "backend/app/main.py"
      - "backend/app/services/subscription_factory.py"
      - "backend/app/routers/reseller_bot_delivery_runtime_v2.py"
      - "backend/app/reseller_bot_subscription_link_runtime.py"
      - "backend/tests/test_central_app_app_credentials_contract_v1.py"
      - "clients/twinconnect/**"
      - "components/app-credential-delivery-card.tsx"
      - "components/subscription-link-delivery-modal.tsx"
      - "lib/central-app-credential-api.ts"
      - ".github/workflows/twinconnect-separate-app-credentials.yml"

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile new credential and bot paths
        run: |
          python -m py_compile \
            backend/app/central_app_credentials.py \
            backend/app/central_app_credential_models.py \
            backend/app/routers/central_app_credentials_v1.py \
            backend/app/routers/reseller_bot_delivery_runtime_v2.py \
            backend/app/reseller_bot_subscription_link_runtime.py \
            backend/tests/test_central_app_app_credentials_contract_v1.py
      - name: App login, owner and delivery regression
        run: python -m unittest discover -s backend/tests -p test_central_app_app_credentials_contract_v1.py -v
  web-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Next/React dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: TypeScript compile
        run: npx tsc --noEmit --pretty false
