name: New Node Modern Bootstrap V1 Smoke
on:
  pull_request:
    paths:
      - 'backend/app/routers/publish_node_all_users_v1.py'
      - 'backend/app/services/new_node_modern_bootstrap_v1.py'
      - 'backend/app/protocol_account_registry.py'
      - 'backend/app/routers/modern_protocol_admin_v3.py'
      - 'backend/scripts/new_node_modern_bootstrap_v1_smoke.py'
      - '.github/workflows/new-node-modern-bootstrap-v1-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Add Server Modern bootstrap lifecycle
        run: python backend/scripts/new_node_modern_bootstrap_v1_smoke.py
