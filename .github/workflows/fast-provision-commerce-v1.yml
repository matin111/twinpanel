name: Fast Provision Commerce Bridge V1

on:
  pull_request:
    paths:
      - "backend/app/reseller_owned_plans.py"
      - "backend/app/routers/reseller_owned_plans.py"
      - "backend/app/routers/reseller_bot_orders_owned_v3.py"
      - "backend/app/routers/store.py"
      - "backend/app/services/fast_provision_queue_v1.py"
      - "backend/app/services/fast_provision_worker_v1.py"
      - "backend/app/services/fast_provision_commerce_completion_v1.py"
      - "backend/tests/test_fast_provision_commerce_v1.py"
      - ".github/workflows/fast-provision-commerce-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_SECRET_KEY: smoke-test-only
      DATABASE_URL: sqlite:///./commerce-provision-smoke.sqlite3
      NODE_AGENT_SHARED_SECRET: smoke-agent-test-only
      PYTHONPATH: backend
      TWINPANEL_FAST_PROVISION_QUEUE_V1: "false"
      TWINPANEL_FAST_PROVISION_COMMERCE_V1: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Compile modified integration modules
        run: |
          python -m py_compile \
            backend/app/reseller_owned_plans.py \
            backend/app/routers/reseller_owned_plans.py \
            backend/app/routers/reseller_bot_orders_owned_v3.py \
            backend/app/routers/store.py \
            backend/app/services/fast_provision_queue_v1.py \
            backend/app/services/fast_provision_worker_v1.py \
            backend/app/services/fast_provision_commerce_completion_v1.py
      - name: Commerce + base queue behavior contracts
        run: |
          python -m pytest -q \
            backend/tests/test_fast_provision_commerce_v1.py \
            backend/tests/test_fast_provision_queue_v1.py \
            backend/tests/test_fast_provision_worker_v1.py
