name: TwinTunnel UDP Lab Tests

on:
  pull_request:
    paths:
      - "ops/twintunnel-lab/**"
      - ".github/workflows/twintunnel-udp-lab.yml"
  push:
    paths:
      - "ops/twintunnel-lab/**"
      - ".github/workflows/twintunnel-udp-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-udp-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate lab scripts without network access
        run: |
          python3 -m py_compile \
            ops/twintunnel-lab/udp_multiuser_mux.py \
            ops/twintunnel-lab/udp_mux_multi_client_probe.py \
            ops/twintunnel-lab/udp_mux_echo_targets.py \
            ops/twintunnel-lab/openvpn_udp_mux_orchestrator.py \
            ops/twintunnel-lab/openvpn_udp_mux_data_probe.py \
            ops/twintunnel-lab/udp_mux_benchmark_orchestrator.py \
            ops/twintunnel-lab/udp_mux_iran_origin_target_runner.py
          bash -n ops/twintunnel-lab/wg_multiuser_lab.sh
          bash -n ops/twintunnel-lab/wg_mux_france_server.sh
          bash -n ops/twintunnel-lab/wg_mux_iran_clients.sh
      - name: Run authenticated multi-user UDP unit tests
        run: |
          python3 -m unittest discover \
            -s ops/twintunnel-lab/tests \
            -p 'test_udp_multiuser_mux.py' -v
