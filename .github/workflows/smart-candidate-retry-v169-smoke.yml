name: Smart Candidate Retry Guard V169 Smoke

on:
  pull_request:
    paths:
      - "backend/app/smart_candidate_retry_guard_v169.py"
      - "backend/app/tunnel_transport_manager_v12.py"
      - ".github/workflows/smart-candidate-retry-v169-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/smart_candidate_retry_guard_v169.py"
      - "backend/app/tunnel_transport_manager_v12.py"
      - ".github/workflows/smart-candidate-retry-v169-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile V169 guard
        run: |
          python3 -m py_compile \
            backend/app/smart_candidate_retry_guard_v169.py \
            backend/app/tunnel_transport_manager_v12.py

      - name: Verify retry clock contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          guard = Path("backend/app/smart_candidate_retry_guard_v169.py").read_text()
          manager = Path("backend/app/tunnel_transport_manager_v12.py").read_text()
          smart = Path("backend/app/smart_transport_auto_v21.py").read_text()

          assert 'last_install_attempt_epoch' in guard
          assert 'legacy_offline_rows=immediate_retry' in guard
          assert 'smart._install_candidate_name = install_candidate_name_retry_guard_v169' in guard
          assert 'smart._install_candidate = install_candidate_retry_guard_v169' in guard

          # V169 must never use health telemetry timestamps as its retry clock.
          assert 'row.updated_at' not in guard
          assert 'getattr(row, "updated_at"' not in guard

          # Lock the production root-cause assumption so a future refactor cannot
          # silently remove the compatibility reason for this guard.
          assert 'updated = getattr(row, "updated_at", None)' in smart
          assert 'INSTALL_RETRY_SECONDS = 1800.0' in smart

          # Ordering matters: V165 registers Mieru, V167 protects installing,
          # then V169 replaces only retry scheduling before qualification loops.
          v165 = manager.index('apply_adaptive_multilane_v165()')
          v167 = manager.index('apply_smart_candidate_install_guard_v167()')
          v169 = manager.index('apply_smart_candidate_retry_guard_v169()')
          v155 = manager.index('apply_adaptive_candidate_qualification_v155()')
          assert v165 < v167 < v169 < v155

          print('SMART_CANDIDATE_RETRY_GUARD_V169_SMOKE_OK')
          PY
