name: Reserved Renewal Safety Tests

on:
  push:
    branches:
      - feature/reserved-renewal-history-v1
  pull_request:
    paths:
      - "backend/app/reserved_renewal_*"
      - "backend/app/renewal_service.py"
      - "backend/app/routers/reserved_renewal_v1.py"
      - "backend/tests/test_reserved_renewal_v1.py"
      - ".github/workflows/reserved-renewal-safety.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    env:
      APP_SECRET_KEY: test-only-do-not-use-in-production
      DATABASE_URL: sqlite:////tmp/twinpanel-renewal-ci-isolated.sqlite
      NODE_AGENT_SHARED_SECRET: test-only-do-not-use-in-production
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run renewal safety unit tests
        run: PYTHONPATH=backend python -m unittest backend.tests.test_reserved_renewal_v1 -v
      - name: Check renewal Python syntax
        run: python -m compileall -q backend/app/reserved_renewal_service.py backend/app/reserved_renewal_models.py backend/app/routers/reserved_renewal_v1.py backend/app/renewal_service.py backend/tests/test_reserved_renewal_v1.py
