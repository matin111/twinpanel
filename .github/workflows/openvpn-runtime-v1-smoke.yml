name: OpenVPN Runtime V1 Smoke

on:
  pull_request:
    paths:
      - 'backend/app/openvpn_runtime_v1.py'
      - 'backend/app/main.py'
      - 'backend/scripts/openvpn_runtime_v1_smoke.py'
      - '.github/workflows/openvpn-runtime-v1-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Test-only placeholders. Never use production secrets in CI smoke.
      APP_SECRET_KEY: smoke-only-nonprod-key
      DATABASE_URL: sqlite:///./openvpn-runtime-smoke.sqlite3
      NODE_AGENT_SHARED_SECRET: smoke-only-nonprod-agent-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python backend dependencies for import smoke
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run OpenVPN runtime regression smoke
        working-directory: backend
        run: PYTHONPATH=. python scripts/openvpn_runtime_v1_smoke.py

      - name: Compile touched Python modules
        run: |
          python -m py_compile \
            backend/app/openvpn_runtime_v1.py \
            backend/app/main.py \
            backend/scripts/openvpn_runtime_v1_smoke.py
