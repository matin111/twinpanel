name: TwinConnect AmneziaWG native core build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/twinconnect-android-openvpn-core-20261115
    paths:
      - ".github/workflows/twinconnect-amneziawg-core.yml"

jobs:
  amneziawg-native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android NDK and SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;26.1.10909125" "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch pinned upstream AmneziaWG source and submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/amnezia-vpn/amneziawg-android.git /tmp/amneziawg-android
          cd /tmp/amneziawg-android
          git checkout --detach ff15093bf3856fea0947923474870b86efb682f0
          git submodule update --init --recursive
      - name: Compile native AmneziaWG tunnel library
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/amneziawg-android
          chmod +x gradlew
          ./gradlew :tunnel:assembleRelease --no-daemon --stacktrace
          AAR=tunnel/build/outputs/aar/tunnel-release.aar
          test -s "$AAR"
          unzip -Z1 "$AAR" | grep -F 'classes.jar'
          unzip -Z1 "$AAR" | grep -E 'jni/[^/]+/libwg-go.so'
          unzip -p "$AAR" classes.jar > /tmp/awg-classes.jar
          jar tf /tmp/awg-classes.jar | grep -F 'org/amnezia/awg/backend/GoBackend.class'
          jar tf /tmp/awg-classes.jar | grep -F 'org/amnezia/awg/config/Config.class'
      - name: Stage compiled core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clients/twinconnect/native/android/amneziawg-core
          cp /tmp/amneziawg-android/tunnel/build/outputs/aar/tunnel-release.aar clients/twinconnect/native/android/amneziawg-core/
      - uses: actions/upload-artifact@v4
        with:
          name: twinconnect-amneziawg-native-aar
          path: clients/twinconnect/native/android/amneziawg-core/tunnel-release.aar
          if-no-files-found: error
