name: Main Bot Account Sublink Smoke

on:
  pull_request:
    paths:
      - "backend/app/telegram_account_link_bot.py"
      - "backend/app/telegram_main_extensions.py"
      - "backend/app/telegram_guides_bot.py"
      - "backend/app/telegram_runtime_bot.py"
      - "backend/scripts/main_bot_account_sublink_smoke.py"
      - ".github/workflows/main-bot-account-sublink-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram model dependency
        run: pip install "aiogram==3.30.0"

      - name: Compile changed bot modules
        run: |
          python -m py_compile \
            backend/app/telegram_account_link_bot.py \
            backend/app/telegram_main_extensions.py \
            backend/app/telegram_guides_bot.py

      - name: Verify owned main-bot sublink contract
        run: python backend/scripts/main_bot_account_sublink_smoke.py
