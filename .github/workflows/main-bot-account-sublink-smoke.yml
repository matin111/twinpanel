name: Main Bot Account Sublink Smoke

on:
  pull_request:
    paths:
      - "backend/app/telegram_account_link_bot.py"
      - "backend/app/telegram_admin_ops_v1.py"
      - "backend/app/routers/telegram_admin_ops_v1.py"
      - "backend/app/services/telegram_admin_receipt_push.py"
      - "backend/app/services/customer_maintenance.py"
      - "backend/scripts/admin_receipt_push_smoke.py"
      - "backend/scripts/telegram_admin_ops_smoke.py"
      - "components/admin-telegram-legacy-parity.tsx"
      - "backend/app/bot_text_middleware.py"
      - "backend/scripts/telegram_admin_home_visibility_smoke.py"
      - "backend/scripts/main_home_navigation_smoke.py"
      - "backend/app/telegram_subscription_import_bot_v1.py"
      - "backend/app/telegram_subscription_qr_v1.py"
      - "backend/scripts/telegram_combined_sublink_qr_v1_smoke.py"
      - "backend/app/routers/telegram_subscription_import_v1.py"
      - "backend/app/routers/__init__.py"
      - "backend/scripts/telegram_account_sublink_import_v1_smoke.py"
      - "backend/app/telegram_main_extensions.py"
      - "backend/app/telegram_guides_bot.py"
      - "backend/app/telegram_runtime_bot.py"
      - "backend/app/renewal_service.py"
      - "backend/scripts/imported_paid_renewal_smoke.py"
      - "backend/scripts/imported_account_password_change_smoke.py"
      - "backend/scripts/main_bot_account_sublink_smoke.py"
      - ".github/workflows/main-bot-account-sublink-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram model dependency
        run: pip install "aiogram==3.30.0" "qrcode[pil]==8.2"

      - name: Compile changed bot modules
        run: |
          python -m py_compile \
            backend/app/telegram_account_link_bot.py \
            backend/app/telegram_main_extensions.py \
            backend/app/telegram_guides_bot.py

      - name: Verify hidden admin button per recipient
        run: cd backend && python scripts/telegram_admin_home_visibility_smoke.py

      - name: Verify main home has no redundant navigation buttons
        run: python backend/scripts/main_home_navigation_smoke.py

      - name: Validate direct manual receipt notifications and action buttons
        run: python backend/scripts/admin_receipt_push_smoke.py

      - name: Validate Telegram admin operations and broadcast security
        run: python backend/scripts/telegram_admin_ops_smoke.py

      - name: Validate imported account payment and renewal contract
        run: python backend/scripts/imported_paid_renewal_smoke.py

      - name: Validate imported account password security and bot actions
        run: python backend/scripts/imported_account_password_change_smoke.py

      - name: Validate imported account management actions
        run: python backend/scripts/imported_account_management_v2_smoke.py

      - name: Verify unified sublink and QR in one Telegram message
        run: python backend/scripts/telegram_combined_sublink_qr_v1_smoke.py

      - name: Verify account import URL and bot auth contract
        run: python backend/scripts/telegram_account_sublink_import_v1_smoke.py

      - name: Verify owned main-bot sublink contract
        run: python backend/scripts/main_bot_account_sublink_smoke.py
