name: Public Connection Modern Delivery V16 Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/public_connection_modern_delivery_v16.py"
      - "backend/app/routers/public_connection_hub_live_v5.py"
      - "backend/tests/public_connection_modern_delivery_v16_smoke.py"
      - ".github/workflows/public-connection-modern-delivery-v16-smoke.yml"
  push:
    paths:
      - "backend/app/routers/public_connection_modern_delivery_v16.py"
      - "backend/app/routers/public_connection_hub_live_v5.py"
      - "backend/tests/public_connection_modern_delivery_v16_smoke.py"
      - ".github/workflows/public-connection-modern-delivery-v16-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run V16 delivery smoke
        run: python backend/tests/public_connection_modern_delivery_v16_smoke.py
