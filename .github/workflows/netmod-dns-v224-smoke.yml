name: NetMod DNS V224 Smoke

on:
  pull_request:
    paths:
      - "backend/app/routers/netmod_dns.py"
      - "backend/app/routers/__init__.py"
      - "backend/tests/test_netmod_dns_v224.py"
      - "components/dns-emergency-panel.tsx"
      - "components/ui.tsx"
      - "app/admin/dns-emergency-iran/page.tsx"
      - "app/admin/dns-emergency-masterdnsvpn/page.tsx"
      - ".github/workflows/netmod-dns-v224-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routers/netmod_dns.py"
      - "backend/app/routers/__init__.py"
      - "backend/tests/test_netmod_dns_v224.py"
      - "components/dns-emergency-panel.tsx"
      - "components/ui.tsx"
      - "app/admin/dns-emergency-iran/page.tsx"
      - "app/admin/dns-emergency-masterdnsvpn/page.tsx"
      - ".github/workflows/netmod-dns-v224-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: TwinPanel-CI
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: sqlite:////tmp/twinpanel-netmod-ci.db
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_AGENT_SHARED_SECRET: ci-node-agent-secret-ci-node-agent-secret
      PUBLIC_API_FALLBACK: http://127.0.0.1:8095
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile NetMod DNS runtime
        run: |
          python -m py_compile \
            backend/app/routers/netmod_dns.py \
            backend/tests/test_netmod_dns_v224.py
      - name: Run NetMod DNS V224 regression
        working-directory: backend
        run: pytest -q tests/test_netmod_dns_v224.py
